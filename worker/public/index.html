    const risers = all.filter((x) => x.pm.cls === "up").sort((a, b) => b.pm.pct - a.pm.pct).slice(0, 10);
    const fallers = all.filter((x) => x.pm.cls === "down").sort((a, b) => a.pm.pct - b.pm.pct).slice(0, 10);
    const row = (x) => { const net = (x.e.transfers_in_event || 0) - (x.e.transfers_out_event || 0); return `<li><span><strong>${esc(x.e.web_name)}</strong>${mine.has(x.e.id) ? ' <span class="pill acc">Yours</span>' : ""} <small class="note">${POSN(x.e)} · ${tShort(x.e.team)} · £${price(x.e.now_cost)}m · ${own10[x.e.id] || 0} of ${top.length} top-10 own</small></span><span class="pmove"><span><strong class="${x.pm.cls}">${x.pm.pct > 0 ? "+" : ""}${x.pm.pct.toFixed(0)}%</strong> ${pbar(x.pm.pct)}</span><small class="${x.pm.cls}">${x.pm.txt} · net ${net > 0 ? "+" : ""}${kfmt(net)}</small></span></li>`; };
    const myFall = fallers.filter((x) => mine.has(x.e.id)), myRise = risers.filter((x) => mine.has(x.e.id));
    INS.priceWatch = { myFall, myRise };
    box.innerHTML = `
      <div class="panel-head"><h3>Price risers and fallers</h3><span class="note">FPL's progress towards the next overnight price change (±100% = change)</span></div>
      ${myFall.length ? `<div class="ban-strip"><span class="k">Your players falling</span>${myFall.map((x) => `<span class="ban-item"><strong>${esc(x.e.web_name)}</strong>: ${x.pm.txt}</span>`).join("")}<span class="note">Sell before the drop if you were planning to anyway.</span></div>` : ""}
      <div class="v-lists">
        <div class="v-box good"><h3>Likely to rise</h3><ul class="plist pw-list">${risers.map(row).join("") || '<li class="empty">None close</li>'}</ul></div>
        <div class="v-box bad"><h3>Likely to fall</h3><ul class="plist pw-list">${fallers.map(row).join("") || '<li class="empty">None close</li>'}</ul></div>
      </div>
      <p class="note">Buying before a rise and selling before a fall builds team value: you keep half of every £0.1m rise. Projections use FPL's own price-change data and refresh on every load.</p>`;
  }

  // 9. Minutes security: how nailed each player is, from every gameweek's minutes and starts
  function renderMinSec() {
    const box = $("#minSec"); if (!box) return;
    const fin = finishedGws().filter((g) => INS.gw[g]);
    const sec = (e) => {
      const games = fin.filter((g) => (teamFx[e.team][g] || []).length);
      if (!games.length) return null;
      const mins = games.map((g) => (gwv(g, e.id) || [0])[0]), starts = games.reduce((a, g) => a + ((gwv(g, e.id) || [])[8] || 0), 0);
      const early = games.filter((g) => { const v = gwv(g, e.id); return v && v[8] >= 1 && v[0] < 60 && (teamFx[e.team][g] || []).length === 1; }).length;
      const avgM = mins.reduce((a, b) => a + b, 0) / games.length, last3 = mins.slice(-3);
      const idx = Math.round(100 * (0.55 * Math.min(1, starts / games.length) + 0.25 * (starts ? 1 - early / starts : 0) + 0.2 * Math.min(1, avgM / 90)));
      return { games: games.length, starts, early, avgM, last3, idx };
    };
    const top = top10Rivals(), own10 = {}; top.forEach((x) => squadOf(x.m).forEach((p) => (own10[p[0]] = (own10[p[0]] || 0) + 1)));
    const mineIds = baseSquad().map((p) => p[0]);
    const tmpl = Object.keys(own10).map(Number).filter((id) => !mineIds.includes(id) && own10[id] >= 3 && E[id]?.element_type > 1);
    const rows = [...mineIds.map((id) => ({ id, mine: true })), ...tmpl.map((id) => ({ id, mine: false }))].map((r) => ({ ...r, e: E[r.id], s: sec(E[r.id]) })).filter((r) => r.s && r.e.element_type > 1).sort((a, b) => a.s.idx - b.s.idx);
    const pill = (i) => (i >= 80 ? '<span class="pill ok">Secure</span>' : i >= 60 ? '<span class="pill sev2">Watch</span>' : '<span class="pill sev3">Risk</span>');
    INS.minSec = rows.filter((r) => r.mine && r.s.idx < 60 && baseSquad().find((p) => p[0] === r.id)[1] <= 11);
    box.innerHTML = `
      <div class="panel-head"><h3>Minutes security</h3><span class="note">Your outfield players and those owned by 3+ of the top 10, riskiest first</span></div>
      <div class="tbl-wrap"><table class="cards-sm ms-tbl"><thead><tr><th>Player</th><th>Security</th><th class="n">Index</th><th class="n">Starts</th><th class="n">Subbed off early</th><th class="n">Avg mins</th><th class="n">Last 3</th></tr></thead>
      <tbody>${rows.map((r) => `<tr class="${r.mine ? "me" : ""}"><td><span class="mgr"><span>${esc(r.e.web_name)}${r.mine ? ' <span class="pill acc">Yours</span>' : ` <small class="note">${own10[r.id]} of ${top.length} top-10 own</small>`}</span><small>${POSN(r.e)} · ${tShort(r.e.team)}</small></span></td><td>${pill(r.s.idx)}</td><td class="n"><strong>${r.s.idx}</strong></td><td class="n">${r.s.starts} of ${r.s.games}</td><td class="n">${r.s.early}</td><td class="n">${Math.round(r.s.avgM)}</td><td class="n">${r.s.last3.join(", ")}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">Index out of 100: 55% share of games started, 25% how often he lasts 60 minutes once started, 20% average minutes. Secure 80+, watch 60–79, risk under 60. A player who doesn't start doesn't score.</p>`;
  }

  // ---- Key insights: a summary of everything on the Insights tab, rebuilt on every load ----
  // Cards pick the single most useful finding from each section; "What's changed" compares with the last
  // snapshot this browser saw (kept until something changes, or for 24 hours) to show trends between refreshes.
  const INS = {};
  function renderSummary() {
    const box = $("#insSummary"); if (!box) return;
    if (D.source === "live" && !INS.poolFetched) {
      INS.poolFetched = true;
      const att0 = Object.values(E).filter((e) => e.element_type >= 3 && e.minutes >= 450 && (+e.expected_goals_per_90) >= 0.25).sort((a, b) => (a.goals_scored - (+a.expected_goals || 0)) - (b.goals_scored - (+b.expected_goals || 0))).slice(0, 10);
      const bps0 = Object.values(E).filter((e) => e.minutes >= 450).sort((a, b) => b.bps / b.minutes - a.bps / a.minutes).slice(0, 10);
      const val0 = INS.value ? INS.value.best.slice(0, 10).map((d) => d.e) : [];
      fetchSumm([...att0, ...bps0, ...val0].map((e) => e.id)).then(prefetchBuyPool).then(() => { if (view === "insights") renderSummary(); }).catch(() => {});
    }
    INS.swap = null;
    const TO = teamOdds();
    const mineIds = baseSquad().map((p) => p[0]), mine = new Set(mineIds);
    const lgOwn = {}; members.forEach((x) => squadOf(x.m).forEach((p) => (lgOwn[p[0]] = (lgOwn[p[0]] || 0) + 1)));
    const N = members.length;
    const fx = (e) => { const l = teamFx[e.team][gwNext] || []; return l.length ? l.map((f) => `${f.home ? "v" : "@"} ${tShort(f.opp)}`).join(", ") : "blank"; };
    const okFit = (e) => availability(e) >= 0.75 && e.status !== "s";
    const cards = [];

    // 1. Captain
    const cap = (INS.cap || []).slice().sort((a, b) => b.pts - a.pts);
    if (cap.length) {
      const c = cap[0], diff = cap.find((r) => r !== c && (lgOwn[r.e.id] || 0) <= 3 && r.pts >= c.pts * 0.8);
      const ec = GWE.eng && GWE.eng.adv.find((x) => x.sec === "cap" && x.capId);
      if (ec) {
        const e = E[ec.capId], v = E[ec.vcId];
        cards.push({ k: "cap", label: "Captain (your GW plan)", head: e.web_name, mine: true, sub: `${gp1(e).toFixed(1)} xP · ${pct((scoreChance(e, TO) || {}).p || 0)} to score · ${fx(e)} · vice ${esc(v.web_name)}`,
          foot: `${ec.t.includes("close call") ? "Close call; see the Current gameweek tab for why. " : ""}${!mine.has(c.e.id) ? `Top projected captain overall: <strong>${esc(c.e.web_name)}</strong> (${c.pts.toFixed(1)} pts), not in your squad` : `Owned by ${lgOwn[e.id] || 0} of ${N} in your league`}` });
      } else
      cards.push({ k: "cap", label: "Captain", head: c.e.web_name, mine: mine.has(c.e.id),
        sub: `${c.pts.toFixed(1)} projected captain pts · ${pct(c.c.p)} to score · ${fx(c.e)}`,
        foot: diff ? `Differential: <strong>${esc(diff.e.web_name)}</strong> (${diff.pts.toFixed(1)} pts, ${lgOwn[diff.e.id] || 0} of ${N} own)` : `Owned by ${lgOwn[c.e.id] || 0} of ${N} in your league` });
      const likely = cap.slice().sort((a, b) => b.c.p - a.c.p)[0];
      if (likely && likely !== c) cards.push({ k: "goal", label: "Most likely scorer", head: likely.e.web_name, mine: mine.has(likely.e.id), sub: `${pct(likely.c.p)} chance of scoring ${fx(likely.e)} · ${likely.c.kind === "bank" ? "Banker" : likely.c.kind === "solid" ? "Solid" : "Punt"}`, foot: `${likely.pts.toFixed(1)} projected captain pts` });
    }
    // 2. Best value buy and weakest value in your squad
    if (INS.value) {
      const bv = INS.value.best.find((d) => !mine.has(d.e.id) && buySecure(d.e).ok);
      if (bv) cards.push({ k: "buy", label: "Best value buy", head: bv.e.web_name, sub: `£${bv.x.toFixed(1)}m · ${bv.y.toFixed(1)} pts over 4 GWs · +${bv.res.toFixed(1)} above the value line`, foot: `${POSN(bv.e)} · ${tShort(bv.e.team)} · ${lgOwn[bv.e.id] || 0} of ${N} own` });
      const fit = (d) => INS.value.icpt + INS.value.slope * d;
      const starters = baseSquad().filter((p) => p[1] <= 11).map((p) => E[p[0]]);
      const myVal = starters.filter((e) => e.element_type >= 2 && e.minutes >= 300).map((e) => { const y = expertScore(e, 4, TO); return { e, y, res: y - fit(e.now_cost / 10) }; }).sort((a, b) => a.res - b.res);
      const w = myVal[0];
      if (w && w.res < -2) {
        const budget = (OFF && OFF.bank != null ? OFF.bank : myM.picks?.bank ?? lastHist(myM)[8]) + sellPrice(w.e.id);
        const tc = {}; mineIds.forEach((id) => (tc[E[id].team] = (tc[E[id].team] || 0) + 1));
        const rep = Object.values(E).filter((e) => e.element_type === w.e.element_type && !mine.has(e.id) && e.now_cost <= budget && okFit(e) && e.minutes >= 300 && ((tc[e.team] || 0) - (e.team === w.e.team ? 1 : 0)) < 3)
          .map((e) => ({ e, y: expertScore(e, 4, TO) })).sort((a, b) => b.y - a.y)[0];
        INS.swap = rep && rep.y > w.y + 3 ? { out: w.e, inn: rep.e, gain: rep.y - w.y } : null;
        // One decision across the site: defer to the GW transfer plan (best-XI gain, free transfers, bank).
        const planBuys = GWE.eng ? GWE.eng.adv.filter((x) => x.act && x.act.a === "xfer") : null;
        const planFor = planBuys && planBuys.find((x) => x.act.out === w.e.id);
        const planTxt = !planBuys ? "" : planFor ? ` <strong>Your GW${gwNext} plan sells him for ${esc(E[planFor.act.inn].web_name)}</strong>.` : planBuys.length ? ` Your GW${gwNext} plan spends your free transfers elsewhere first: ${planBuys.map((x) => `${esc(E[x.act.out].web_name)} → ${esc(E[x.act.inn].web_name)}`).join(", ")} (they add more to your best XI).` : ` Your GW${gwNext} plan rolls the transfer.`;
        if (planBuys) INS.swap = planFor ? { out: w.e, inn: E[planFor.act.inn], gain: planFor.act.gain } : null;
        cards.push({ k: "sell", label: "Weakest value in your XI", head: w.e.web_name, mine: true, sub: `£${price(w.e.now_cost)}m for ${w.y.toFixed(1)} pts over 4 GWs · ${w.res.toFixed(1)} below the value line`,
          foot: planBuys ? `Sells for £${price(sellPrice(w.e.id))}m.${planTxt}` : INS.swap ? `Upgrade: <strong>${esc(rep.e.web_name)}</strong> (£${price(rep.e.now_cost)}m, +${INS.swap.gain.toFixed(1)} pts) fits your £${price(budget)}m budget` : `Sells for £${price(sellPrice(w.e.id))}m; no clearly better ${POSN(w.e)} fits your budget` });
      }
    }
    // 3. Due a goal / hot streak
    const att = Object.values(E).filter((e) => e.element_type >= 3 && e.minutes >= 450);
    const gap = (e) => e.goals_scored - (+e.expected_goals || 0);
    // Buy suggestions only include secure starters; anyone skipped is named with the reason.
    const pickSecure = (list) => { const skipped = []; for (const e of list.slice(0, 10)) { const s = buySecure(e); if (s.ok) return { e, s, skipped }; skipped.push({ e, why: s.why }); } return { e: null, skipped }; };
    const skipTxt = (sk) => (sk.length ? ` Skipped ${sk.slice(0, 2).map((x) => `${esc(x.e.web_name)} (${x.why})`).join(", ")}.` : "");
    const dueSel = pickSecure(att.filter((e) => okFit(e) && !mine.has(e.id) && (+e.expected_goals_per_90) >= 0.25 && gap(e) <= -1).sort((a, b) => gap(a) - gap(b)));
    const due = dueSel.e;
    if (due) cards.push({ k: "goal", label: "Due a goal", head: due.web_name, sub: `${due.goals_scored} goal${due.goals_scored === 1 ? "" : "s"} from ${(+due.expected_goals).toFixed(2)} xG (${gap(due).toFixed(1)}) · £${price(due.now_cost)}m · ${minsLine(dueSel.s)}`, foot: `${tShort(due.team)} ${fx(due)} · ${due.selected_by_percent}% own · ${lgOwn[due.id] || 0} of ${N} in league.${skipTxt(dueSel.skipped)}` });
    const hot = att.filter((e) => mine.has(e.id)).sort((a, b) => gap(b) - gap(a))[0];
    if (hot && gap(hot) >= 1.5) cards.push({ k: "watch", label: "Hot streak in your squad", head: hot.web_name, mine: true, sub: `${hot.goals_scored} goal${hot.goals_scored === 1 ? "" : "s"} from ${(+hot.expected_goals).toFixed(2)} xG (+${gap(hot).toFixed(1)})`, foot: "Finishing above his chances; returns may slow down" });
    // 4. Defence target and bonus magnet
    const g90 = (e) => (e.minutes ? (+e.expected_goals_conceded || 0) / e.minutes * 90 : 9);
    const defSel = pickSecure(Object.values(E).filter((e) => e.element_type === 2 && e.minutes >= 450 && okFit(e) && !mine.has(e.id)).sort((a, b) => expertScore(b, 4, TO) - expertScore(a, 4, TO)));
    const def = defSel.e ? { e: defSel.e } : null;
    if (def) cards.push({ k: "buy", label: "Defence target", head: def.e.web_name, sub: `xGA ${g90(def.e).toFixed(2)}/90 · defcon in ~${pct(poisAtLeast(+def.e.defensive_contribution_per_90 || 0, 10))} of games · £${price(def.e.now_cost)}m · ${minsLine(defSel.s)}`, foot: `${tShort(def.e.team)} next 3: ${[0, 1, 2].map((i) => { const l = teamFx[def.e.team][gwNext + i] || []; return l.length ? tShort(l[0].opp) + (l[0].home ? " (H)" : " (A)") : "blank"; }).join(", ")}.${skipTxt(defSel.skipped)}` });
    const bpsSel = pickSecure(Object.values(E).filter((e) => e.minutes >= 450 && okFit(e) && !mine.has(e.id)).sort((a, b) => b.bps / b.minutes - a.bps / a.minutes));
    const bps = bpsSel.e;
    if (bps) cards.push({ k: "diff", label: "Bonus magnet you don't own", head: bps.web_name, sub: `${((bps.bps / bps.minutes) * 90).toFixed(1)} BPS per 90 · ${bps.bonus} bonus pts · ${bps.total_points} total · ${minsLine(bpsSel.s)}`, foot: `${POSN(bps)} · £${price(bps.now_cost)}m · ${lgOwn[bps.id] || 0} of ${N} in league own.${skipTxt(bpsSel.skipped)}` });
    // 5. Price and form trends in your squad
    const moves = mineIds.map((id) => ({ e: E[id], pm: priceMove(E[id]) })).filter((x) => x.pm.cls);
    if (moves.length) cards.push({ k: moves.some((x) => x.pm.cls === "down") ? "sell" : "watch", label: "Price moves in your squad", head: `${moves.filter((x) => x.pm.cls === "up").length} rising · ${moves.filter((x) => x.pm.cls === "down").length} falling`,
      sub: moves.slice(0, 4).map((x) => `${esc(x.e.web_name)} <span class="${x.pm.cls}">${x.pm.pct > 0 ? "+" : ""}${x.pm.pct.toFixed(0)}%</span>`).join(" · "), foot: (moves.find((x) => x.pm.cls === "down") ? `Sell fallers before the overnight update to keep the money` : `Risers gain value for you if you hold`) });
    const form = mineIds.map((id) => E[id]).filter((e) => e.minutes >= 270).map((e) => ({ e, d: parseFloat(e.form) - parseFloat(e.points_per_game) })).sort((a, b) => a.d - b.d);
    const down = form.filter((x) => x.d <= -1.5), up = form.filter((x) => x.d >= 2).reverse();
    if (down.length || up.length) cards.push({ k: down.length ? "watch" : "buy", label: "Form trend in your squad", head: [up.length ? `${up.length} heating up` : "", down.length ? `${down.length} cooling off` : ""].filter(Boolean).join(" · "),
      sub: [...up.slice(0, 2).map((x) => `${esc(x.e.web_name)} <span class="up">form ${x.e.form} vs ${x.e.points_per_game}/g</span>`), ...down.slice(0, 2).map((x) => `${esc(x.e.web_name)} <span class="down">form ${x.e.form} vs ${x.e.points_per_game}/g</span>`)].join(" · "), foot: "Form is FPL's average over the last 30 days" });
    // Deeper sections
    if (INS.capCost && INS.capCost.n) cards.push({ k: INS.capCost.totLost > 20 ? "sell" : "cap", label: "Captaincy decisions", head: `${INS.capCost.totLost ? "−" + INS.capCost.totLost : "0"} pts lost`, sub: `You captained your XI's top scorer in ${INS.capCost.right} of ${INS.capCost.n} gameweeks`, foot: `${INS.capCost.vsT10 >= 0 ? "+" : "−"}${Math.abs(INS.capCost.vsT10).toFixed(0)} captain pts versus the top 10's average captain` });
    if (INS.luck) cards.push({ k: INS.luck.me >= 0 ? "watch" : "goal", label: "Luck tracker", head: `${INS.luck.me >= 0 ? "+" : "−"}${Math.abs(INS.luck.me).toFixed(0)} pts vs expected`, sub: `Top-10 average ${INS.luck.t10 >= 0 ? "+" : "−"}${Math.abs(INS.luck.t10).toFixed(0)}`, foot: INS.luck.me >= 15 ? "Running hot: expect some regression" : INS.luck.me <= -15 ? "Running cold: returns should catch up" : "Points match what your picks deserved" });
    if (INS.t10moves) { const tb = Object.entries(INS.t10moves.ins).sort((a, b) => b[1].length - a[1].length)[0]; if (tb && tb[1].length >= 2) cards.push({ k: mine.has(+tb[0]) ? "cap" : "diff", label: "Top 10's most-bought", head: E[tb[0]].web_name, mine: mine.has(+tb[0]), sub: `Bought by ${tb[1].length} of the top 10 for GW${gwCur}: ${tb[1].map((x) => esc(firstName(x))).join(", ")}`, foot: mine.has(+tb[0]) ? "You already own him" : "Today's transfers become tomorrow's template" }); }
    if (INS.minSec && INS.minSec.length) cards.push({ k: "sell", label: "Minutes risk in your XI", head: INS.minSec.map((r) => r.e.web_name).join(", "), sub: INS.minSec.map((r) => `${esc(r.e.web_name)}: started ${r.s.starts} of ${r.s.games}, index ${r.s.idx}`).join(" · "), foot: "Players who don't start don't score" });

    // Bottom line
    // The bottom line follows the GW plan (Current gameweek tab) when it's available, so the tabs agree.
    const engCap = GWE.eng && GWE.eng.adv.find((x) => x.sec === "cap" && x.capId), engBuy = GWE.eng && GWE.eng.adv.find((x) => x.act && x.act.a === "xfer");
    const c0 = engCap ? { e: E[engCap.capId] } : cap[0], vb = INS.value && INS.value.best.find((d) => !mine.has(d.e.id));
    const sw = engBuy ? { out: E[engBuy.act.out], inn: E[engBuy.act.inn], gain: engBuy.act.gain, span: "5 GWs, best-XI gain" } : GWE.eng ? null : INS.swap;
    const bottom = [c0 ? `Captain <strong>${esc(c0.e.web_name)}</strong>` : "", sw ? `upgrade <strong>${esc(sw.out.web_name)}</strong> to <strong>${esc(sw.inn.web_name)}</strong> (+${sw.gain.toFixed(1)} pts over ${sw.span || "4 GWs"})` : GWE.eng && GWE.eng.adv.some((x) => x.sec === "buy") ? "roll your free transfer" : vb ? `the best value buy is <strong>${esc(vb.e.web_name)}</strong>` : "", due && gap(due) <= -1 ? `and keep an eye on <strong>${esc(due.web_name)}</strong>, who is due a goal` : ""].filter(Boolean).join(", ");

    // What's changed since the last snapshot this browser saw
    const lead = [...members].sort((a, b) => a.rank - b.rank).find((x) => x.entry !== me), meRow = members.find((x) => x.entry === me);
    const snap = { t: Date.now(), data: D.generated_at, cap: c0 ? c0.e.id : null, capP: Object.fromEntries(cap.slice(0, 10).map((r) => [r.e.id, +r.c.p.toFixed(3)])),
      best: INS.value ? INS.value.best.map((d) => d.e.id) : [], prices: Object.fromEntries(mineIds.map((id) => [id, E[id].now_cost])),
      news: mineIds.flatMap((id) => newsFor(E[id]).filter((x) => x.tone === "neg").map((x) => x.it.link)), gap: lead.total - meRow.total, rank: meRow.rank, odds: FA.odds ? FA.odds.fetched : null };
    const prev = store.get("insSnap", null);
    const ch = [];
    if (prev) {
      if (prev.cap && snap.cap && prev.cap !== snap.cap && E[prev.cap]) ch.push(["cap", `Top captain changed from ${esc(E[prev.cap].web_name)} to <strong>${esc(E[snap.cap].web_name)}</strong>`]);
      Object.entries(snap.capP).forEach(([id, p]) => { const q = prev.capP && prev.capP[id]; if (q != null && Math.abs(p - q) >= 0.04) ch.push([p > q ? "up" : "down", `${esc(E[id].web_name)}'s chance of scoring ${p > q ? "rose" : "fell"} from ${pct(q)} to <strong>${pct(p)}</strong>`]); });
      snap.best.filter((id) => !(prev.best || []).includes(id)).forEach((id) => ch.push(["buy", `<strong>${esc(E[id].web_name)}</strong> entered the best value picks`]));
      (prev.best || []).filter((id) => !snap.best.includes(id) && E[id]).forEach((id) => ch.push(["down", `${esc(E[id].web_name)} dropped out of the best value picks`]));
      Object.entries(snap.prices).forEach(([id, v]) => { const q = prev.prices && prev.prices[id]; if (q != null && q !== v) ch.push([v > q ? "up" : "down", `${esc(E[id].web_name)}'s price ${v > q ? "rose" : "fell"} to <strong>£${price(v)}m</strong>`]); });
      snap.news.filter((l) => !(prev.news || []).includes(l)).forEach((l) => { const it = FA.news.items.find((x) => x.link === l); if (it) ch.push(["down", `New injury or suspension story: <a href="${esc(l)}" target="_blank" rel="noopener">${esc(it.title)}</a>`]); });
      if (prev.gap != null && prev.gap !== snap.gap) ch.push([snap.gap < prev.gap ? "up" : "down", `Gap to ${esc(firstName(lead))} ${snap.gap < prev.gap ? "narrowed" : "widened"} from ${prev.gap} to <strong>${snap.gap}</strong>`]);
      if (prev.rank != null && prev.rank !== snap.rank) ch.push([snap.rank < prev.rank ? "up" : "down", `League position ${snap.rank < prev.rank ? "up" : "down"} from ${ordinal(prev.rank)} to <strong>${ordinal(snap.rank)}</strong>`]);
      if (prev.odds && snap.odds && snap.odds > prev.odds) ch.push(["cap", "Bookmaker odds were refreshed"]);
    }
    if (!prev || ch.length || Date.now() - prev.t > 24 * 3600e3) store.set("insSnap", snap);
    const since = prev ? new Date(prev.t).toLocaleString("en-GB", { timeZone: "Europe/London", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : null;

    box.innerHTML = `
      <div class="panel-head"><h2>Key insights</h2><span class="note">Summary of everything below, rebuilt from live data at ${new Date().toLocaleTimeString("en-GB", { timeZone: "Europe/London", hour: "2-digit", minute: "2-digit" })}</span></div>
      ${bottom ? `<p class="ki-bottom"><span class="k">Bottom line</span> ${bottom}.</p>` : ""}
      <div class="ki-grid">${cards.map((c) => `<div class="ki-card ki-${c.k}"><span class="ki-label">${c.label}</span><span class="ki-head">${esc(c.head)}${c.mine ? ' <span class="pill acc">Yours</span>' : ""}</span><span class="ki-sub">${c.sub}</span>${c.foot ? `<span class="ki-foot">${c.foot}</span>` : ""}</div>`).join("")}</div>
      <div class="ki-changes"><span class="k">What's changed${since ? ` since ${since}` : ""}</span>${!prev ? `<p class="note">This is the first snapshot in this browser. Next time the data changes, the trends will show here.</p>` : ch.length ? `<ul>${ch.slice(0, 10).map(([k, t]) => `<li class="ki-ch-${k}">${t}</li>`).join("")}</ul>` : `<p class="note">Nothing has moved since then: same captain, prices, value picks and news.</p>`}</div>`;
  }

  // ---- Best value: price vs projected points over the next 4 gameweeks ----
  // Defenders, midfielders and forwards with 300+ minutes: the top 18 by projected points plus the 6 most
  // expensive others. Projected points = the site's expert score over 4 gameweeks. Quadrants split at the
  // median price and median projection. Value = points above or below the least-squares line of points on price.
  async function renderValue() {
    const box = $("#valueChart"); if (!box) return;
    const H = 4;
    const pool0 = Object.values(E).filter((e) => e.element_type >= 2 && e.minutes >= 300 && availability(e) >= 0.75 && e.status !== "s");
    const TO0 = teamOdds();
    const pre = pool0.map((e) => [e, proj(e, H, TO0).total]).sort((a, b) => b[1] - a[1]).slice(0, 45).map((x) => x[0].id);
    try { await ensureFA(pre); } catch (e) { /* season minutes used */ }
    if (!document.body.contains(box)) return;
    const TO = teamOdds();
    const all = pool0.map((e) => ({ e, x: e.now_cost / 10, y: expertScore(e, H, TO) }));
    const byPts = [...all].sort((a, b) => b.y - a.y);
    const pts = byPts.slice(0, 18);
    [...all].sort((a, b) => b.x - a.x).forEach((d) => { if (pts.length < 24 && !pts.includes(d)) pts.push(d); });
    const mine = new Set(baseSquad().map((p) => p[0]));
    const med = (v) => { const a = [...v].sort((p, q) => p - q), m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
    const mx = med(pts.map((d) => d.x)), my = med(pts.map((d) => d.y));
    const n = pts.length, sx = pts.reduce((a, d) => a + d.x, 0), sy = pts.reduce((a, d) => a + d.y, 0);
    const sxx = pts.reduce((a, d) => a + d.x * d.x, 0), sxy = pts.reduce((a, d) => a + d.x * d.y, 0);
    const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx || 1), icpt = (sy - slope * sx) / n;
    pts.forEach((d) => (d.res = d.y - (icpt + slope * d.x)));
    const best = [...pts].sort((a, b) => b.res - a.res).slice(0, 5);
    const worst = pts.filter((d) => d.x >= mx).sort((a, b) => a.res - b.res).slice(0, 5);
    INS.value = { pts, best, worst, slope, icpt };

    // chart geometry
    const W = 900, Ht = 560, L = 56, Rm = 24, T = 20, B = 52;
    const xmin = Math.floor(Math.min(...pts.map((d) => d.x)) - 0.5), xmax = Math.ceil(Math.max(...pts.map((d) => d.x)) + 0.5);
    const ymax = Math.ceil((Math.max(...pts.map((d) => d.y)) + 2) / 5) * 5, ymin = Math.max(0, Math.floor((Math.min(...pts.map((d) => d.y)) - 2) / 5) * 5);
    const X = (v) => L + ((v - xmin) / (xmax - xmin)) * (W - L - Rm), Y = (v) => T + (1 - (v - ymin) / (ymax - ymin)) * (Ht - T - B);
    let g = "";
    // quadrant shading
    g += `<rect class="q-good" x="${L}" y="${T}" width="${X(mx) - L}" height="${Y(my) - T}"/><rect class="q-bad" x="${X(mx)}" y="${Y(my)}" width="${W - Rm - X(mx)}" height="${Ht - B - Y(my)}"/>`;
    for (let v = Math.ceil(xmin); v <= xmax; v += (xmax - xmin > 10 ? 2 : 1)) g += `<line class="grid" x1="${X(v)}" x2="${X(v)}" y1="${T}" y2="${Ht - B}"/><text class="ax" x="${X(v)}" y="${Ht - B + 18}" text-anchor="middle">£${v}m</text>`;
    for (let v = ymin; v <= ymax; v += 5) g += `<line class="grid" x1="${L}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
    g += `<line class="med" x1="${X(mx)}" x2="${X(mx)}" y1="${T}" y2="${Ht - B}"/><line class="med" x1="${L}" x2="${W - Rm}" y1="${Y(my)}" y2="${Y(my)}"/>`;
    g += `<text class="med-lbl" x="${X(mx) + 6}" y="${Ht - B - 6}">median £${mx.toFixed(1)}m</text><text class="med-lbl" x="${W - Rm - 4}" y="${Y(my) - 6}" text-anchor="end">median ${my.toFixed(1)}</text>`;
    g += `<text class="q-lbl good" x="${L + 10}" y="${T + 20}">BARGAINS</text><text class="q-lbl" x="${W - Rm - 10}" y="${T + 20}" text-anchor="end">PREMIUM HITS</text><text class="q-lbl" x="${L + 10}" y="${Ht - B - 12}">CHEAP FILLER</text><text class="q-lbl bad" x="${W - Rm - 10}" y="${Ht - B - 12}" text-anchor="end">OVERPRICED</text>`;
    g += `<text class="ax-t" x="${(L + W - Rm) / 2}" y="${Ht - 8}" text-anchor="middle">Price (£m)</text><text class="ax-t" transform="translate(16 ${(T + Ht - B) / 2}) rotate(-90)" text-anchor="middle">Projected points, next ${H} GWs</text>`;
    // labels: try right, left, above, below; keep clear of other labels and dots
    const placed = [], dots = pts.map((d) => ({ x: X(d.x), y: Y(d.y) }));
    const hit = (b) => placed.some((q) => b.x < q.x + q.w && b.x + b.w > q.x && b.y < q.y + q.h && b.y + b.h > q.y) || dots.some((q) => q.x > b.x - 6 && q.x < b.x + b.w + 6 && q.y > b.y - 6 && q.y < b.y + b.h + 6) || b.x < L || b.x + b.w > W - Rm || b.y < T || b.y + b.h > Ht - B;
    // Place labels where they're densest first; try spots ever further out, drawing a leader line when moved away.
    const crowd = (d) => pts.filter((o) => Math.hypot(X(o.x) - X(d.x), Y(o.y) - Y(d.y)) < 60).length;
    const labels = [...pts].sort((a, b) => crowd(b) - crowd(a) || b.y - a.y).map((d) => {
      const cx = X(d.x), cy = Y(d.y), w = d.e.web_name.length * 7.6 + 6, h = 15;
      const cands = [[cx + 11, cy - 8], [cx - 11 - w, cy - 8], [cx - w / 2, cy - 26], [cx - w / 2, cy + 11]];
      for (let k = 1; k <= 6; k++) for (const dy of [-k * 16, k * 16]) { cands.push([cx + 18, cy - 8 + dy], [cx - 18 - w, cy - 8 + dy]); }
      for (let k = 1; k <= 4; k++) for (const dy of [-k * 16, k * 16]) { cands.push([cx + 40, cy - 8 + dy], [cx - 40 - w, cy - 8 + dy]); }
      const c = cands.map(([x, y]) => ({ x, y, w, h })).find((b) => !hit(b)) || { x: cx + 11, y: cy - 8, w, h };
      placed.push(c); return { d, c, far: Math.abs(c.y + 8 - cy) > 10 || c.x > cx + 14 || c.x + c.w < cx - 14 };
    });
    const POS = { 2: "def", 3: "mid", 4: "fwd" };
    pts.forEach((d) => { g += `<circle class="v-dot p-${POS[d.e.element_type]} ${mine.has(d.e.id) ? "mine" : ""}" cx="${X(d.x)}" cy="${Y(d.y)}" r="8"><title>${esc(d.e.web_name)} (${POSN(d.e)}, ${tShort(d.e.team)}): £${d.x.toFixed(1)}m, ${d.y.toFixed(1)} projected pts over ${H} GWs, ${d.res >= 0 ? "+" : ""}${d.res.toFixed(1)} vs the value line${mine.has(d.e.id) ? " · you own him" : ""}</title></circle>`; });
    labels.forEach(({ d, c, far }) => {
      if (far) { const lx = c.x > X(d.x) ? c.x : c.x + c.w, ly = c.y + 8; g = `<line class="v-lead" x1="${X(d.x)}" y1="${Y(d.y)}" x2="${lx}" y2="${ly}"/>` + g; }
      g += `<text class="v-lbl ${mine.has(d.e.id) ? "mine" : ""}" x="${c.x + 3}" y="${c.y + 12}">${esc(d.e.web_name)}</text>`;
    });

    const list = (arr, cls) => `<ol class="v-list ${cls}">${arr.map((d) => `<li><span><strong>${esc(d.e.web_name)}</strong>${mine.has(d.e.id) ? ' <span class="pill acc">Yours</span>' : ""} <small class="note">${POSN(d.e)} · ${tShort(d.e.team)}</small></span><span class="note">£${d.x.toFixed(1)}m · ${d.y.toFixed(1)} pts · ${d.res >= 0 ? "+" : ""}${d.res.toFixed(1)} vs line</span></li>`).join("")}</ol>`;
    box.innerHTML = `
      <div class="panel-head"><h3>Best Value: Price vs Projected Points</h3><span class="note">Next ${H} gameweeks · top ${pts.length} by projected points and price · 300+ minutes · DEF, MID, FWD</span></div>
      <p class="note"><strong>How to read:</strong> further right costs more, higher scores more over the next ${H} gameweeks. Top-left is the sweet spot (cheap and productive); bottom-right means paying a premium for less. Your players have a green ring and an underlined name; hover or tap a dot for details.</p>
      <div style="overflow-x:auto"><div class="chart v-chart" style="min-width:640px"><svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Scatter chart of price against projected points for ${pts.length} players">${g}</svg></div></div>
      <div class="legend"><span><i style="background:var(--c-bank)"></i>Defender</span><span><i style="background:var(--c-solid)"></i>Midfielder</span><span><i style="background:var(--c-punt)"></i>Forward</span><span><i class="ring"></i>You own</span></div>
      <div class="v-lists">
        <div class="v-box good"><h3>Target: best value picks</h3>${list(best, "good")}</div>
        <div class="v-box bad"><h3>Avoid: overpriced for the return</h3>${list(worst, "bad")}</div>
      </div>
      <p class="note">Projected points use the site's expert score (xG, xA, clean sheet chance, defensive contributions, bonus, fixtures, bookmaker odds, minutes, injuries and news) over GW${gwNext}–${gwNext + H - 1}. "vs line" is points above or below what a player of that price typically projects (a straight-line fit across these ${pts.length} players). Injured, suspended and doubtful players are left out. A projection, not a guarantee. Updated on every reload.</p>`;
  }

  // ---------- Fixtures: rank every team's run by difficulty, attack, defence, goals or clean sheets ----------
  // Overall uses FPL's official FDR (×2, on a 1–10 scale) unless "Team strength" is on. Team strength is
  // built from this season's data (team xG and goals for attack; xG and goals conceded for defence),
  // with bookmaker odds for the next gameweek. Cells are always coloured by FPL's FDR.
  const FXS = { sort: "overall", order: "best", team: "all", g0: null, g1: null, str: false };
  let TSTR = null;
  function teamStrength() {
    if (TSTR && TSTR.gw === gwNext && TSTR.odds === FA.odds) return TSTR;
    const att = {}, def = {}, gf = {}, ga = {}, gp = {};
    D.teams.forEach((t) => { att[t.id] = 0; gf[t.id] = 0; ga[t.id] = 0; gp[t.id] = 0; });
    Object.values(E).forEach((e) => (att[e.team] += +e.expected_goals || 0));

    D.teams.forEach((t) => {
      const g = Math.max(1, gp[t.id]);
      const keeper = Object.values(E).filter((e) => e.team === t.id && e.element_type === 1).sort((a, b) => b.minutes - a.minutes)[0];
      const xga = keeper && keeper.minutes >= 270 ? +keeper.expected_goals_conceded_per_90 || 1.35 : ga[t.id] / g;
      att[t.id] = 0.6 * (att[t.id] / g) + 0.4 * (gf[t.id] / g);
      def[t.id] = 0.6 * xga + 0.4 * (ga[t.id] / g);

  }
  // Expected goals for and against one fixture (bookmaker odds for the next gameweek when available).
  function fixtureGoals(team, f, g) {
    const S = teamStrength(), mu = (S.aAtt + S.aDef) / 2;
    if (g === gwNext) { const o = teamOdds()[team], oo = teamOdds()[f.opp]; if (o && oo) return { for: o.lam, against: oo.lam }; }
    const hf = f.home ? 1.12 : 0.89, ha = f.home ? 0.89 : 1.12;
    return { for: mu * (S.att[team] / S.aAtt) * (S.def[f.opp] / S.aDef) * hf, against: mu * (S.att[f.opp] / S.aAtt) * (S.def[team] / S.aDef) * ha };

    const box = $("#fxTable"); if (!box) return;
    const gws = []; for (let g = FXS.g0; g <= FXS.g1; g++) gws.push(g);
    const mineTeams = {}; baseSquad().forEach((p) => { const t = E[p[0]]?.team; mineTeams[t] = (mineTeams[t] || 0) + 1; });
    const s = FXS.sort, higherBetter = s === "goals" || s === "cs";
    const fmtV = (v) => (s === "cs" ? pct(v) : v.toFixed(1));
    // Per-team run: each gameweek's fixtures with their value; blanks count as the worst case.
    const rows = D.teams.filter((t) => FXS.team === "all" || (FXS.team === "mine" ? mineTeams[t.id] : String(t.id) === String(FXS.team))).map((t) => {
      let home = 0, away = 0;
      const per = gws.map((g) => { const l = teamFx[t.id][g] || []; l.forEach((f) => (f.home ? home++ : away++)); return { g, l, v: l.map((f) => fxValue(t.id, f, g, s, FXS.str)) }; });
      const vals = per.flatMap((p) => (p.l.length ? p.v : [higherBetter ? 0 : 10]));
      const score = higherBetter ? (s === "goals" ? vals.reduce((a, b) => a + b, 0) : vals.reduce((a, b) => a + b, 0) / vals.length) : vals.reduce((a, b) => a + b, 0) / vals.length;
      return { t, per, score, home, away };
    });
    rows.sort((a, b) => (higherBetter ? b.score - a.score : a.score - b.score) * (FXS.order === "best" ? 1 : -1) || a.t.name.localeCompare(b.t.name));
    const runLabel = (sc) => { const good = higherBetter ? (s === "goals" ? sc / gws.length >= 1.7 : sc >= 0.38) : sc <= 5, bad = higherBetter ? (s === "goals" ? sc / gws.length <= 1.15 : sc <= 0.22) : sc >= 6.6; return good ? "Good run" : bad ? "Tough run" : "Average run"; };
    const ease = (v) => (s === "goals" ? Math.min(1, v / 2.6) : s === "cs" ? Math.min(1, v / 0.6) : (10 - v) / 9);
    const title = { overall: FXS.str ? "Overall difficulty (team strength)" : "Overall difficulty", attack: "Attacking difficulty", defence: "Defensive difficulty", goals: "Expected goals", cs: "Clean sheet chance" }[s];
    const sub = { overall: FXS.str ? "Average of attacking and defensive difficulty from team strength, on a 1–10 scale. Lower is easier." : "Average of FPL's official fixture difficulty (FDR × 2) on a 1–10 scale. Lower is easier.", attack: "How hard it is to score against each opponent, on a 1–10 scale. Lower is easier.", defence: "How hard it is to keep each opponent out, on a 1–10 scale. Lower is easier.", goals: "Expected goals the team scores in each fixture, and the total over the run. Higher is better.", cs: "Chance of a clean sheet in each fixture, and the average over the run. Higher is better." }[s];
    const dl = (g) => { const ev = D.events.find((e) => e.id === g); return ev ? new Date(ev.deadline).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : ""; };
    box.innerHTML = `<div class="panel-head fx-head"><div><h3>${title} over GW${FXS.g0}${FXS.g1 > FXS.g0 ? `–${FXS.g1}` : ""}</h3><p class="note">${sub} Cells are coloured by FPL's fixture difficulty (FDR).</p></div>
        <div class="fdr-key pr-key"><span class="note">Easier</span>${[1, 2, 3, 4, 5].map((d) => `<span class="fdr${d}">${d}</span>`).join("")}<span class="note">Harder</span></div></div>
      <div class="tbl-wrap"><table class="fx2">
        <thead><tr><th class="n">Rk</th><th>Team</th><th>${s === "goals" ? "Exp. goals" : s === "cs" ? "Clean sheets" : "Difficulty"}</th>${gws.map((g) => `<th class="fx2-g">GW${g}<small>${dl(g)}</small></th>`).join("")}</tr></thead>
        <tbody>${rows.map((r, i) => `<tr class="${mineTeams[r.t.id] ? "me" : ""}">
          <td class="n">${i + 1}</td>
          <td><span class="fx2-team">${r.t.code != null ? `<img src="kit/${r.t.code}.png" alt="" width="28" height="28" decoding="async" onerror="this.remove()">` : ""}<span><strong>${esc(r.t.name)}${mineTeams[r.t.id] ? ` <span class="pill acc" title="${mineTeams[r.t.id]} of your players">${mineTeams[r.t.id]}</span>` : ""}</strong><small>${r.home} home · ${r.away} away</small></span></span></td>
          <td><span class="fx2-avg"><b>${fmtV(r.score)}</b><span class="fx2-run"><span class="bars">${r.per.map((p) => { if (!p.l.length) return `<i class="blank" style="height:3px"></i>`; const v = p.v.reduce((a, b) => a + b, 0) / p.v.length; return `<i class="fdr${Math.max(...p.l.map((f) => f.fdr))}" style="height:${Math.round(4 + ease(v) * 16)}px"></i>`; }).join("")}</span><small>${runLabel(r.score)}</small></span></span></td>
          ${r.per.map((p) => `<td class="fx2-c">${p.l.length ? p.l.map((f, k) => `<span class="fx2-cell fdr${f.fdr}" title="GW${p.g}: ${esc(T[f.opp].name)} ${f.home ? "home" : "away"}, FDR ${f.fdr}"><span>${tShort(f.opp).toUpperCase()} <small>${f.home ? "H" : "A"}</small></span><b>${fmtV(p.v[k])}</b></span>`).join("") : `<span class="fx2-cell blank">Blank</span>`}</td>`).join("")}
        </tr>`).join("")}</tbody>
      </table></div>
      <p class="note">${FXS.str || s !== "overall" ? `Team strength comes from this season's data: attack from team xG (60%) and goals scored (40%), defence from xG conceded (60%) and goals conceded (40%), adjusted for home and away. GW${gwNext} uses the bookmaker odds with the margin removed. <span class="lab lab-proj">Projection</span>` : `FDR is FPL's official fixture difficulty rating. <span class="lab lab-fact">Fact</span>`} A blank gameweek counts as the worst case; a double gameweek shows both games.</p>`;
    // your players' fixtures over the same range
    const mb = $("#fxMine");
    if (mb) {
      const squad = baseSquad().map((p) => ({ e: E[p[0]], slot: p[1] })).filter((x) => x.e).sort((a, b) => a.e.element_type - b.e.element_type || windowFdr(a.e.team, gws.length) - windowFdr(b.e.team, gws.length));
      mb.innerHTML = `<div class="panel-head"><h3>Your players' fixtures, GW${FXS.g0}${FXS.g1 > FXS.g0 ? `–${FXS.g1}` : ""}</h3><span class="note">Grouped by position, easiest run first</span></div>
        <div class="tbl-wrap"><table class="fx-tbl"><thead><tr><th>Player</th><th>Team</th><th class="n">Avg FDR</th>${gws.map((g) => `<th>GW${g}</th>`).join("")}</tr></thead>
        <tbody>${squad.map(({ e, slot }) => `<tr><td><span class="mgr">${esc(e.web_name)}<small>${D.positions[e.element_type]}${slot > 11 ? " · bench" : ""}</small></span></td><td>${tShort(e.team)}</td><td class="n">${avgBadge(windowFdr(e.team, gws.length))}</td>${fdrCells(e.team, gws)}</tr>`).join("")}</tbody></table></div>`;
    }
  }

  // ---------- rotation pairs ----------
  // Each gameweek, play whichever of the two has the easier fixture. A blank counts as 6 so the partner covers it.
  const bestFdr = (team, g) => { const l = teamFx[team][g] || []; return l.length ? Math.min(...l.map((f) => f.fdr)) : 6; };
  const pairScore = (a, b, gws) => gws.reduce((s, g) => s + Math.min(bestFdr(a, g), bestFdr(b, g)), 0) / gws.length;
  function rotationHTML() {
    let n = store.get("rotN", 5); if (!(n >= 1 && n <= 5)) n = 5;
    const gws = []; for (let g = gwNext; g < gwNext + n && g <= 38; g++) gws.push(g);
    const ids = D.teams.map((t) => t.id);
    const mineTeams = new Set(baseSquad().map((p) => E[p[0]]?.team));
    let [a, b] = store.get("rotPair", [null, null]);
    const pairs = []; ids.forEach((x, i) => ids.slice(i + 1).forEach((y) => pairs.push({ a: x, b: y, s: pairScore(x, y, gws) })));
    pairs.sort((p, q) => p.s - q.s || (windowFdr(p.a, n) + windowFdr(p.b, n)) - (windowFdr(q.a, n) + windowFdr(q.b, n)));
    if (!ids.includes(a) || !ids.includes(b) || a === b) [a, b] = [pairs[0].a, pairs[0].b];
    const opt = (sel) => D.teams.map((t) => `<option value="${t.id}" ${t.id === sel ? "selected" : ""}>${esc(t.name)}</option>`).join("");
    const cell = (team, g, pick) => { const l = teamFx[team][g] || []; return `<td class="${pick ? "rot-pick" : ""}">${l.length ? l.map((f) => `<span class="fdrc fdr${f.fdr}">${esc(tShort(f.opp))} (${f.home ? "H" : "A"})</span>`).join("") : '<span class="fdrc fdr0">Blank</span>'}</td>`; };
    const pickOf = (g) => (bestFdr(a, g) <= bestFdr(b, g) ? a : b);
    const score = pairScore(a, b, gws);
    const easy = gws.filter((g) => Math.min(bestFdr(a, g), bestFdr(b, g)) <= 2).length;
    return `
      <div class="panel-head"><h3>Rotation</h3><span class="note">Pair two clubs and play whichever has the easier fixture each week</span></div>
      <div class="controls rot-ctl">
        <label><span class="note">Team 1</span> <select id="rotA">${opt(a)}</select></label>
        <label><span class="note">Team 2</span> <select id="rotB">${opt(b)}</select></label>
        <label><span class="note">Gameweeks</span> <select id="rotN">${[1, 2, 3, 4, 5].map((v) => `<option value="${v}" ${v === n ? "selected" : ""}>Next ${v}</option>`).join("")}</select></label>
      </div>
      <div class="tbl-wrap"><table class="fx-tbl rot-tbl">
        <thead><tr><th>Team</th><th class="n">Avg FDR</th>${gws.map((g) => `<th>GW${g}</th>`).join("")}</tr></thead>
        <tbody>
          ${[a, b].map((t) => `<tr><td>${esc(T[t].name)}${mineTeams.has(t) ? ' <span class="pill acc" title="You own players from this club">Yours</span>' : ""}</td><td class="n">${avgBadge(windowFdr(t, n))}</td>${gws.map((g) => cell(t, g, pickOf(g) === t)).join("")}</tr>`).join("")}
          <tr class="rot-best"><td><strong>Play each week</strong></td><td class="n">${avgBadge(Math.min(5, score))}</td>${gws.map((g) => { const t = pickOf(g); return `<td><span class="note">${esc(T[t].short)}</span></td>`; }).join("")}</tr>
        </tbody>
      </table></div>
      <p class="note">Together this pair averages <strong>${score.toFixed(1)}</strong> FDR if you always play the easier fixture (highlighted), with ${easy} of ${gws.length} gameweeks at FDR 2 or better. Rotation suits goalkeepers and budget defenders.</p>
      <h3>Best pairs for the next ${n} gameweek${n > 1 ? "s" : ""}</h3>
      <div class="rot-sugg">${pairs.slice(0, 8).map((p) => `<button class="rot-chip ${p.a === a && p.b === b ? "on" : ""}" data-pair="${p.a},${p.b}">${esc(T[p.a].short)} + ${esc(T[p.b].short)} <span class="note">${p.s.toFixed(1)}</span></button>`).join("")}</div>`;
  }
  function wireRotation() {
    const box = $("#rotation"); if (!box) return;
    const redraw = () => { box.innerHTML = rotationHTML(); wireRotation(); };
    const setPair = (a, b) => { store.set("rotPair", [a, b]); redraw(); };
    $("#rotA").addEventListener("change", (e) => setPair(Number(e.target.value), Number($("#rotB").value)));
    $("#rotB").addEventListener("change", (e) => setPair(Number($("#rotA").value), Number(e.target.value)));
    $("#rotN").addEventListener("change", (e) => { store.set("rotN", Number(e.target.value)); redraw(); });
    box.querySelectorAll("[data-pair]").forEach((btn) => btn.addEventListener("click", () => { const [x, y] = btn.dataset.pair.split(",").map(Number); setPair(x, y); }));
  }

  // ---------- bookmaker odds ----------
  // The Worker returns bookmaker 1X2 and over/under 2.5 probabilities (margin removed, averaged across UK bookmakers).
  // Clean sheet and to-score chances come from a Poisson goals model fitted to those prices.
  const ODDS_ALIASES = { ARS: ["arsenal"], AVL: ["aston villa"], BOU: ["bournemouth"], BRE: ["brentford"], BHA: ["brighton"], BUR: ["burnley"],
    CHE: ["chelsea"], COV: ["coventry"], CRY: ["crystal palace"], EVE: ["everton"], FUL: ["fulham"], HUL: ["hull"], IPS: ["ipswich"], LEE: ["leeds"],
    LEI: ["leicester"], LIV: ["liverpool"], MCI: ["manchester city", "man city"], MUN: ["manchester united", "man utd", "man united"], NEW: ["newcastle"],
    NFO: ["nottingham", "nott'm forest"], SOU: ["southampton"], SUN: ["sunderland"], TOT: ["tottenham", "spurs"], WHU: ["west ham"], WOL: ["wolverhampton", "wolves"] };
  function oddsTeamId(name) {
    const n = norm(name);
    const t = D.teams.find((t) => (ODDS_ALIASES[t.short] || []).some((a) => n.startsWith(a)))
      || D.teams.find((t) => n.includes(norm(t.name)) || norm(t.name).includes(n));
    return t ? t.id : null;
  }
  const PMF = (() => { const m = new Map(); return (l) => { const k = l.toFixed(3); if (!m.has(k)) { const a = [Math.exp(-l)]; for (let i = 1; i <= 10; i++) a.push(a[i - 1] * l / i); m.set(k, a); } return m.get(k); }; })();
  function scoreProbs(lh, la) {
    const a = PMF(lh), b = PMF(la); let H = 0, Dr = 0, A = 0, O = 0;
    for (let i = 0; i <= 10; i++) for (let j = 0; j <= 10; j++) { const p = a[i] * b[j]; if (i > j) H += p; else if (i < j) A += p; else Dr += p; if (i + j > 2) O += p; }
    return { H, D: Dr, A, O };
  }
  function fitGoals(pH, pD, pA, pO) {
    const err = (lh, la) => { const r = scoreProbs(lh, la); return (r.H - pH) ** 2 + (r.D - pD) ** 2 + (r.A - pA) ** 2 + (pO == null ? 0 : (r.O - pO) ** 2); };
    let best = [1.4, 1.1], be = Infinity;
    for (let lh = 0.1; lh <= 4; lh += 0.05) for (let la = 0.1; la <= 4; la += 0.05) { const e = err(lh, la); if (e < be) { be = e; best = [lh, la]; } }
    const [h0, a0] = best;
    for (let lh = Math.max(0.05, h0 - 0.05); lh <= h0 + 0.05; lh += 0.005) for (let la = Math.max(0.05, a0 - 0.05); la <= a0 + 0.05; la += 0.005) { const e = err(lh, la); if (e < be) { be = e; best = [lh, la]; } }
    return best;
  }

  let oddsCache = null;
  function renderOdds() {
    $("#app").innerHTML = `<section class="view"><div class="panel-head"><h2>GW${gwNext} bookmaker odds</h2></div><p class="empty">Loading bookmaker odds…</p></section>`;
    const load = oddsCache ? Promise.resolve(oddsCache) : fetch("api/odds", { cache: "no-store" }).then(async (r) => {
      const ct = r.headers.get("content-type") || "";
      if (!ct.includes("json")) throw new Error("offline");
      const j = await r.json(); if (!r.ok) throw Object.assign(new Error(j.error || "odds"), { info: j }); return j;
    });
    load.then((j) => { oddsCache = j; drawOdds(j); }).catch((e) => {
      const msg = e.message === "offline" ? "Bookmaker odds load on the live site, fc27-planner.fc27-fpl.workers.dev."
        : e.message === "not_configured" ? "Bookmaker odds aren't switched on yet: the site needs an odds API key."
        : `Couldn't load bookmaker odds (${esc(e.info?.detail || e.message)}). Try again later.`;
      $("#app").innerHTML = `<section class="view"><div class="panel-head"><h2>GW${gwNext} bookmaker odds</h2></div><div class="err">${msg}</div></section>`;
    });
  }
  function drawOdds(j) {
    const fx = D.fixtures.filter((f) => f[1] === gwNext).sort((a, b) => String(a[6]).localeCompare(String(b[6])));
    const ev = j.events.map((e) => ({ ...e, h: oddsTeamId(e.home), a: oddsTeamId(e.away) }));
    const mineTeams = {}; baseSquad().forEach((p) => { const t = E[p[0]]?.team; mineTeams[t] = (mineTeams[t] || 0) + 1; });
    const rows = fx.map((f) => {
      const o = ev.find((e) => e.h === f[2] && e.a === f[3]);
      if (!o) return { f, o: null };
      const [pH, pD, pA] = o.h2h; const [lh, la] = fitGoals(pH, pD, pA, o.over25);
      return { f, o, pH, pD, pA, csH: Math.exp(-la), csA: Math.exp(-lh), scH: 1 - Math.exp(-lh), scA: 1 - Math.exp(-la), lh, la };
    });
    const got = rows.filter((r) => r.o);
    const op = (p, cls = "") => `<td class="op ${cls}" style="--p:${p.toFixed(3)}">${Math.round(p * 100)}%</td>`;
    const tm = (id) => `${esc(T[id]?.name)}${mineTeams[id] ? ` <span class="pill acc" title="Players you own">${mineTeams[id]}</span>` : ""}`;
    const ko = (t) => t ? new Date(t).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "TBC";
    const top = (key, side) => got.map((r) => ({ r, p: r[key + side], team: side === "H" ? r.f[2] : r.f[3] })).sort((a, b) => b.p - a.p)[0];
    const bestOf = (key) => [top(key, "H"), top(key, "A")].filter(Boolean).sort((a, b) => b.p - a.p)[0];
    const bcs = bestOf("cs"), bsc = bestOf("sc");
    const fav = got.map((r) => (r.pH >= r.pA ? { p: r.pH, team: r.f[2] } : { p: r.pA, team: r.f[3] })).sort((a, b) => b.p - a.p)[0];
    const uk = (t) => new Date(t).toLocaleString("en-GB", { timeZone: "Europe/London", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    const nextTxt = j.nextRefresh ? `Next refresh ${uk(j.nextRefresh.at)}, ${j.nextRefresh.days} day${j.nextRefresh.days > 1 ? "s" : ""} before the GW${j.gw} deadline.` : j.gw ? `No more refreshes before the GW${j.gw} deadline.` : "";
    $("#app").innerHTML = `
    <section class="view">
      <div class="panel-head"><h2>GW${gwNext} bookmaker odds</h2><span class="note">Chances implied by UK bookmaker prices, bookmaker margin removed</span></div>
      <div class="odds-stamp"><span><span class="k">Odds last refreshed</span> <strong>${uk(j.fetched)}</strong> <span class="note">UK time</span></span>${nextTxt ? `<span class="note">${nextTxt}</span>` : ""}${j.stale ? `<span class="note down">The last refresh attempt failed, so these are the most recent odds available.</span>` : ""}</div>
      ${got.length ? `<div class="kpis">
        <div class="kpi"><span class="k">Biggest favourite</span><span class="v">${Math.round(fav.p * 100)}%</span><span class="s">${esc(T[fav.team]?.name)} to win</span></div>
        <div class="kpi"><span class="k">Best clean sheet chance</span><span class="v">${Math.round(bcs.p * 100)}%</span><span class="s">${esc(T[bcs.team]?.name)}</span></div>
        <div class="kpi"><span class="k">Most likely to score</span><span class="v">${Math.round(bsc.p * 100)}%</span><span class="s">${esc(T[bsc.team]?.name)}</span></div>
      </div>` : ""}
      <div class="tbl-wrap"><table class="odds-tbl cards-sm">
        <thead>
          <tr><th rowspan="2">Match</th><th class="grp" colspan="3">Result</th><th class="grp" colspan="2">Clean sheet</th><th class="grp" colspan="2">To score</th></tr>
          <tr><th class="n bl">Home win</th><th class="n">Draw</th><th class="n">Away win</th><th class="n bl">Home</th><th class="n">Away</th><th class="n bl">Home</th><th class="n">Away</th></tr>
        </thead>
        <tbody>${rows.map((r) => `<tr><td><span class="match"><span>${tm(r.f[2])} v ${tm(r.f[3])}</span><small>${ko(r.f[6])}</small></span></td>${r.o
          ? `${op(r.pH, "bl")}${op(r.pD)}${op(r.pA)}${op(r.csH, "bl")}${op(r.csA)}${op(r.scH, "bl")}${op(r.scA)}`
          : `<td class="bl" colspan="7"><span class="note">${j.nextRefresh ? `Odds arrive at the next refresh, ${uk(j.nextRefresh.at)}` : "No odds published yet"}</span></td>`}</tr>`).join("")}</tbody>
      </table></div>
      <p class="note">Result chances come straight from bookmaker prices (average of ${got.length ? Math.round(got.reduce((a, r) => a + r.o.books, 0) / got.length) : 0} UK bookmakers per match). Clean sheet and to-score chances are worked out from the same prices plus the over/under 2.5 goals line, using a standard goals model. Numbered badges mark teams you own players from. Odds refresh 3 days and 1 day before each gameweek deadline.</p>
    </section>`;
  }
})();
</script>
</body></html>
