        <td class="n">${a ? a.net : "–"}${a?.cost ? `<small>(−${a.cost})</small>` : ""}${ca ? ` <span class="chip on">${CHIP_LABEL[ca]}</span>` : ""}</td>
        <td class="n">${b ? b.net : "–"}${b?.cost ? `<small>(−${b.cost})</small>` : ""}${cb ? ` <span class="chip on">${CHIP_LABEL[cb]}</span>` : ""}</td>
        <td class="n ${d > 0 ? "up" : d < 0 ? "down" : ""}">${d == null ? "–" : d === 0 ? "0" : sign(d)}</td>
        <td class="n">${a ? fmt(a.total) : "–"}</td><td class="n">${b ? fmt(b.total) : "–"}</td>
        <td class="n ${gapT > 0 ? "up" : gapT < 0 ? "down" : ""}"><strong>${gapT == null ? "–" : gapT === 0 ? "Level" : sign(gapT)}</strong></td></tr>`;
    }).join("");

    $("#app").innerHTML = `
    <section class="view">
      <div class="panel-head"><h2>Mini League analysis</h2><span class="note">The league leader, friends and family. Pick one to compare with FC27.</span></div>
      <div class="picks5">${cards}</div>
      ${missing.length ? `<p class="note">Not found in ${esc(D.league.name)}: ${missing.map(esc).join(", ")}.</p>` : ""}

      <div class="panel">
        <div class="vs">
          <div class="side"><span class="who"><i style="background:var(--s-me)"></i>You</span><span class="big">${fmt(meRow.total)}</span><span class="mid">${esc(D.entry.name)} · ${ordinal(meRow.rank)}</span></div>
          <div class="mid"><strong style="font-size:1rem;color:var(--ink)">${gap === 0 ? "Level" : gap > 0 ? `You lead by ${gap}` : `${tn} leads by ${-gap}`}</strong><br>Gameweeks won: you ${won}, ${esc(tn)} ${lost}${drawn ? `, ${drawn} drawn` : ""}</div>
          <div class="side"><span class="who"><i style="background:var(--s-them)"></i>${esc(tn)}</span><span class="big">${fmt(them.total)}</span><span class="mid">${esc(them.entry_name)} · ${ordinal(them.rank)}</span></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="panel">
          <div class="panel-head"><h3>Head to head</h3><span class="note">Difference is from your side</span></div>
          <div class="tbl-wrap"><table class="h2h"><thead><tr><th></th><th class="n"><span class="sw" style="background:var(--s-me)"></span>You</th><th class="n"><span class="sw" style="background:var(--s-them)"></span>${esc(tn)}</th><th class="n">Difference</th></tr></thead><tbody>${h2hRows}</tbody></table></div>
          <p class="note">Squad value is your 15 players at today's prices, as FPL shows it; total team value adds the money in the bank.</p>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Chips</h3><span class="note">You have ${nowLeft(myM)} left this half, ${esc(tn)} has ${nowLeft(them.m)}</span></div>
          <div class="tbl-wrap"><table class="chipgrid"><thead><tr><th>Chip</th><th><span class="sw" style="background:var(--s-me)"></span>You</th><th><span class="sw" style="background:var(--s-them)"></span>${esc(tn)}</th></tr></thead><tbody>${halfRows.join("")}</tbody></table></div>

        <div class="legend"><span><i style="background:var(--s-me)"></i>You</span><span><i style="background:var(--s-them)"></i>${esc(them.player_name)}</span></div>
        <div style="overflow-x:auto"><div class="chart" id="gwChart" style="min-width:560px">${gwBarChart(gws, A, B, tn)}</div></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Season total by gameweek</h3><span class="note">Running total after each gameweek</span></div>
        <div class="legend"><span><i style="background:var(--s-me)"></i>You</span><span><i style="background:var(--s-them)"></i>${esc(them.player_name)}</span></div>
        <div style="overflow-x:auto"><div class="chart" id="totChart" style="min-width:560px">${totalChart(gws, A, B, tn)}</div></div>
        <div class="tbl-wrap"><table class="gw-tbl">
          <thead><tr><th>Gameweek</th><th class="n"><span class="sw" style="background:var(--s-me)"></span>Your pts</th><th class="n"><span class="sw" style="background:var(--s-them)"></span>${esc(tn)} pts</th><th class="n">GW margin</th><th class="n">Your total</th><th class="n">${esc(tn)} total</th><th class="n">Overall gap</th></tr></thead>
          <tbody>${tableRows}</tbody></table></div>
        <p class="note">Small numbers in brackets are points deducted for extra transfers. Chip badges show the chip played that week.</p>
      </div>
      ${freshness()}
    </section>`;

    document.querySelectorAll("[data-h2h]").forEach((b) => b.addEventListener("click", () => { store.set("h2h", Number(b.dataset.h2h)); renderAnalysis(); }));
    wireTip($("#gwChart"), (g) => {
      const a = A.by[g], b = B.by[g], d = a && b ? a.net - b.net : null;
      return `<b>GW${g}</b><div class="r"><span><i style="background:var(--s-me)"></i>You</span><span>${a ? a.net : "–"}${a?.cost ? ` (−${a.cost})` : ""}${A.chipAt[g] ? " · " + CHIP_LABEL[A.chipAt[g]] : ""}</span></div><div class="r"><span><i style="background:var(--s-them)"></i>${esc(tn)}</span><span>${b ? b.net : "–"}${b?.cost ? ` (−${b.cost})` : ""}${B.chipAt[g] ? " · " + CHIP_LABEL[B.chipAt[g]] : ""}</span></div>${d == null ? "" : `<div class="r"><span>Margin</span><span>${d === 0 ? "Level" : sign(d)}</span></div>`}`;
    });
    wireTip($("#totChart"), (g) => {
      const a = A.by[g], b = B.by[g], d = a && b ? a.total - b.total : null;
      return `<b>After GW${g}</b><div class="r"><span><i style="background:var(--s-me)"></i>You</span><span>${a ? fmt(a.total) : "–"}</span></div><div class="r"><span><i style="background:var(--s-them)"></i>${esc(tn)}</span><span>${b ? fmt(b.total) : "–"}</span></div>${d == null ? "" : `<div class="r"><span>Gap</span><span>${d === 0 ? "Level" : sign(d)}</span></div>`}`;
    }, true);
  }

  function niceStep(range, target = 5) { const steps = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500]; return steps.find((s) => range / s <= target) || 1000; }
  const CW = 860;

  function gwBarChart(gws, A, B) {
    const H = 300, L = 38, R = 8, Tp = 12, B0 = 52;
    const max = Math.max(10, ...gws.map((g) => Math.max(A.by[g]?.net ?? 0, B.by[g]?.net ?? 0)));
    const step = niceStep(max, 5), top = Math.ceil(max / step) * step;
    const y = (v) => Tp + (1 - Math.max(0, v) / top) * (H - Tp - B0);
    const band = (CW - L - R) / gws.length, bw = Math.min(18, (band - 8) / 2);
    let g = "";
    for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${CW - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    const bar = (x, v, cls) => {
      if (v == null) return "";
      const y0 = y(0), y1 = y(v), r = Math.min(4, bw / 2, (y0 - y1) / 2);
      if (y0 - y1 < 0.5) return `<rect class="${cls}" x="${x}" y="${y0 - 1}" width="${bw}" height="1"/>`;
      return `<path class="${cls}" d="M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + bw - r}Q${x + bw},${y1} ${x + bw},${y1 + r}V${y0}Z"/>`;
    };
    gws.forEach((gw, i) => {
      const cx = L + band * i + band / 2;
      const a = A.by[gw]?.net, b = B.by[gw]?.net;
      g += bar(cx - bw - 1, a, "bar-me") + bar(cx + 1, b, "bar-them");
      g += `<text class="ax" x="${cx}" y="${H - B0 + 16}" text-anchor="middle">${gw}</text>`;
      if (a != null && b != null) { const d = a - b; g += `<text class="${d > 0 ? "dgood" : d < 0 ? "dbad" : "dzero"}" x="${cx}" y="${H - B0 + 34}" text-anchor="middle">${d === 0 ? "0" : sign(d)}</text>`; }
      g += `<rect class="hit" data-gw="${gw}" x="${L + band * i}" y="${Tp}" width="${band}" height="${H - Tp - B0 + 40}"/>`;
    });
    g += `<text class="ax" x="${L - 6}" y="${H - B0 + 16}" text-anchor="end">GW</text><text class="ax" x="${L - 6}" y="${H - B0 + 34}" text-anchor="end">±</text>`;
    return `<svg viewBox="0 0 ${CW} ${H}" role="img" aria-label="Points per gameweek, you against your rival">${g}</svg>`;
  }

  function totalChart(gws, A, B, tn) {
    const H = 300, L = 46, R = 96, Tp = 14, B0 = 28;
    const vals = []; gws.forEach((g) => { if (A.by[g]) vals.push(A.by[g].total); if (B.by[g]) vals.push(B.by[g].total); });
    const max = Math.max(10, ...vals), step = niceStep(max, 6), top = Math.ceil(max / step) * step;
    const x = (gw) => L + (gws.length <= 1 ? 0 : (gws.indexOf(gw) / (gws.length - 1)) * (CW - L - R));
    const y = (v) => Tp + (1 - v / top) * (H - Tp - B0);
    let g = "";
    for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${CW - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
    gws.forEach((gw) => (g += `<text class="ax" x="${x(gw)}" y="${H - 8}" text-anchor="middle">${gw}</text>`));
    const line = (S, cls) => { const pts = gws.filter((gw) => S.by[gw]); return `<path class="${cls}" d="${pts.map((gw, i) => (i ? "L" : "M") + x(gw).toFixed(1) + "," + y(S.by[gw].total).toFixed(1)).join("")}"/>`; };
    g += line(B, "riv") + line(A, "mine");
    const last = (S) => { const l = gws.filter((gw) => S.by[gw]).pop(); return l ? [l, S.by[l].total] : null; };
    const la = last(A), lb = last(B);
    let ya = la ? y(la[1]) : 0, yb = lb ? y(lb[1]) : 0;
    if (la && lb && Math.abs(ya - yb) < 16) { const mid = (ya + yb) / 2, up = la[1] >= lb[1]; ya = mid + (up ? -9 : 9); yb = mid + (up ? 9 : -9); }
    if (lb) g += `<circle class="dot-them" cx="${x(lb[0])}" cy="${y(lb[1])}" r="5"/><text class="lbl-rv" x="${x(lb[0]) + 10}" y="${yb + 4}">${esc(tn)} ${fmt(lb[1])}</text>`;
    if (la) g += `<circle class="dot-me" cx="${x(la[0])}" cy="${y(la[1])}" r="5"/><text class="lbl-me" x="${x(la[0]) + 10}" y="${ya + 4}">You ${fmt(la[1])}</text>`;
    g += `<line class="xh" id="xh" x1="0" x2="0" y1="${Tp}" y2="${H - B0}" visibility="hidden"/>`;
    const half = gws.length > 1 ? (CW - L - R) / (gws.length - 1) / 2 : (CW - L - R) / 2;
    gws.forEach((gw) => (g += `<rect class="hit" data-gw="${gw}" data-x="${x(gw)}" x="${x(gw) - half}" y="${Tp}" width="${half * 2}" height="${H - Tp - B0}"/>`));
    return `<svg viewBox="0 0 ${CW} ${H}" role="img" aria-label="Season total after each gameweek, you against your rival">${g}</svg>`;
  }

  // Shared hover/tap tooltip for the analysis charts.
  function wireTip(box, html, crosshair) {
    if (!box) return;
    const svg = box.querySelector("svg"), tip = document.createElement("div");
    tip.className = "tip"; tip.hidden = true; box.appendChild(tip);
    const xh = crosshair ? svg.querySelector("#xh") : null;
    const show = (r, ev) => {
      box.querySelectorAll(".hit.on").forEach((h) => h.classList.remove("on")); if (!crosshair) r.classList.add("on");
      tip.innerHTML = html(Number(r.dataset.gw)); tip.hidden = false;
      if (xh) { xh.setAttribute("x1", r.dataset.x); xh.setAttribute("x2", r.dataset.x); xh.setAttribute("visibility", "visible"); }
      const bb = box.getBoundingClientRect(), rb = r.getBoundingClientRect();
      let left = rb.left - bb.left + rb.width / 2 + 12; if (left + tip.offsetWidth > bb.width) left = rb.left - bb.left + rb.width / 2 - tip.offsetWidth - 12;
      tip.style.left = Math.max(0, left) + "px"; tip.style.top = Math.max(0, (ev ? ev.clientY - bb.top : 40) - tip.offsetHeight / 2) + "px";
    };
    const hide = () => { tip.hidden = true; box.querySelectorAll(".hit.on").forEach((h) => h.classList.remove("on")); if (xh) xh.setAttribute("visibility", "hidden"); };
    svg.querySelectorAll(".hit").forEach((r) => { r.addEventListener("pointermove", (ev) => show(r, ev)); r.addEventListener("click", (ev) => show(r, ev)); });
    svg.addEventListener("pointerleave", hide);
  }

  // ---------- league ----------
  function renderLeague() {
    const sorted = [...members].sort((a, b) => a.rank - b.rank);
    const meRow = members.find((x) => x.entry === me);
    let rival = store.get("rival", null);
    if (!members.some((x) => x.entry === rival) || rival === me) {
      const above = sorted.filter((x) => x.total > meRow.total);
      rival = (above[above.length - 1] || sorted.find((x) => x.entry !== me)).entry;
    }
    const rows = sorted.map((x) => {
      const mv = x.last_rank ? x.last_rank - x.rank : 0;
      const cap = squadOf(x.m).find((p) => p[3]);
      const chip = x.m.picks?.chip;
      const cl = chipsLeft(x.m);
      return `<tr class="click ${x.entry === me ? "me" : x.entry === rival ? "rv" : ""}" data-e="${x.entry}">
        <td class="n">${x.rank} <span class="${mv > 0 ? "up" : mv < 0 ? "down" : ""}" style="font-size:.7rem">${mv > 0 ? "▲" + mv : mv < 0 ? "▼" + -mv : ""}</span></td>
        <td><span class="mgr">${esc(x.entry_name)}<small>${esc(x.player_name)}</small></span></td>
        <td class="n">${x.event_total}</td>
        <td class="n"><strong>${fmt(x.total)}</strong></td>
        <td class="n ${x.total - meRow.total > 0 ? "down" : x.total - meRow.total < 0 ? "up" : ""}">${x.entry === me ? "–" : sign(x.total - meRow.total)}</td>
        <td>${cap ? esc(E[cap[0]]?.web_name) : "–"}${chip ? ` <span class="chip on">${CHIP_LABEL[chip] || esc(chip)}</span>` : ""}</td>
        <td><span class="chips">${cl.map((c) => `<span class="chip ${c.used ? "used" : ""}" title="${c.used ? "Used" : "Available"}">${CHIP_LABEL[c.name] || c.name}</span>`).join("")}</span></td>
        <td class="n">${seasonSum(x.m, 4) ? "−" + seasonSum(x.m, 4) : "0"}</td>
        <td class="n">${seasonSum(x.m, 5)}</td>
      </tr>`;
    }).join("");

    $("#app").innerHTML = `
    <section class="view">
      <div class="panel-head"><h2>${esc(D.league.name)}: standings</h2><span class="note">Tap a manager to compare squads with them</span></div>
      <div class="tbl-wrap"><table class="cards-sm">
        <thead><tr><th class="n">#</th><th>Team</th><th class="n">GW${gwCur}</th><th class="n">Total</th><th class="n">vs you</th><th>Captain</th><th>Chips (this half)</th><th class="n">Hits</th><th class="n">Bench pts</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      ${freshness()}
      <div class="panel">
        <div class="panel-head"><h2>Season race</h2><span class="note">Points above or below the league average after each gameweek</span></div>
        <div class="legend"><span><i style="background:var(--s-me)"></i>You</span><span><i style="background:var(--s-them)"></i>${esc(members.find((x) => x.entry === rival)?.player_name)}</span><span><i style="background:var(--chart-other)"></i>Rest of the league</span></div>
        <div class="chart">${raceChart(rival)}</div>
      </div>
      ${gwWinnersHTML()}
      <div class="panel" id="cmp"></div>
    </section>`;
    document.querySelectorAll("tbody tr.click").forEach((tr) => tr.addEventListener("click", () => {
      const e = Number(tr.dataset.e); if (e === me) return; store.set("rival", e); renderLeague(); $("#cmp").scrollIntoView({ behavior: "smooth", block: "start" });
    }));
    renderCompare(rival);
  }

  // Highest scorer in the league for every gameweek so far (points after hits).
  function gwWinnersHTML() {
    const rows = [], wins = {};
    for (let g = 1; g <= gwCur; g++) {
      const sc = members.map((x) => { const r = x.m.history.find((h) => h[0] === g); return r ? { x, net: r[1] - r[4], chip: x.m.chips.find(([, ev]) => ev === g)?.[0] } : null; }).filter(Boolean).sort((a, b) => b.net - a.net);
      if (!sc.length) continue;
      const top = sc.filter((v) => v.net === sc[0].net), second = sc.find((v) => v.net < sc[0].net);
      const mine = sc.find((v) => v.x.entry === me);
      top.forEach((v) => (wins[v.x.entry] = (wins[v.x.entry] || 0) + 1 / top.length));
      rows.push({ g, top, pts: sc[0].net, margin: second ? sc[0].net - second.net : 0, avg: sc.reduce((a, v) => a + v.net, 0) / sc.length, mine, myRank: mine ? 1 + sc.filter((v) => v.net > mine.net).length : null, n: sc.length });
    }
    const ev = D.events.find((e) => e.id === gwCur);
    const tally = Object.entries(wins).map(([e, w]) => ({ x: members.find((m) => m.entry === Number(e)), w })).sort((a, b) => b.w - a.w || a.x.rank - b.x.rank);
    const myWins = wins[me] || 0;
    const fmtW = (w) => (Number.isInteger(w) ? w : w.toFixed(1));
    return `<div class="panel">
      <div class="panel-head"><h2>Gameweek winners</h2><span class="note">Top score in ${esc(D.league.name)} each gameweek, after hits${ev && !ev.finished ? `. GW${gwCur} is still in progress` : ""}</span></div>
      <div class="win-tally">${tally.map(({ x, w }) => `<span class="wt ${x.entry === me ? "me" : ""}"><strong>${fmtW(w)}</strong> ${esc(x.player_name)}</span>`).join("")}${myWins ? "" : `<span class="wt me"><strong>0</strong> You</span>`}</div>
      <p class="note">Gameweek wins so far. A shared top score is split between the managers who tied.</p>
      <div class="tbl-wrap"><table class="cards-sm win-tbl">
        <thead><tr><th>Gameweek</th><th>Winner</th><th class="n">Points</th><th class="n">Won by</th><th class="n">League avg</th><th class="n">Your score</th></tr></thead>
        <tbody>${rows.slice().reverse().map((r) => `<tr class="${r.top.some((v) => v.x.entry === me) ? "me" : ""}"><td>GW${r.g}${r.g === gwCur && ev && !ev.finished ? ' <span class="pill">Live</span>' : ""}</td>
          <td><span class="mgr"><span>${r.top.map((v) => `${esc(v.x.entry_name)}${v.chip ? ` <span class="chip on">${CHIP_LABEL[v.chip] || esc(v.chip)}</span>` : ""}`).join(" & ")}</span><small>${r.top.map((v) => esc(v.x.player_name)).join(" & ")}${r.top.length > 1 ? " (tied)" : ""}</small></span></td>
          <td class="n"><strong>${r.pts}</strong></td><td class="n">${r.top.length > 1 ? "Tie" : "+" + r.margin}</td><td class="n">${r.avg.toFixed(0)}</td>
          <td class="n">${r.mine ? `${r.mine.net} <small style="color:var(--muted)">${ordinal(r.myRank)} of ${r.n}</small>` : "–"}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>`;
  }

  function raceChart(rival) {
    const gws = []; for (let g = 1; g <= gwCur; g++) gws.push(g);
    const totals = {}; members.forEach((x) => { totals[x.entry] = {}; x.m.history.forEach((r) => (totals[x.entry][r[0]] = r[2])); });
    const avg = {}; gws.forEach((g) => { const v = members.map((x) => totals[x.entry][g]).filter((v) => v != null); avg[g] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; });
    const series = members.map((x) => ({ e: x.entry, pts: gws.filter((g) => totals[x.entry][g] != null).map((g) => [g, totals[x.entry][g] - avg[g]]) }));
    let lo = 0, hi = 0; series.forEach((s) => s.pts.forEach(([, v]) => { lo = Math.min(lo, v); hi = Math.max(hi, v); }));
    const steps = [5, 10, 20, 25, 50, 100, 200]; const step = steps.find((s) => (hi - lo) / s <= 6) || 200;
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const W = 820, H = 320, L = 44, R = 110, Tp = 12, B = 28;
    const x = (g) => L + ((g - 1) / Math.max(1, gwCur - 1)) * (W - L - R);
    const y = (v) => Tp + (1 - (v - lo) / (hi - lo || 1)) * (H - Tp - B);
    let g = "";
    for (let v = lo; v <= hi; v += step) g += `<line class="${v === 0 ? "zero" : "grid"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? "+" + v : v}</text>`;

  function renderCompare(rival) {

  // ---------- planner ----------
  let selOut = null;
  // ---- Your official team for the coming gameweek, from FPL's Pick Team (needs the FPL login) ----
  // OFF: { picks, bank, ft, made, cost, sell, buy, fetched } or null when only public data is available.
  let OFF;
  function offFrom(mt) {
    const live = mt && mt.ok ? mt : mt && mt.last ? mt.last : null;
    if (!live || !live.picks || live.picks.length !== 15) return null;
    const tr = live.transfers || {};
    const sell = {}, buy = {};
    live.picks.forEach((p) => { if (p.selling_price != null) sell[p.element] = p.selling_price; if (p.purchase_price != null) buy[p.element] = p.purchase_price; });
    return { picks: live.picks.map((p) => [p.element, p.position, p.multiplier, p.is_captain, p.is_vice_captain]).sort((a, b) => a[1] - b[1]), bank: tr.bank ?? null, ft: Math.max(0, (tr.limit || 0) - (tr.made || 0)), limit: tr.limit, made: tr.made || 0, unlimited: tr.status === "unlimited", sell, buy, fetched: live.fetched, stale: !mt.ok };
  }
  async function loadOfficial() {
    if (OFF !== undefined) return OFF;
    if (D.source !== "live") return (OFF = null);
    if (!GWE.mtP) GWE.mtP = fetch("api/my-team", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    OFF = offFrom(await GWE.mtP);
    return OFF;
  }
  const baseSquad = () => (OFF ? OFF.picks : squadOf(myM));
  function planState() {
    // keep only planned moves that still make sense for the current official squad
    const ids = new Set(baseSquad().map((p) => p[0])), ok = [];
    store.get("plan:" + gwNext, []).forEach((m) => { if (ids.has(m.out) && !ids.has(m.inn) && E[m.inn]) { ok.push(m); ids.delete(m.out); ids.add(m.inn); } });
    return ok;
  }
  function setPlan(p) { store.set("plan:" + gwNext, p); }
  function plannedSquad() {
    const plan = planState();
    const sq = baseSquad().map((p) => ({ el: p[0], slot: p[1], orig: p[0] }));
    plan.forEach(({ out, inn }) => { const s = sq.find((x) => x.el === out); if (s) s.el = inn; });
    return sq;
  }
  // ---- prices: FPL's own purchase and sale prices when logged in; otherwise paid (latest transfer in,
  //      else opening-day price) and sale price under FPL's 50% rule ----
  function boughtPrice(id) { if (OFF && OFF.buy[id] != null) return OFF.buy[id]; let best = null; (D.transfers || []).forEach((t) => { if (t[1] === id && (!best || t[0] >= best[0])) best = t; }); return best ? best[2] : E[id].now_cost - (E[id].cost_change_start || 0); }
  function sellPrice(id) {
    if (OFF && OFF.sell[id] != null) return OFF.sell[id];
    if (!baseSquad().some((p) => p[0] === id)) return E[id].now_cost; // not in your squad: today's price
    const b = boughtPrice(id), n = E[id].now_cost; return n <= b ? n : b + Math.floor((n - b) / 2);
  }
  // FPL's own price-change progress: ±100% means the price changes at the next overnight update.
  function priceMove(e) {
    const pct0 = parseFloat(e.price_change_percent) || 0;
    const pr = Array.isArray(e.price_change_projections) ? e.price_change_projections : [];
    const dl = D.price_deadlines || [];
    const by = (off) => (dl[off] ? "by " + new Date(dl[off]).toLocaleDateString("en-GB", { timeZone: "Europe/London", weekday: "short", day: "numeric", month: "short" }) : off === 0 ? "tonight" : `in ${off + 1} nights`);
    if (e.price_change_locked_until && Date.parse(e.price_change_locked_until) > Date.now()) return { pct: pct0, txt: "Locked after a recent change", cls: "" };
    if (e.price_change_calibrating) return { pct: pct0, txt: "FPL is recalibrating", cls: "" };
    const hit = pr.find((x) => Math.abs(parseFloat(x.projected_percent)) >= 100);
    if (hit) { const up = parseFloat(hit.projected_percent) > 0; return { pct: pct0, txt: `${up ? "Rise" : "Fall"} ${Math.abs(hit.likelihood) >= 3 ? "expected" : "possible"} ${by(hit.offset)}`, cls: up ? "up" : "down" }; }
    if (Math.abs(pct0) >= 70) return { pct: pct0, txt: pct0 > 0 ? "Close to rising" : "Close to falling", cls: pct0 > 0 ? "up" : "down" };
    return { pct: pct0, txt: "No change expected soon", cls: "" };

    renderTargets(sq.map((x) => x.el), bank);
    renderTop10(sq.map((x) => x.el));
    renderCompare(sq.map((x) => x.el), bank, ft, plan.length);
    const q = $("#q"); if (q) q.addEventListener("input", debounce(() => { const pos = q.selectionStart; renderPlanner(); const nq = $("#q"); nq.focus(); nq.setSelectionRange(pos, pos); }, 250));
  }

  // ---- Player comparison: any two Premier League players, with the transfer, bank and price-change impact ----
  async function renderCompare(squadIds, bank, ft, used) {
    const box = $("#cmpPanel"); if (!box) return;
    const mine = new Set(squadIds);
    let sel = store.get("cmp", null);
    if (!sel || !E[sel[0]] || !E[sel[1]]) {
      // Default: the first sale in the Overview's plan, else your weakest starter against the best affordable option.
      sel = null;
      try { const pl = await getPlan(); const r = pl.rows.find((x) => x.sellTo); if (r) sel = [r.e.id, r.sellTo.e.id]; } catch (e) { /* fall back below */ }
      if (!document.body.contains(box)) return;
      if (!sel) {
        const TO0 = teamOdds();
        const xi = squadOf(myM).filter((p) => p[1] <= 11 && E[p[0]].element_type > 1).map((p) => E[p[0]]).sort((a, b) => expertScore(a, 5, TO0) - expertScore(b, 5, TO0));
        const a = xi[0] || E[squadIds[0]];
        const b = Object.values(E).filter((e) => e.element_type === a.element_type && !mine.has(e.id) && isFit(e) && e.minutes >= 450).sort((x, y) => expertScore(y, 5, TO0) - expertScore(x, 5, TO0))[0];
        sel = [a.id, (b || a).id];
      }
    }
    try { await ensureFA(sel); } catch (e) { /* season data used */ }
    if (!document.body.contains(box)) return;
    const TO = teamOdds();
    const [A, B] = sel.map((id) => E[id]);
    const N = 5;
    const es = (e, n) => (n ? expertScore(e, n, TO) : 0);
    const perGw = (e) => { const out = []; for (let k = 0; k < N && gwNext + k <= 38; k++) out.push(Math.max(0, es(e, k + 1) - es(e, k))); return out; };
    const PA = perGw(A), PB = perGw(B), tA = PA.reduce((a, b) => a + b, 0), tB = PB.reduce((a, b) => a + b, 0);
    const n0 = (v) => +v || 0;
    const p90 = (e, v) => (e.minutes ? (n0(v) / e.minutes) * 90 : 0);
    const kit = (e) => { const c = T[e.team]?.code; return c != null ? `<img class="ck" src="kit/${c}${e.element_type === 1 ? "_1" : ""}.png" alt="" width="28" height="28" decoding="async" onerror="this.remove()">` : ""; };
    const nm = (e, cls) => `<span class="cmp-nm"><i class="${cls}"></i>${kit(e)}<span>${esc(e.web_name)}<small>${POSN(e)} · ${tShort(e.team)} · £${price(e.now_cost)}m</small></span></span>`;
    const keepers = A.element_type === 1 && B.element_type === 1, backs = A.element_type <= 2 && B.element_type <= 2;

    // pickers: a club (or your squad) then a player
    const opts = (side) => {
      const e = side ? B : A, club = store.get("cmpClub" + side, mine.has(e.id) ? "mine" : String(e.team));
      const list = (club === "mine" ? squadIds.map((id) => E[id]) : Object.values(E).filter((x) => String(x.team) === club))
        .sort((a, b) => a.element_type - b.element_type || b.now_cost - a.now_cost);
      if (!list.some((x) => x.id === e.id)) list.unshift(e);
      return `<div class="cmp-pick"><span class="cmp-side"><i class="${side ? "sw-them" : "sw-me"}"></i>Player ${side ? "B" : "A"}</span>
        <select data-club="${side}" aria-label="Player ${side ? "B" : "A"} club"><option value="mine" ${club === "mine" ? "selected" : ""}>Your squad</option>${[...D.teams].sort((a, b) => a.name.localeCompare(b.name)).map((t) => `<option value="${t.id}" ${String(t.id) === club ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select>
        <select data-player="${side}" aria-label="Player ${side ? "B" : "A"}">${list.map((x) => `<option value="${x.id}" ${x.id === e.id ? "selected" : ""}>${POSN(x)} · ${esc(x.web_name)} (£${price(x.now_cost)}m)${mine.has(x.id) ? " ★" : ""}</option>`).join("")}</select></div>`;
    };

    // Head-to-head totals
    const totals = [
      ["Points", A.total_points, B.total_points, 0],
      ["Goals", A.goals_scored, B.goals_scored, 0],
      ["xG", A.expected_goals, B.expected_goals, 1],
      ["Assists", A.assists, B.assists, 0],
      ["xA", A.expected_assists, B.expected_assists, 1],
      ["xGI", A.expected_goal_involvements, B.expected_goal_involvements, 1],
      ...(backs ? [["Clean sheets", A.clean_sheets, B.clean_sheets, 0], ["xG conceded", A.expected_goals_conceded, B.expected_goals_conceded, 1, true]] : []),
      ...(keepers ? [] : [["Defensive contributions", A.defensive_contribution, B.defensive_contribution, 0]]),
      ["Bonus", A.bonus, B.bonus, 0],
      ["BPS", A.bps, B.bps, 0],
      ["Starts", A.starts, B.starts, 0],
      ["Minutes", A.minutes, B.minutes, 0],
      [`Projected pts (GW${gwNext}–${Math.min(38, gwNext + N - 1)})`, tA, tB, 1],
    ];
    const better = (a, b, low) => (n0(a) === n0(b) ? "" : (n0(a) > n0(b)) !== !!low ? "a" : "b");
    const totRows = totals.map(([l, a, b, d, low]) => { const w = better(a, b, low); return `<tr><td>${l}</td><td class="n ${w === "a" ? "win" : ""}">${d ? n0(a).toFixed(d) : fmt(n0(a))}</td><td class="n ${w === "b" ? "win" : ""}">${d ? n0(b).toFixed(d) : fmt(n0(b))}</td></tr>`; }).join("");

    // Per 90 minutes, diverging bars scaled per row
    const per = [
      ["Points", p90(A, A.total_points), p90(B, B.total_points)],
      ["Goals", p90(A, A.goals_scored), p90(B, B.goals_scored)],
      ["xG", n0(A.expected_goals_per_90), n0(B.expected_goals_per_90)],
      ["Assists", p90(A, A.assists), p90(B, B.assists)],
      ["xA", n0(A.expected_assists_per_90), n0(B.expected_assists_per_90)],
      ...(keepers ? [["Saves", n0(A.saves_per_90), n0(B.saves_per_90)]] : [["Def. contributions", n0(A.defensive_contribution_per_90), n0(B.defensive_contribution_per_90)]]),
      ["BPS", p90(A, A.bps), p90(B, B.bps)],
    ];
    const barRows = per.map(([l, a, b]) => { const m = Math.max(a, b) || 1, f = (v) => v >= 10 ? v.toFixed(1) : v.toFixed(2); return `<div class="db-row"><span class="db-l">${l}</span><span class="db-v">${f(a)}</span><span class="db-bar a"><i style="width:${(a / m) * 100}%"></i></span><span class="db-bar b"><i style="width:${(b / m) * 100}%"></i></span><span class="db-v r">${f(b)}</span></div>`; }).join("");

    // Predicted points line chart
    const narrow = box.clientWidth < 520, W = narrow ? 380 : 640, H = narrow ? 230 : 250, L = 30, R = 14, Tp = 18, Bt = 36, n = PA.length;
    const max = Math.max(4, ...PA, ...PB), step = max > 8 ? 2 : 1, top = Math.ceil(max / step) * step;
    const x = (i) => L + ((W - L - R) / n) * (i + 0.5), y = (v) => Tp + (1 - v / top) * (H - Tp - Bt);
    let svg = "";
    for (let v = 0; v <= top; v += step) svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    for (let i = 0; i < n; i++) svg += `<text class="ax" x="${x(i)}" y="${H - Bt + 18}" text-anchor="middle">GW${gwNext + i}</text>`;
    const line = (P, cls, dot, up) => `<path class="${cls}" d="${P.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("")}" stroke-linejoin="round" stroke-linecap="round"/>` + P.map((v, i) => `<circle class="${dot}" cx="${x(i)}" cy="${y(v)}" r="5"><title>GW${gwNext + i}: ${v.toFixed(1)} pts</title></circle>`).join("");
    const lbls = (P, Q, cls) => P.map((v, i) => `<text class="${cls}" x="${x(i)}" y="${v >= Q[i] ? y(v) - 10 : y(v) + 18}" text-anchor="middle">${v.toFixed(1)}</text>`).join("");
    svg += line(PB, "riv", "dot-them") + line(PA, "mine", "dot-me") + lbls(PA, PB, "lbl-me") + lbls(PB, PA, "lbl-rv");

    // Fixture tiles
    const tiles = (e, P) => { let h = ""; for (let i = 0; i < n; i++) { const g = gwNext + i, l = teamFx[e.team][g] || []; h += l.length ? `<span class="fx-t fdr${Math.max(...l.map((f) => f.fdr))}"><b>${P[i].toFixed(1)}</b><small>${l.map(fxLabel).join(" + ")}</small></span>` : `<span class="fx-t fdr0"><b>0.0</b><small>GW${g} blank</small></span>`; } return h; };

    // Radar: percentile within the position (450+ minutes), 5th to 95th percentile
    const axes = keepers ? [["Points", (e) => p90(e, e.total_points)], ["Saves", (e) => n0(e.saves_per_90)], ["Clean sheets", (e) => p90(e, e.clean_sheets)], ["xGC (low)", (e) => -n0(e.expected_goals_conceded_per_90)], ["Bonus", (e) => p90(e, e.bonus)], ["Next 5 GWs", (e) => es(e, N)]]
      : backs ? [["Points", (e) => p90(e, e.total_points)], ["xGI", (e) => n0(e.expected_goal_involvements_per_90)], ["Clean sheets", (e) => p90(e, e.clean_sheets)], ["xGC (low)", (e) => -n0(e.expected_goals_conceded_per_90)], ["Def. contrib.", (e) => n0(e.defensive_contribution_per_90)], ["Next 5 GWs", (e) => es(e, N)]]
      : [["Points", (e) => p90(e, e.total_points)], ["Goals", (e) => p90(e, e.goals_scored)], ["xG", (e) => n0(e.expected_goals_per_90)], ["Next 5 GWs", (e) => es(e, N)], ["xA", (e) => n0(e.expected_assists_per_90)], ["Assists", (e) => p90(e, e.assists)]];
    const sameP = A.element_type === B.element_type;
    const poolOf = (t) => Object.values(E).filter((e) => e.element_type === t && e.minutes >= 450);
    const qtl = (arr, q) => arr[Math.min(arr.length - 1, Math.max(0, Math.round(q * (arr.length - 1))))];
    const scale = {};
    const norm = (e, k) => {
      const t = sameP ? A.element_type : e.element_type, key = t + ":" + k;
      if (!scale[key]) { const v = poolOf(t).map((p) => axes[k][1](p)).sort((a, b) => a - b); scale[key] = [qtl(v, 0.05), qtl(v, 0.95)]; }
      const [lo, hi] = scale[key]; return Math.max(0.04, Math.min(1, (axes[k][1](e) - lo) / ((hi - lo) || 1)));
    };
    const RW = 360, cx = RW / 2, cy = 170, rad = 118, K = axes.length;
    const pt = (k, r) => [cx + r * Math.sin((2 * Math.PI * k) / K), cy - r * Math.cos((2 * Math.PI * k) / K)];
    let rs = "";
    [0.25, 0.5, 0.75, 1].forEach((f) => (rs += `<polygon class="grid" fill="none" points="${axes.map((_, k) => pt(k, rad * f).join(",")).join(" ")}"/>`));
    axes.forEach(([l], k) => { const [px, py] = pt(k, rad), [lx, ly] = pt(k, rad + 18); rs += `<line class="grid" x1="${cx}" y1="${cy}" x2="${px}" y2="${py}"/><text class="ax" x="${lx}" y="${ly + 4}" text-anchor="${Math.abs(lx - cx) < 4 ? "middle" : lx > cx ? "start" : "end"}">${l}</text>`; });
    const poly = (e, cls) => { const ps = axes.map((_, k) => pt(k, rad * norm(e, k))); return `<polygon class="${cls}" points="${ps.map((p) => p.join(",")).join(" ")}"/>` + ps.map((p, k) => `<circle class="${cls === "rad-a" ? "dot-me" : "dot-them"}" cx="${p[0]}" cy="${p[1]}" r="3.5"><title>${axes[k][0]}: ${Math.round(norm(e, k) * 100)}% of the way from a 5th- to a 95th-percentile ${POSN(sameP ? A : e)}</title></circle>`).join(""); };
    rs += poly(B, "rad-b") + poly(A, "rad-a");

    // Transfer impact: sell whichever one you own for the one you don't
    const ownA = mine.has(A.id), ownB = mine.has(B.id);
    const out = ownA && !ownB ? A : ownB && !ownA ? B : null, inn = out ? (out === A ? B : A) : null;
    const gainOf = (e) => (e === A ? tA : tB);
    const fallSell = (e) => { const b = boughtPrice(e.id), nw = e.now_cost - 1; return nw <= b ? nw : b + Math.floor((nw - b) / 2); };
    const priceNote = (e, owned) => {
      const pm = priceMove(e), pc = `${pm.pct > 0 ? "+" : ""}${pm.pct.toFixed(0)}%`;
      if (owned) {
        if (pm.cls === "down") { const s0 = sellPrice(e.id), s1 = fallSell(e); return `<li class="neg"><strong>${esc(e.web_name)}: ${pm.txt.toLowerCase()}</strong> (${pc}). ${s1 < s0 ? `His sale price drops from £${price(s0)}m to £${price(s1)}m if you wait.` : `His sale price stays £${price(s0)}m after one fall (you only keep half of any rise).`}</li>`; }
        if (pm.cls === "up") return `<li class="pos"><strong>${esc(e.web_name)}: ${pm.txt.toLowerCase()}</strong> (${pc}). Holding him a night longer could add to his sale price (you keep half of each £0.2m rise).</li>`;
        return `<li><strong>${esc(e.web_name)}</strong>: ${pm.txt.toLowerCase()} (${pc}). Sale price £${price(sellPrice(e.id))}m (paid £${price(boughtPrice(e.id))}m).</li>`;
      }
      if (pm.cls === "up") return `<li class="pos"><strong>${esc(e.web_name)}: ${pm.txt.toLowerCase()}</strong> (${pc}). Buying before the overnight update saves £0.1m.</li>`;
      if (pm.cls === "down") return `<li><strong>${esc(e.web_name)}: ${pm.txt.toLowerCase()}</strong> (${pc}). Waiting could make him £0.1m cheaper, if you can afford to delay.</li>`;
      return `<li><strong>${esc(e.web_name)}</strong>: ${pm.txt.toLowerCase()} (${pc}). Costs £${price(e.now_cost)}m.</li>`;
    };
    let impact;
    const ftLeft = Math.max(0, ft - used);
    if (A.id === B.id) impact = `<p class="note">Pick two different players to compare.</p>`;
    else if (out) {
      const sellFor = sellPrice(out.id), after = bank + sellFor - inn.now_cost;
      const tc = {}; squadIds.forEach((id) => (tc[E[id].team] = (tc[E[id].team] || 0) + 1));
      const teamOk = inn.team === out.team || (tc[inn.team] || 0) < 3, posOk = inn.element_type === out.element_type;
      const hit = ftLeft > 0 ? 0 : 4, gain = gainOf(inn) - gainOf(out), net = gain - hit;
      const blockers = [!posOk && `${esc(inn.web_name)} is a ${POSN(inn)} and ${esc(out.web_name)} a ${POSN(out)}: a transfer has to be like for like`, after < 0 && `you'd be £${price(-after)}m short`, !teamOk && `you already have 3 ${esc(T[inn.team].name)} players`].filter(Boolean);
      const verdict = blockers.length ? { cls: "neg", t: `Not possible as it stands: ${blockers.join("; ")}.` }
        : net >= 4 ? { cls: "pos", t: `Worth doing: ${esc(inn.web_name)} projects ${sign(Number(gain.toFixed(1)))} pts over the next ${n} gameweeks${hit ? ", still ahead after the −4 hit" : " for a free transfer"}.` }
        : net > 0 ? { cls: "", t: `Marginal: ${sign(Number(gain.toFixed(1)))} pts over ${n} gameweeks${hit ? " before the −4 hit" : ""}. Only worth it if you have nothing more urgent${ftLeft > 1 ? "" : " to spend the transfer on"}.` }
        : { cls: "neg", t: `Keep ${esc(out.web_name)}: ${esc(inn.web_name)} projects ${gain.toFixed(1)} pts over ${n} gameweeks${hit ? ", and it would cost a −4 hit" : ""}.` };
      impact = `<div class="cmp-imp">
        <div><div class="k">Sell ${esc(out.web_name)}</div><div class="v">£${price(sellFor)}m</div><small>paid £${price(boughtPrice(out.id))}m, now £${price(out.now_cost)}m</small></div>
        <div><div class="k">Buy ${esc(inn.web_name)}</div><div class="v">£${price(inn.now_cost)}m</div><small>${inn.selected_by_percent}% owned</small></div>
        <div><div class="k">Bank after</div><div class="v ${after < 0 ? "down" : ""}">£${price(after)}m</div><small>from £${price(bank)}m now</small></div>
        <div><div class="k">Transfer</div><div class="v ${hit ? "down" : ""}">${hit ? "−4 hit" : "Free"}</div><small>${ftLeft} of ${ft} free left${used ? ` after ${used} planned` : ""}</small></div>
        <div><div class="k">Net gain, ${n} GWs</div><div class="v ${net >= 0 ? "up" : "down"}">${sign(Number(net.toFixed(1)))}</div><small>${hit ? `${sign(Number(gain.toFixed(1)))} less 4` : "projected points"}</small></div>
      </div>
      <p class="cmp-verdict ${verdict.cls}">${verdict.t} <span class="lab lab-proj">Projection</span></p>
      <p class="unc"><b>Main uncertainty:</b> ${(() => { const mi = minutesProfile(inn), mo = minutesProfile(out); return `${esc(inn.web_name)} ${pct(mi.pStart)} to start in GW${gwNext} (${pct(mi.p70)} for 70+), ${esc(out.web_name)} ${pct(mo.pStart)}. The ${n}-gameweek projection uses bookmaker odds for GW${gwNext} and fixture difficulty after that.${squadHealth(squadIds).n < 14 ? ` Your squad has ${squadHealth(squadIds).n} of 15 genuinely playable players: favour an established starter.` : ""}`; })()}</p>
      <ul class="cmp-px">${priceNote(out, true)}${priceNote(inn, false)}</ul>
      ${!blockers.length ? `<div class="controls"><button class="btn pri" id="cmpAdd">Add ${esc(out.web_name)} → ${esc(inn.web_name)} to my plan</button></div>` : ""}`;
    } else if (ownA && ownB) {
      const lead = tA >= tB ? A : B, lag = lead === A ? B : A;
      impact = `<p class="cmp-verdict">Both are in your squad, so there's no transfer cost. ${esc(lead.web_name)} projects ${Math.abs(tA - tB).toFixed(1)} more pts over ${n} gameweeks (${(lead === A ? PA : PB)[0].toFixed(1)} vs ${(lag === A ? PA : PB)[0].toFixed(1)} in GW${gwNext}): the better pick to start or captain.</p><ul class="cmp-px">${priceNote(A, true)}${priceNote(B, true)}</ul>`;
    } else {
      const d = A.now_cost - B.now_cost;
      impact = `<p class="cmp-verdict">Neither is in your squad. ${d === 0 ? "They cost the same" : `${esc((d > 0 ? A : B).web_name)} costs £${price(Math.abs(d))}m more`}; you have £${price(bank)}m in the bank and ${ftLeft} free transfer${ftLeft === 1 ? "" : "s"} left. Pick one of your own players as A or B to see the full transfer cost.</p><ul class="cmp-px">${priceNote(A, false)}${priceNote(B, false)}</ul>`;
    }

    box.innerHTML = `<div class="panel-head"><h2>Player comparison</h2><span class="note">Any two Premier League players. ★ = in your squad.</span></div>
      <div class="cmp-picks">${opts(0)}${opts(1)}</div>
      <h3>Transfer impact</h3>
      ${impact}
      <div class="cmp-grid">
        <div class="cmp-card"><h3>Head to head (season totals)</h3>
          <div class="tbl-wrap"><table class="cmp-tot"><thead><tr><th></th><th class="n"><span class="sw-me"></span> ${esc(A.web_name)}</th><th class="n"><span class="sw-them"></span> ${esc(B.web_name)}</th></tr></thead><tbody>${totRows}</tbody></table></div></div>
        <div class="cmp-card"><h3>Head to head (per 90 minutes)</h3>
          <div class="db-head"><span></span>${nm(A, "sw-me")}${nm(B, "sw-them")}</div>
          <div class="db">${barRows}</div>
          <p class="note">Per 90 minutes played, so a rotated player isn't penalised for time on the bench. Each row's longer bar is the better number.</p></div>
      </div>
      <div class="cmp-card"><h3>Predicted points</h3>
        <div class="legend"><span><i style="background:var(--s-me)"></i>${esc(A.web_name)}: ${tA.toFixed(1)}</span><span><i style="background:var(--s-them)"></i>${esc(B.web_name)}: ${tB.toFixed(1)}</span></div>
        <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Predicted points per gameweek, ${esc(A.web_name)} against ${esc(B.web_name)}">${svg}</svg></div>
        <p class="note">The site's expert score per gameweek: xG and xA per 90, clean sheet chances, defensive contributions, bonus, fixture difficulty and bookmaker odds for GW${gwNext}, form, minutes, injuries, bans and news.</p></div>
      <div class="cmp-card"><h3>Upcoming fixtures</h3>
        <div class="fx-rows"><div class="fx-row"><span class="fx-who a">${nm(A, "sw-me")}</span><div class="fx-tiles">${tiles(A, PA)}</div></div>
        <div class="fx-row"><span class="fx-who b">${nm(B, "sw-them")}</span><div class="fx-tiles">${tiles(B, PB)}</div></div></div>
        <p class="note">Each tile shows predicted points and the opponent, coloured by FDR.</p></div>
      <div class="cmp-card"><h3>Player profile</h3>
        <div class="chart radar"><svg viewBox="-60 0 ${RW + 120} 340" role="img" aria-label="Profile radar, ${esc(A.web_name)} against ${esc(B.web_name)}">${rs}</svg></div>
        <div class="legend" style="justify-content:center"><span><i style="background:var(--s-me)"></i>${esc(A.web_name)}</span><span><i style="background:var(--s-them)"></i>${esc(B.web_name)}</span></div>
        <p class="note">Each axis runs from a bottom-of-the-pack ${sameP ? POSN(A) : "player in his position"} to an elite one (5th to 95th percentile of players with 450+ minutes this season), per 90 minutes.</p></div>`;

    const save = (s) => { store.set("cmp", s); renderCompare(squadIds, bank, ft, used); };
    box.querySelectorAll("[data-club]").forEach((s) => s.addEventListener("change", () => {
      const side = +s.dataset.club; store.set("cmpClub" + side, s.value);
      const list = (s.value === "mine" ? squadIds.map((id) => E[id]) : Object.values(E).filter((x) => String(x.team) === s.value));
      const other = E[sel[1 - side]];
      const pick = list.filter((x) => x.element_type === other.element_type).sort((a, b) => b.total_points - a.total_points)[0] || list.sort((a, b) => b.total_points - a.total_points)[0];
      const ns = [...sel]; if (pick) ns[side] = pick.id; save(ns);
    }));
    box.querySelectorAll("[data-player]").forEach((s) => s.addEventListener("change", () => { const ns = [...sel]; ns[+s.dataset.player] = Number(s.value); save(ns); }));

  // ---- Players to target: a points model built from FPL's scoring rules ----
  // Per match: appearance (2 for 60+ mins), goals x position goal points plus assists x 3 (from xG/xA per 90,
  // scaled by fixture or bookmaker odds), clean sheet chance (team xG conceded, scaled by fixture or odds),
  // defensive contribution points (chance of 10+ actions for defenders, 12+ for midfielders and forwards),
  // saves for keepers, bonus rate, minus goals conceded. Then minutes share, availability, bans and
  // returning rivals. Ranked on 60% this model and 40% form-based projection.
  const poisAtLeast = (l, k) => { let p = Math.exp(-l), c = p; for (let i = 1; i < k; i++) { p *= l / i; c += p; } return Math.max(0, 1 - c); };
  const DEF_MULT = { 1: 0.7, 2: 0.85, 3: 1, 4: 1.2, 5: 1.4 };
  const SCORE = { 1: { g: 10, cs: 4 }, 2: { g: 6, cs: 4 }, 3: { g: 5, cs: 1 }, 4: { g: 4, cs: 0 } };
  function modelPts(e, n, TO) {
    const t = e.element_type, S = SCORE[t];
    const xg = +e.expected_goals_per_90 || 0, xa = +e.expected_assists_per_90 || 0, xgc = +e.expected_goals_conceded_per_90 || 1.3;
    const dc = +e.defensive_contribution_per_90 || 0, sv = +e.saves_per_90 || 0;
    const share = Math.min(1, minutesInfo(e).avg / 90), full = share >= 0.66;
    const bonus90 = e.minutes > 0 ? (e.bonus / e.minutes) * 90 : 0;
    const dcP = t === 1 ? 0 : poisAtLeast(dc, t === 2 ? 10 : 12);
    let tot = 0;
    for (let g = gwNext, i = 0; i < n && g <= 38; g++, i++) {
      let pts = 0;
      (teamFx[e.team][g] || []).forEach((f, k) => {
        const o = i === 0 && k === 0 ? TO[e.team] : null;
        const am = o ? Math.min(1.5, Math.max(0.6, o.lam / 1.35)) : FDR_MULT[f.fdr];
        const conceded = o ? -Math.log(Math.max(0.01, o.cs)) : xgc * DEF_MULT[f.fdr];
        pts += (full ? 2 : 1) + (xg * S.g + xa * 3) * am * share + (full ? S.cs * Math.exp(-conceded) : 0) + 2 * dcP * share + (t === 1 ? (sv / 3) * share : 0) + bonus90 * am * share - (t <= 2 ? (conceded / 2) * 0.6 * share : 0);
      });
      tot += pts * availFor(e, g, i) * (1 - banMiss(e, i)) * compFactor(e, i);
    }
    return { total: tot, dcP };
  }

  // Top-10 ownership of your (planned) squad, and the players they have that you don't, with next-gameweek projections.
  async function ensureFA(ids) {
    await loadNews();
    if (FA.odds === undefined) FA.odds = await (oddsCache ? Promise.resolve(oddsCache) : fetch("api/odds", { cache: "no-store" }).then((r) => (r.ok && (r.headers.get("content-type") || "").includes("json") ? r.json() : null)).catch(() => null));

  }

    const TO = teamOdds();
    const nf = (e) => { const f = nextFx(e.team); return f && f.gw === gwNext ? f.list.map((x) => `<span class="fdrc fdr${x.fdr}">${esc(tShort(x.opp))} (${x.home ? "H" : "A"})</span>`).join("") : '<span class="fdrc fdr0">Blank</span>'; };
    const pNext = (e) => proj(e, 1, TO).total;
    const bar = (n) => `<span class="obar"><i style="width:${(n / N) * 100}%"></i></span>`;
    const mineRows = squadIds.map((id) => ({ e: E[id], n: (owners[id] || []).length })).sort((a, b) => b.n - a.n || a.e.element_type - b.e.element_type);

  // ---- Captaincy shortlist: chance of scoring with a likely range, plus projected captain points ----
  // Expected goals in the match = xG per 90 x expected minutes share x fitness x (bookmakers' expected
  // goals for his team in this match / his team's season xG per game). Chance of scoring = 1 - e^-expected.
  // The range widens with fewer matches played, patchy minutes and fitness doubts.
  const teamXGpg = (team) => { const gp = teamPlayed(team) || 1; return Object.values(E).filter((e) => e.team === team).reduce((a, e) => a + (+e.expected_goals || 0), 0) / gp; };
  function scoreChance(e, TO) {
    const fx = teamFx[e.team][gwNext] || []; if (!fx.length) return null;
    const xg90 = +e.expected_goals_per_90 || 0, mi = minutesInfo(e);
    const share = Math.min(1, mi.avg / 90) * availability(e) * (1 - banMiss(e, 0));
    let lam = 0;
    fx.forEach((f, k) => { const o = k === 0 ? TO[e.team] : null; const tf = o ? Math.min(1.8, Math.max(0.5, o.lam / Math.max(0.6, teamXGpg(e.team)))) : FDR_MULT[f.fdr]; lam += xg90 * share * tf; });
    const games = e.minutes / 90;
    // Uncertainty: fewer matches, swinging minutes, a hot or cold finishing streak and fitness doubts all widen it.
    const h = FA.summ[e.id]; let vol = 0.03;
    if (h && h.length >= 3) { const by = {}; h.forEach(([r, m]) => (by[r] = (by[r] || 0) + m)); const ms = Object.keys(by).map(Number).sort((a, b) => b - a).slice(0, 5).map((r) => Math.min(90, by[r])); const mean = ms.reduce((a, b) => a + b, 0) / ms.length; vol = Math.sqrt(ms.reduce((a, b) => a + (b - mean) ** 2, 0) / ms.length) / 90 * 0.35; }
    const gap = Math.abs(e.goals_scored - (+e.expected_goals || 0));
    let cv = 0.04 + 0.25 / Math.sqrt(Math.max(1, games)) + vol + 0.03 * gap;
    if (mi.avg < 75) cv += 0.08; if (availability(e) < 1) cv += 0.12;
    const P = (l) => 1 - Math.exp(-Math.max(0, l));
    const lo = P(lam * (1 - 1.645 * cv)), hi = P(lam * (1 + 1.645 * cv)), w = hi - lo;
    // Banker / Solid / Punt reflects how reliable the player's numbers are, not the fixture.
    return { p: P(lam), lo, hi, lam, fx, kind: cv <= 0.15 ? "bank" : cv <= 0.21 ? "solid" : "punt" };
  }

  // ================= Deeper Insights sections =================
  // Per-gameweek player stats come from /api/gw/{n}: [minutes, points, xG, xA, xG conceded, saves, bonus,
  // defensive contributions, starts]. Finished gameweeks are stored once; the current one is always fresh.
  async function loadGw(gws) {
    INS.gw = INS.gw || {};
    await pool(gws.filter((g) => !INS.gw[g] || g === gwCur), 4, async (g) => {
      try { const r = await fetch(`api/gw/${g}`, { cache: "no-store" }); if (r.ok && (r.headers.get("content-type") || "").includes("json")) INS.gw[g] = (await r.json()).els; } catch (e) { /* skip */ }
    });
  }
  const gwv = (g, id) => (INS.gw && INS.gw[g] && INS.gw[g][id]) || null;
  const gwPts = (g, id) => (gwv(g, id) || [0, 0])[1];
  // Expected points for one player in one gameweek, from that game's xG, xA and xG conceded
  // (appearance, bonus, saves and defensive contributions as they happened).
  function xPtsOf(g, id) {
    const v = gwv(g, id); if (!v || !v[0]) return 0;
    const [m, , xg, xa, xgc, sv, bon, dc] = v, t = E[id]?.element_type || 3, S = SCORE[t], full = m >= 60;
    return (full ? 2 : 1) + xg * S.g + xa * 3 + (full ? S.cs * Math.exp(-xgc) : 0) + (t === 1 ? Math.floor(sv / 3) : 0) + bon
      + ((t === 2 && dc >= 10) || (t >= 3 && dc >= 12) ? 2 : 0) - (t <= 2 && full ? 0.3 * xgc : 0);
  }
  const top10Rivals = () => { const r = members.find((x) => x.entry === me).rank; return [...members].sort((a, b) => a.rank - b.rank).filter((x) => x.entry !== me).slice(0, r <= 10 ? 9 : 10); };
  const picksOf = (g, entry) => { const P = INS.picks && INS.picks[g]; const m = P && P.managers.find((x) => x.entry === entry); return m && m.picks && m.picks.length ? m : null; };

  // 1. Captaincy decisions: your captain vs the best captain in your own XI, and vs the top 10's captains

  // 2. Luck tracker: actual points vs expected points from xG, xA and xG conceded, same players and multipliers
  function renderLuck() {
    const box = $("#luck"); if (!box) return;
    const top = top10Rivals();
    const teamGw = (g, entry) => { const m = picksOf(g, entry); if (!m || !INS.gw[g]) return null; let a = 0, x = 0; m.picks.forEach(([el, mult]) => { if (mult > 0) { a += gwPts(g, el) * mult; x += xPtsOf(g, el) * mult; } }); return { a, x }; };
    const gws = finishedGws().filter((g) => INS.gw[g]);
    let cm = 0, ct = 0; const series = [];
    const rows = gws.map((g) => {
      const m = teamGw(g, me); const ts = top.map((x) => teamGw(g, x.entry)).filter(Boolean);
      const tl = ts.length ? ts.reduce((a, v) => a + (v.a - v.x), 0) / ts.length : 0;
      if (m) cm += m.a - m.x; ct += tl; series.push({ g, me: cm, t10: ct });
      return { g, m, tl };
    });
    INS.luck = { me: cm, t10: ct };
    const W = 820, H = 220, L = 44, Rr = 90, Tt = 12, B = 26;
    const vals = series.flatMap((v) => [v.me, v.t10, 0]); const lo = Math.floor(Math.min(...vals) / 10) * 10, hi = Math.ceil(Math.max(...vals) / 10) * 10 || 10;
    const X = (g) => L + ((g - gws[0]) / Math.max(1, gws[gws.length - 1] - gws[0])) * (W - L - Rr), Y = (v) => Tt + (1 - (v - lo) / (hi - lo || 1)) * (H - Tt - B);
    let svg = ""; for (let v = lo; v <= hi; v += Math.max(5, Math.round((hi - lo) / 5 / 5) * 5)) svg += `<line class="${v === 0 ? "zero" : "grid"}" x1="${L}" x2="${W - Rr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v > 0 ? "+" : ""}${v}</text>`;
    gws.forEach((g) => (svg += `<text class="ax" x="${X(g)}" y="${H - 6}" text-anchor="middle">${g}</text>`));
    const path = (k) => series.map((v, i) => `${i ? "L" : "M"}${X(v.g).toFixed(1)},${Y(v[k]).toFixed(1)}`).join("");
    const last = series[series.length - 1] || { me: 0, t10: 0, g: 1 };
    let ym = Y(last.me), yt = Y(last.t10); if (Math.abs(ym - yt) < 15) { const mid = (ym + yt) / 2, up = last.me >= last.t10; ym = mid + (up ? -8 : 8); yt = mid + (up ? 8 : -8); }
    svg += `<path class="riv" d="${path("t10")}"/><path class="mine" d="${path("me")}"/><text class="lbl-rv" x="${X(last.g) + 8}" y="${yt + 4}">Top 10 ${last.t10 >= 0 ? "+" : ""}${last.t10.toFixed(0)}</text><text class="lbl-me" x="${X(last.g) + 8}" y="${ym + 4}">You ${last.me >= 0 ? "+" : ""}${last.me.toFixed(0)}</text>`;
    const verdict = cm >= 15 ? "You've been lucky: your players have outscored their underlying numbers. Expect some regression; don't chase more of the same." : cm <= -15 ? "You've been unlucky: your players' chances haven't turned into points. Stick with the process; returns usually catch up." : "Your points are close to what your players' chances deserved: results reflect your picks.";
    box.innerHTML = `
      <div class="panel-head"><h3>Luck tracker: actual vs expected points</h3><span class="note">Cumulative points above (+) or below (−) what your starters' xG, xA and clean sheet chances deserved</span></div>
      <p class="lede"><strong>${cm >= 0 ? "+" : "−"}${Math.abs(cm).toFixed(0)} pts</strong> versus expected over ${gws.length} gameweeks (top-10 average ${ct >= 0 ? "+" : "−"}${Math.abs(ct).toFixed(0)}). ${verdict}</p>
      <div class="legend"><span><i style="background:var(--s-me)"></i>You</span><span><i style="background:var(--s-them)"></i>Top-10 average</span></div>
      <div style="overflow-x:auto"><div class="chart" style="min-width:560px"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative luck, you against the top-10 average">${svg}</svg></div></div>
      <div class="tbl-wrap"><table class="cards-sm"><thead><tr><th>Gameweek</th><th class="n">Your points</th><th class="n">Expected</th><th class="n">Luck</th><th class="n">Top-10 avg luck</th></tr></thead>
      <tbody>${rows.slice().reverse().map((r) => r.m ? `<tr><td>GW${r.g}</td><td class="n">${r.m.a}</td><td class="n">${r.m.x.toFixed(1)}</td><td class="n ${r.m.a - r.m.x >= 0 ? "up" : "down"}"><strong>${r.m.a - r.m.x >= 0 ? "+" : "−"}${Math.abs(r.m.a - r.m.x).toFixed(1)}</strong></td><td class="n">${r.tl >= 0 ? "+" : "−"}${Math.abs(r.tl).toFixed(1)}</td></tr>` : "").join("")}</tbody></table></div>
      <p class="note">Expected points use each player's xG and xA in that game (goal points by position, 3 per assist), clean sheet chance from xG conceded, plus appearance, bonus, saves and defensive contribution points as they happened. Points are before automatic substitutions and hits, for your starters with captaincy, so both columns cover the same players.</p>`;
  }

  // 4. Team form: xG for and against per match over the last 6, with a trend (last 3 vs the 3 before)
  function teamForm() {
    if (INS.form) return INS.form;
    const xgf = {}; // team -> gw -> xG
    Object.entries(INS.gw || {}).forEach(([g, els]) => Object.entries(els).forEach(([id, v]) => { const t = E[id]?.team; if (!t) return; ((xgf[t] = xgf[t] || {})[g] = (xgf[t][g] || 0) + v[2]); }));
    const out = {};
    D.teams.forEach((t) => {
      const games = finishedGws().filter((g) => (teamFx[t.id][g] || []).length).slice(-6).map((g) => {
        const n = teamFx[t.id][g].length, opp = teamFx[t.id][g].map((f) => f.opp);
        return { g, f: ((xgf[t.id] || {})[g] || 0) / n, a: opp.reduce((s2, o) => s2 + ((xgf[o] || {})[g] || 0), 0) / n };
      });
      const avg = (arr, k) => (arr.length ? arr.reduce((s2, x) => s2 + x[k], 0) / arr.length : 0);
      const l3 = games.slice(-3), p3 = games.slice(-6, -3);
      out[t.id] = { f: avg(games, "f"), a: avg(games, "a"), df: avg(l3, "f") - avg(p3, "f"), da: avg(l3, "a") - avg(p3, "a"), n: games.length };
    });
    return (INS.form = out);
  }

    const box = $("#priceWatch"); if (!box) return;
    const mine = new Set(baseSquad().map((p) => p[0])), top = top10Rivals();
    const own10 = {}; top.forEach((x) => squadOf(x.m).forEach((p) => (own10[p[0]] = (own10[p[0]] || 0) + 1)));
