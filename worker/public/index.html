    // or more from that defence AND the club's clean sheet chance over the next 3 gameweeks is good.
    const top10 = sortedM.filter((x) => x.entry !== me).slice(0, meRow.rank <= 10 ? 9 : 10);
    const defOf = (ids, team) => ids.filter((id) => E[id] && E[id].team === team && E[id].element_type <= 2);
    const teamXgc90 = (team) => {
      const gk = Object.values(E).filter((e) => e.team === team && e.element_type === 1 && e.minutes >= 450).sort((a, b) => b.minutes - a.minutes)[0];
      if (gk) return (+gk.expected_goals_conceded || 0) / gk.minutes * 90;
      const ds = Object.values(E).filter((e) => e.team === team && e.element_type === 2 && e.minutes >= 450);
      return ds.length ? ds.reduce((a, e) => a + (+e.expected_goals_conceded || 0) / e.minutes * 90, 0) / ds.length : 1.3;
    };
    const csNext3 = (team) => { const v = []; for (let i = 0; i < 3; i++) { const g = gwNext + i, fx = teamFx[team][g] || []; v.push(!fx.length ? 0 : i === 0 && TO[team] ? TO[team].cs : Math.exp(-teamXgc90(team) * DEF_MULT[fx[0].fdr])); } return v; };
    const coverCheck = (x) => {
      if (x.e.element_type > 2) return null;
      const mineDef = defOf([...squad], x.e.team);
      if (!mineDef.length) return null;
      const doubled = top10.filter((r) => defOf(squadOf(r.m).map((p) => p[0]), x.e.team).length >= 2);
      const cs = csNext3(x.e.team), avgCs = cs.reduce((a, b) => a + b, 0) / cs.length;
      const club = T[x.e.team].name, names = mineDef.map((id) => esc(E[id].web_name)).join(" and ");
      const poss = (n) => esc(n) + (/s$/i.test(n) ? "'" : "'s");
      const csTxt = `${poss(club)} clean sheet chance over GW${gwNext}–${gwNext + 2} averages ${pct(avgCs)} (${cs.map(pct).join(", ")})`;
      const dblTxt = `${doubled.length} of your ${top10.length} top-10 rivals have two or more ${esc(club)} defenders or keepers`;
      const double = doubled.length >= Math.ceil(top10.length / 2) && avgCs >= 0.35;
      const shaky = availability(x.e) < 1 || newsFor(x.e).some((n) => n.tone === "neg");
      const end = !double ? "No need to double up." : shaky ? `Doubling up on ${poss(club)} defence is justified, but with a fit player, not ${esc(x.e.web_name)} while he's a doubt.` : "Doubling up is worth it.";
      return { double: double && !shaky, names, club, note: `You already have ${poss(club)} defence through ${names}. ${dblTxt}; ${csTxt}. ${end}` };
    };
    const verdict = (x) => {
      if (x.plan) return ["acc", "In your plan"];
      if (x.sev >= 3) return ["bad", "Avoid: unavailable"];
      if (x.sev >= 2) return ["warn", "Avoid for now"];
      const cov = coverCheck(x);
      if (cov && !cov.double) return ["", `Covered by ${cov.names}`, cov.note];
      if (x.p5 >= posTop[x.e.element_type] && x.n >= 3 && availability(x.e) === 1) return ["acc", cov ? "Double up" : "Cover him", cov ? cov.note : ""];
      if (x.p5 >= posTop[x.e.element_type] * 0.8) return ["", "Worth a look", cov ? cov.note : ""];
      return ["", "Leave", cov ? cov.note : ""];
    };

    // Write-up
    const sign1 = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(0);
    const myDiffs = myXIafter.filter((id) => !leaderOwns.has(id)).map((id) => ({ e: E[id], p: proj(E[id], 3, TO).total })).sort((a, b) => b.p - a.p);
    const leadDiffs = leadXI.filter((id) => !squad.has(id)).map((id) => ({ e: E[id], p: proj(E[id], 3, TO).total })).sort((a, b) => b.p - a.p);
    const verdictTxt = gap <= 0 ? `You're top of ${esc(D.league.name)}. The aim for the next 3 gameweeks is protecting the lead, so cover the players your closest rivals own.`
      : `You're <strong>${gap} points behind ${esc(leader.player_name)}</strong>. On current squads your starting XI projects <strong>${pNow.toFixed(0)}</strong> points over GW${gwNext}–${gwNext + 2} against ${lName}'s <strong>${pLead.toFixed(0)}</strong> (${sign1(pNow - pLead)}). ${moves.length ? `With the transfers below that becomes <strong>${pAfter.toFixed(0)}</strong> (${sign1(pAfter - pLead)} on ${lName}).` : ""} ${gap > 40 ? `A ${gap}-point gap won't close in 3 weeks through the template. Every point has to come from players ${lName} doesn't own: your differentials (${myDiffs.slice(0, 3).map((d) => esc(d.e.web_name)).join(", ") || "none yet"}) and a captain ${lName} isn't on.` : `This gap is closeable in 3 weeks if your differentials (${myDiffs.slice(0, 3).map((d) => esc(d.e.web_name)).join(", ") || "none yet"}) outscore ${lName}'s (${leadDiffs.slice(0, 3).map((d) => esc(d.e.web_name)).join(", ") || "none"}).`}`;

    const pr = [];
    moves.forEach((mv) => {
      // Fixture reasons only count if the replacement's fixtures are actually easier.
      const easier = mv.c.e.team !== mv.m.e.team && windowFdr(mv.c.e.team, 3) < windowFdr(mv.m.e.team, 3);
      const rs = mv.m.rk.filter((r) => easier || !/fixtures/.test(r[1])).slice(0, 2).map((r) => r[1]);
      const why = [...(mv.reason ? [mv.reason.charAt(0).toUpperCase() + mv.reason.slice(1)] : []), ...rs, `projects ${mv.m.p5.toFixed(1)} pts over the next 5 gameweeks`].join("; ");
      const o = TO[mv.c.e.team];
      const oTxt = o ? (mv.c.e.element_type <= 2 ? `${pct(o.cs)} clean sheet chance in GW${gwNext}` : `${tShort(mv.c.e.team)} ${pct(o.score)} to score in GW${gwNext}`) : "";
      pr.push({ tag: mv.hit ? "Transfer (−4 hit)" : "Transfer", cls: mv.m.sev >= 3 ? "bad" : "acc", unc: mv.unc || `${esc(mv.c.e.web_name)}'s minutes and team news; the 5-gameweek gain is a projection.`,
        t: `Sell ${esc(mv.m.e.web_name)} (sells for £${price(sellPrice(mv.m.e.id))}m) → buy ${esc(mv.c.e.web_name)} (${tShort(mv.c.e.team)}, £${price(mv.c.e.now_cost)}m)`,
        d: `<strong>Why sell:</strong> ${why}. <strong>Why ${esc(mv.c.e.web_name)}:</strong> projects ${mv.c.p5.toFixed(1)} pts over 5 gameweeks (${sign1(mv.gain)} on ${esc(mv.m.e.web_name)}), ${Math.round(mv.c.mins.avg)} mins a game, next 3 ${fxStrip(mv.c.e.team, gwNext, 3)}${oTxt ? ", " + oTxt : ""}. ${banRisk(mv.c.e)?.away === 1 ? `Note: he's on ${banRisk(mv.c.e).y} yellows, one from a ban (already allowed for in his projection). ` : ""}${leaderOwns.has(mv.c.e.id) ? `${lName} owns him, so this protects you rather than gains ground.` : `${lName} doesn't own him: every point he scores is a point gained on the leader.`}` });
    });
    if (!moves.length) pr.push({ tag: "Transfer", cls: "", t: "No transfer is clearly worth making this week", d: `Nobody in your squad is injured or losing minutes badly, and no replacement projects at least 5 pts more over 5 gameweeks within your £${price(bank)}m budget. Roll the transfer.`, unc: "An injury in team news before the deadline could make a transfer worthwhile." });
    starts.forEach((r) => pr.push({ tag: "Line-up", cls: "acc", unc: r.startUnc || `${esc(r.e.web_name)}'s and ${esc(r.startOver.e.web_name)}'s team news.`, t: `Start ${esc(r.e.web_name)} over ${esc(r.startOver.e.web_name)}`, d: `${esc(r.e.web_name)} projects ${r.p1.toFixed(1)} pts next gameweek against ${esc(r.startOver.e.web_name)}'s ${r.startOver.p1.toFixed(1)}${r.sc ? ` and has a ${pct(r.sc.p)} chance of scoring` : ""}${num0(r.st.total_points) ? `, after ${r.st.total_points} pts on your bench in GW${gwCur}` : ""}.` }));
    // momentum holds from the GW plan: in form with an easy fixture, so kept this week
    (plan && plan.eng ? plan.eng.adv.filter((x) => x.sec === "buy" && x.hold) : []).forEach((x) => pr.push({ tag: "Hold", cls: "warn", t: x.t, d: x.d, unc: x.unc }));
    const leftFT = ft - moves.filter((m) => !m.hit).length;
    pr.push({ tag: "Captain", cls: "acc", unc: engCap ? engCap.unc : `${esc(cap.e.web_name)}'s minutes and team news.`, t: `Captain ${esc(cap.e.web_name)} in GW${gwNext}, vice ${esc(vice.e.web_name)}`,
      d: `${esc(cap.e.web_name)} has the highest projection in your XI (${cap.p.toFixed(1)} pts${nextFx(cap.e.team) ? ", " + fxLabel(nextFx(cap.e.team).list[0]) : ""}). ${leadCap ? `${lName} captained ${esc(E[leadCap[0]]?.web_name)} last week. ` : ""}${capDiff && capDiff.e.id !== cap.e.id ? `If you want to gamble on the gap, ${esc(capDiff.e.web_name)} (${capDiff.p.toFixed(1)} pts) is a captain ${lName} doesn't own.` : leaderOwns.has(cap.e.id) ? `${lName} owns him too, so this is the safe pick: it won't lose you ground.` : `${lName} doesn't own him, so a big haul swings the gap directly.`}` });
    const hold = mine.filter((m) => m.sev >= 2 && !moved.has(m.e.id));
    hold.forEach((m) => pr.push({ tag: "Hold", cls: "warn", t: `Hold ${esc(m.e.web_name)} for now`,
      d: `${m.rk.map((r) => r[1]).join("; ")}. But no fit replacement within £3m of his price projects clearly more over 5 gameweeks${leaderOwns.has(m.e.id) && (own[m.e.id] || 0) >= 0.5 ? `, and ${lName} and ${Math.round((own[m.e.id] || 0) * 100)}% of the league own him, so selling would be a gamble against the field` : ""}. Keep him, but don't captain him in these fixtures.` }));
    // Suspension watch: players one booking from a ban.
    const banList = mine.filter((m) => !moved.has(m.e.id) && banRisk(m.e)?.away === 1 && m.e.status !== "s");
    if (banList.length) {
      const benchCover = (t) => picks.filter((p) => p[1] > 11 && E[p[0]].element_type === t && availability(E[p[0]]) === 1).map((p) => esc(E[p[0]].web_name));
      pr.push({ tag: "Suspension", cls: "warn", t: `${banList.map((m) => esc(m.e.web_name)).join(" and ")} ${banList.length > 1 ? "are" : "is"} one booking from a ban`,
        d: banList.map((m) => { const b = banRisk(m.e); const cover = benchCover(m.e.element_type); return `<strong>${esc(m.e.web_name)}</strong> (${POSN(m.e)}, ${b.y} yellows) is booked in ${pct(b.p)} of his games, so the chance he misses a game in the next 4 gameweeks is ${pct(b.pBan)}. ${m.slot > 11 ? "He's on your bench, so a ban costs little." : cover.length ? `Bench cover: ${cover.join(", ")}.` : `You have no fit ${POSN(m.e)} on the bench to cover him${m.e.element_type >= 3 ? ", so a ban means playing a weaker formation" : ""}.`}`; }).join(" ") + ` Don't sell for this alone: the ban is only applied after the 5th card, and FPL marks him suspended, giving you a week to react. Don't add another player on ${banList[0] ? banRisk(banList[0].e).n - 1 : 4} yellows, and avoid captaining a player one card from a ban in a feisty fixture.` });
    }
    if (chipTxt) pr.push({ tag: "Chip", cls: "", t: "Free Hit timing", d: chipTxt + (leadChips.length ? ` ${lName} still has: ${leadChips.join(", ")}.` : "") });
    if (leftFT > 0) pr.push({ tag: "Transfers", cls: "", t: `Bank ${leftFT} free transfer${leftFT > 1 ? "s" : ""}`, d: `You'll have ${Math.min(5, leftFT + 1)} next week (5 is the cap). Use them for injuries or a double gameweek rather than sideways moves.` });
    const cover = missing.filter((x) => ["Cover him", "Double up"].includes(verdict(x)[1])).slice(0, 2);
    if (cover.length) pr.push({ tag: "Top 6", cls: "warn", t: `Plan to cover ${cover.map((x) => esc(x.e.web_name)).join(" and ")}`, d: cover.map((x) => { const v = verdict(x); return `${esc(x.e.web_name)} is in ${x.n} of the other top-6 squads${x.lead ? `, including ${lName}'s` : ""}, projecting ${x.p5.toFixed(1)} pts over 5 gameweeks.${v[2] ? " " + v[2] : ""}`; }).join(" ") + ` ${cover.length > 1 ? "If they haul" : "If he hauls"} without you, you fall further behind. Use next week's transfer on ${cover.length > 1 ? "one of them" : "him"} once the moves above are done.` });
    // Watch list, minus yellow-card risks (those have their own Suspension item).
    const watch = mine.filter((m) => m.sev === 1 && !moved.has(m.e.id)).map((m) => ({ m, rs: m.rk.filter((r) => !/yellow cards/.test(r[1])) })).filter((x) => x.rs.length).slice(0, 5);
    if (watch.length) pr.push({ tag: "Watch", cls: "", t: "Keep, but check team news before the deadline", d: watch.map(({ m, rs }) => `<strong>${esc(m.e.web_name)}</strong>: ${rs.map((r) => r[1]).join("; ")}`).join(". ") });

    // Targets by position.
    const targets = [1, 2, 3, 4].map((t) => {
      const maxBudget = bank + Math.max(...picks.filter((p) => E[p[0]].element_type === t).map((p) => sellPrice(p[0])));
      return { t, list: candidates(t, maxBudget, new Set(picks.map((p) => p[0])), {}, null, TO, leaderOwns).slice(0, 3), maxBudget };
    });
    const mvOf = (id) => moves.find((mv) => mv.m.e.id === id);
    const sevPill = (m) => moved.has(m.e.id) ? (m.sev >= 2 ? `<span class="pill sev3">Sell now</span>` : `<span class="pill acc">Upgrade</span>`) : m.sev >= 3 ? `<span class="pill sev3">Sell now</span>` : m.sev === 2 ? `<span class="pill sev2">Review</span>` : m.sev === 1 ? `<span class="pill sev1">Watch</span>` : `<span class="pill ok">Keep</span>`;
    const minsTxt = (mi) => `${Math.round(mi.avg)}${mi.src === "recent" ? "" : "*"}`;
    const oddsCell = (e) => { const o = TO[e.team]; if (!o) return "–"; return e.element_type <= 2 ? `CS ${pct(o.cs)}` : `Score ${pct(o.score)}`; };

    box.innerHTML = `
      <div class="panel-head"><h2>Future analysis</h2><span class="note">Rebuilt on every reload from live FPL data, FPL's official injury news, recent minutes and bookmaker odds</span></div>
      <div class="kpis">
        <div class="kpi"><span class="k">Gap to ${esc(lName)}</span><span class="v">${gap > 0 ? gap : "Leading"}</span><span class="s">${esc(leader.entry_name)}, ${ordinal(leader.rank)}</span></div>
        <div class="kpi"><span class="k">Your XI, next 3 GWs</span><span class="v">${pNow.toFixed(0)}${moves.length ? ` → ${pAfter.toFixed(0)}` : ""}</span><span class="s">Projected, now${moves.length ? " → after the plan" : ""}</span></div>
        <div class="kpi"><span class="k">${esc(lName)}'s XI, next 3 GWs</span><span class="v">${pLead.toFixed(0)}</span><span class="s">Projected on his current squad</span></div>
        <div class="kpi"><span class="k">Free transfers</span><span class="v">${ft}</span><span class="s">£${price(bank)}m in the bank${plan && plan.eng ? " (FPL)" : ""}</span></div>
      </div>
      <p class="lede">${verdictTxt}</p>
      ${(() => { const near = mine.map((m) => ({ m, b: banRisk(m.e) })).filter((x) => x.b && x.b.away <= 2 && x.m.e.status !== "s").sort((a, b) => a.b.away - b.b.away || b.b.p - a.b.p);
        const banned = mine.filter((m) => m.e.status === "s");
        if (!near.length && !banned.length) return `<div class="ban-strip ok"><span class="k">Suspension watch</span> None of your players is close to a yellow-card ban.</div>`;
        return `<div class="ban-strip"><span class="k">Suspension watch</span>${banned.map((m) => `<span class="ban-item"><span class="yc hot">!</span><strong>${esc(m.e.web_name)}</strong> suspended now</span>`).join("")}${near.map(({ m, b }) => `<span class="ban-item"><span class="yc ${b.away === 1 ? "hot" : ""}">${b.y}</span><strong>${esc(m.e.web_name)}</strong> ${b.away === 1 ? `1 card from a ${b.games}-match ban (${pct(b.pBan)} risk, next 4 GWs)` : `2 cards from a ban`}, deadline GW${b.until}</span>`).join("")}</div>`; })()}

      ${(() => { const hit = mine.filter((m) => FA.comp && FA.comp[m.e.id]);
        if (!hit.length) return `<div class="ban-strip ok"><span class="k">Returning players</span> No injured teammates are coming back to compete with your players.</div>`;
        return `<div class="ban-strip ret"><span class="k">Returning players</span>${hit.map((m) => `<span class="ban-item"><strong>${esc(m.e.web_name)}</strong> <span class="note">(${tShort(m.e.team)})</span> could lose minutes to <span>${FA.comp[m.e.id].map(({ r, kind }) => `${esc(r.web_name)} <span class="note">${returnFrom(r) === 0 ? "back now" : "due " + new Date(expectedBack(r)).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}${kind === "adjacent" ? ", possible" : ""}</span>`).join(", ")}</span></span>`).join("")}</div>`; })()}

      ${(() => {
        const watch = [...new Set([...picks.map((p) => p[0]), ...moves.map((mv) => mv.c.e.id), ...squadOf(leader.m).map((p) => p[0])])];
        const seen = new Set(); const rows = [];
        watch.forEach((id) => newsFor(E[id]).forEach((x) => { const k = x.it.link + id; if (seen.has(k)) return; seen.add(k); rows.push({ e: E[id], x, mine: picks.some((p) => p[0] === id) }); }));
        const teams = [...new Set(picks.map((p) => E[p[0]].team))].flatMap((t) => teamNews(t).map((it) => ({ t, it })));
        rows.sort((a, b) => (b.x.tone === "neg") - (a.x.tone === "neg") || b.mine - a.mine || (b.x.it.date || 0) - (a.x.it.date || 0));
        if (!FA.news) return `<div class="ban-strip ok"><span class="k">In the news</span> Football news loads on the live site.</div>`;
        if (!rows.length && !teams.length) return `<div class="ban-strip ok"><span class="k">In the news</span> No recent BBC Sport or Guardian stories mention your players, your targets or ${esc(lName)}'s players.</div>`;
        return `<div class="news-box"><div class="panel-head"><span class="k">In the news</span><span class="note">Latest BBC Sport and Guardian Premier League stories mentioning your players, the suggested signings and ${esc(lName)}'s squad</span></div><ul class="news">${teams.map(({ t, it }) => `<li class="neg"><span class="pill sev2">${esc(T[t].short)} manager</span> <a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a> <small class="note">${esc(it.source)} · ${ago(it.date)}</small></li>`).join("")}${rows.slice(0, 10).map(({ e, x, mine: m }) => `<li class="${x.tone}"><span class="pill ${x.tone === "neg" ? "sev3" : x.tone === "pos" ? "ok" : ""}">${esc(e.web_name)}${m ? " (yours)" : ""}</span> <a href="${esc(x.it.link)}" target="_blank" rel="noopener">${esc(x.it.title)}</a> <small class="note">${esc(x.it.source)} · ${ago(x.it.date)}</small></li>`).join("")}</ul></div>`;
      })()}

      <h3>Your priorities, in order</h3>
      <p class="note">${plan && plan.eng ? `Transfers, line-up and captain come from the <a href="#gw">Current gameweek (GW${gwNext})</a> analysis of your GW${gwNext} team on FPL${plan.eng.base.pairs.length ? ` (after ${plan.eng.base.pairs.map(([o, i]) => `${o ? esc(o.web_name) : "?"} → ${i ? esc(i.web_name) : "?"}`).join(", ")})` : ""}, so every tab gives the same decision. ` : ""}${(() => { const L = leagueCtx(); return L.text ? L.text + " " : ""; })()}Each item gives the decision, the evidence and the main uncertainty.</p>
      <ol class="prio">${pr.map((p) => { const lab = ({ Suspension: "Fact", Watch: "Fact", Chip: "Assumption", Transfers: "Assumption" })[p.tag] || "Projection"; return `<li><span class="pill ${p.cls === "acc" ? "acc" : p.cls === "bad" ? "sev3" : p.cls === "warn" ? "sev2" : ""}">${p.tag}</span><div><div class="t">${p.t} <span class="lab lab-${lab === "Fact" ? "fact" : lab === "Assumption" ? "asm" : "proj"}">${lab}</span></div><div class="d">${p.d}</div>${p.unc ? `<div class="unc"><b>Main uncertainty:</b> ${p.unc}</div>` : ""}</div></li>`; }).join("")}</ol>

      <div class="stack">
        <div class="panel">
          <div class="panel-head"><h3>Your squad risk check</h3><span class="note">Next 5 gameweeks</span></div>
          <div class="tbl-wrap"><table class="fx-tbl cards-sm">
            <thead><tr><th>Player</th><th>Verdict</th><th class="n">Mins</th><th class="n">Proj 5</th><th>Next 5</th><th>Why</th></tr></thead>
            <tbody>${[...mine].sort((a, b) => (moved.has(b.e.id) ? 4 : b.sev) - (moved.has(a.e.id) ? 4 : a.sev) || a.e.element_type - b.e.element_type).map((m) => `<tr><td><span class="mgr"><span>${esc(m.e.web_name)}${ycBadge(m.e)}</span><small>${POSN(m.e)} · ${tShort(m.e.team)}${m.slot > 11 ? " · bench" : ""}</small></span></td><td>${sevPill(m)}</td><td class="n">${minsTxt(m.mins)}</td><td class="n">${m.p5.toFixed(1)}</td><td>${fxStrip(m.e.team, gwNext, 5)}</td><td class="why">${[...(mvOf(m.e.id) ? [`Upgrade to ${esc(mvOf(m.e.id).c.e.web_name)}: ${sign1(mvOf(m.e.id).gain)} pts over 5 gameweeks`] : []), ...m.rk.map((r) => r[1])].join("; ") || "No concerns"}</td></tr>`).join("")}</tbody>
          </table></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Best targets by position</h3><span class="note">Fit, playing 60+ mins, within your budget</span></div>
          <div class="tbl-wrap"><table class="fx-tbl cards-sm">
            <thead><tr><th>Player</th><th class="n">£</th><th class="n">Score (5 GW)</th><th>Next 5</th><th>Why (Insights data)</th></tr></thead>
            <tbody>${targets.map(({ t, list, maxBudget }) => `<tr class="half"><td colspan="5">${D.positions[t]} · up to £${price(maxBudget)}m</td></tr>` + (list.map((c) => `<tr><td><span class="mgr"><span>${esc(c.e.web_name)}${ycBadge(c.e)}</span><small>${tShort(c.e.team)} · ${Math.round(c.mins.avg)} mins</small></span></td><td class="n">${price(c.e.now_cost)}</td><td class="n"><strong>${c.p5.toFixed(1)}</strong></td><td>${fxStrip(c.e.team, gwNext, 5)}</td><td class="why">${evidence(c.e, TO, leaderOwns, lgOwnAll).join(" · ")}${newsFor(c.e).filter((x) => x.tone === "pos" && x.it.title.toLowerCase().includes(c.e.web_name.toLowerCase())).slice(0, 1).map((x) => ` · <a href="${esc(x.it.link)}" target="_blank" rel="noopener">in the news: ${esc(x.it.title)}</a>`).join("")}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">No one fits</td></tr>`)).join("")}</tbody>
          </table></div>
        </div>

    }

    // 3. Risks before the deadline. A likely absence can be covered by an auto-sub; a likely cameo can't.
    const risky = [];
    xiIds.forEach((id) => {
      const e = E[id], mp = MP(id);
      const trig = []; let lab = "Projection";
      if (e.status === "s") { trig.push("Suspended"); lab = "Fact"; }
      else if (mp.a === 0) { trig.push(`Ruled out: ${esc(e.news || "unavailable")}`); lab = "Fact"; }
      else if (mp.a < 1) { trig.push(`${pct(mp.a)} chance of playing: ${esc(e.news)}`); lab = "Fact"; }
      if (!(teamFx[e.team][gwNext] || []).length) { trig.push(`No GW${gwNext} fixture`); lab = "Fact"; }
      const cameoRisk = mp.a > 0 && mp.pCameo >= 0.2 && mp.pCameo > mp.pAbsent;
      if (mp.a > 0 && mp.pStart < 0.75) trig.push(`${mp.pStart >= 0.65 ? "Not nailed" : mp.label}: ${mp.pattern}`);
      else if (mp.a > 0 && mp.p70 < 0.5 && e.element_type > 1) trig.push(`Often off early: ${mp.pattern}`);
      if (!trig.length) return;
      risky.push(id);
      const cover = autoSub(st, id);
      const better = benchIds.filter((b) => E[b].element_type === e.element_type || (E[b].element_type > 2 && e.element_type > 2)).filter((b) => MP(b).pStart >= 0.75).sort((a, b) => P(b) - P(a))[0];
      const act = better && e.element_type > 1 && P(better) >= P(id) - 0.3 ? { a: "swap", id, with: better, l: `Start ${E[better].web_name} instead` } : null;
      const coverTxt = cameoRisk ? ` The bigger risk is a short cameo (${pct(mp.pCameo)}): if he comes on late, he scores 1 pt and your bench can't cover him.` : cover ? ` If he doesn't play (${pct(mp.pAbsent)}), ${nm(cover)} comes on (${P(cover).toFixed(1)} xP).` : " If he doesn't play, nobody on your bench can come on: you'd play with 10.";
      out.push({ sec: "risk", k: mp.pStart < 0.5 || mp.a === 0 ? "bad" : "warn", lab,
        t: act ? `Start ${E[better].web_name} over ${nm(id)}` : `${cameoRisk ? "Cameo risk" : "Minutes risk"}: ${nm(id)}`,
        d: `${pct(mp.pStart)} to start, ${pct(mp.p70)} to play 70+. ${trig.join(". ")}.${coverTxt}${act ? ` ${E[better].web_name} projects ${P(better).toFixed(1)} vs his ${P(id).toFixed(1)}.` : ""}`,
        unc: e.news_added && e.news ? `FPL news last updated ${newsDate(e)}: check the latest press conference.` : `Based on matches up to GW${gwCur}; no injury flag, so it rests on his recent role.`,
        why: whyHTML([e, ...(cover ? [E[cover]] : [])]), act });
    });

    // 4. Bench cover and the 14-of-15 rule
    const SH = squadHealth(st.ids);
    out.push({ sec: "bench", k: SH.n >= 14 ? "good" : SH.n >= 13 ? "warn" : "bad", lab: "Projection",
      t: `${SH.n} of 15 genuinely playable${SH.n >= 14 ? "" : `: aim for 14`}`,
      d: SH.bad.length ? `Not reliable cover: ${SH.bad.map((r) => `${nm(r.id)} (${whyNot(E[r.id], r.mp)})`).join(", ")}.${SH.n < 14 ? " Fix the weakest of these with your next transfer (see Players to buy)." : ""}` : "Every player is fit and an established starter.",
      unc: "Start rates come from the last 5 matches; a rotation or injury could change this quickly." });
    risky.filter((id) => E[id].element_type > 1).forEach((id) => {
      const cover = autoSub(st, id); if (!cover) return;
      const c = E[cover], mp = MP(cover), o = TO[c.team];
      const weak = [];
      if (mp.pStart < 0.6) weak.push(`he's a minutes risk himself (${pct(mp.pStart)} to start)`);
      if (c.element_type === 2 && o && o.cs < 0.25 && poisAtLeast(+c.defensive_contribution_per_90 || 0, 10) < 0.2) weak.push(`${tShort(c.team)} are only ${pct(o.cs)} to keep a clean sheet and his defensive contributions are low (${(+c.defensive_contribution_per_90 || 0).toFixed(1)}/90)`);
      if (P(cover) < 2.5) weak.push(`projects only ${P(cover).toFixed(1)} xP`);
      if (weak.length) out.push({ sec: "bench", k: "warn", lab: "Projection", t: `Weak cover for ${nm(id)}: ${nm(cover)} would come on`, d: `Under the formation rules ${nm(cover)} is the first eligible substitute, but ${weak.join(", ")}.`, unc: `Matters only if ${nm(id)} misses out (${pct(MP(id).pAbsent)}).`, why: whyHTML([E[id], c]) });
    });
    const outB = benchIds.slice(1), ideal = [...outB].sort((a, b) => P(b) * MP(b).pPlay - P(a) * MP(a).pPlay);
    if (outB.join() !== ideal.join() && P(ideal[0]) * MP(ideal[0]).pPlay - P(outB[0]) * MP(outB[0]).pPlay >= 0.5) {
      out.push({ sec: "bench", k: "warn", lab: "Projection", t: `Reorder your bench: ${ideal.map(nm).join(", ")}`, d: `${nm(ideal[0])} is the most valuable substitute (${P(ideal[0]).toFixed(1)} xP, ${pct(MP(ideal[0]).pPlay)} to play) but is ${["first", "second", "third"][outB.indexOf(ideal[0])]} in line. FPL brings substitutes on in bench order.`, unc: "Only matters if a starter misses out.", why: whyHTML(ideal.map((id) => E[id])), act: { a: "bench", ids: ideal, l: "Apply bench order" } });
    } else out.push({ sec: "bench", k: "good", lab: "Projection", t: "Bench order is right", d: `If a starter misses out, ${(() => { const s = benchIds.slice(1).find((id) => MP(id).pPlay >= 0.5); return s ? `${nm(s)} (${P(s).toFixed(1)} xP) is first in line` : "your bench covers the formation"; })()}.` });
    if (!out.some((x) => x.sec === "risk")) out.push({ sec: "risk", k: "good", lab: "Projection", t: "No minutes or availability risks in your XI", d: "Every starter is fit, has a fixture and has been starting regularly.", unc: `Team news from the press conferences before the GW${gwNext} deadline.` });

    out.push(...gwBuys(st), ...gwChips(st));
    return out;
  }

  // ---- Transfers: roll vs the strongest move or sequence, valued on your best XI over 5 gameweeks ----
  function gwBuys(st) {
    const B = GWE.base, c = gwCalc(st), key = st.ids.join() + "|" + c.bank + "|" + c.n;
    if (GWE.buys && GWE.buys.key === key) return GWE.buys.out;
    const TO = gwTO(), nm = (e) => esc(e.web_name), fmt1 = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(1);
    const ftLeft = B.unlimited ? 15 : Math.max(0, B.ft - c.n);
    const sellFor = (id) => (st.xf.some((t) => t.inn === id) ? E[id].now_cost : B.sell[id] ?? E[id].now_cost);
    // Rolling a free transfer keeps flexibility for next week (up to 5 can be saved). Valued at ~1.5 pts
    // while you hold fewer than 4, ~0.5 at 4 and nothing at 5 (an assumption, labelled as such).
    const rollValue = B.unlimited ? 0 : ftLeft >= 5 ? 0 : ftLeft === 4 ? 0.5 : 1.5;
    const sh0 = squadHealth(st.ids).n;
    let bank = c.bank, cur = [...st.ids]; const tc = {}; cur.forEach((id) => (tc[E[id].team] = (tc[E[id].team] || 0) + 1));
    const xi5 = (ids) => bestXI(ids, gp5).sum, xi1 = (ids) => bestXI(ids, gp1).sum;
    const picks = [], held = {};
    for (let round = 0; round <= Math.min(ftLeft, 4); round++) {
      const base5 = xi5(cur), sh = squadHealth(cur).n; let best = null;
      cur.forEach((id, slot) => {
        const e = E[id]; if (e.element_type === 1 && slot === 11 && availability(e) > 0) return; // backup keeper
        const budget = bank + sellFor(id), mo = momentum(e);
        candidates(e.element_type, budget, new Set(cur), tc, e.team, TO, new Set()).slice(0, 6).forEach((cd) => {
          const nid = cur.map((x) => (x === id ? cd.e.id : x)), g = xi5(nid) - base5;
          // below 14 playable, restoring a reliable body is worth ~1 pt of cover
          const cover = sh < 14 && !minutesProfile(e).playable && minutesProfile(cd.e).playable ? 1 : 0;
          const opt = { out: e, inn: cd.e, gain: g, cover, score: g + cover, budget, nid, slot, mo };
          if (mo.hold) { if (round === 0 && (!held[e.id] || opt.score > held[e.id].score)) held[e.id] = opt; return; }
          if (!best || g + cover > best.score) best = opt;
        });
      });
      if (!best) break;

      picks.push({ ...best, g1: xi1(best.nid) - xi1(cur), free, bankAfter: best.budget - best.inn.now_cost, sellP: sellFor(best.out.id) });
      bank = best.budget - best.inn.now_cost; tc[best.out.team]--; tc[best.inn.team] = (tc[best.inn.team] || 0) + 1; cur = best.nid;
      if (!free) break;
    }
    const dl = Date.parse(D.events.find((x) => x.id === gwNext)?.deadline || 0), hoursLeft = (dl - Date.now()) / 36e5;
    const res = picks.map((x, i) => {
      const pmI = priceMove(x.inn), pmO = priceMove(x.out);
      const timing = pmI.cls === "up" ? `${nm(x.inn)}'s price is rising (${pmI.txt.charAt(0).toLowerCase() + pmI.txt.slice(1)}): buy before the overnight update or pay £0.1m more.`
        : pmO.cls === "down" ? `${nm(x.out)}'s price is falling (${pmO.txt.charAt(0).toLowerCase() + pmO.txt.slice(1)}): sell before it drops.`

      // League risk: selling a template player (most of the league owns him) loses ground if he hauls.
      const lo = own[x.out.id] || 0, L = leagueCtx();
      const tmpl = lo >= 0.6 ? ` Risk: ${Math.round(lo * 100)}% of your league own ${nm(x.out)}, so if he hauls you lose ground on almost everyone; ${L.stance === "chase" ? `as you're chasing, that's a calculated risk worth taking for the xP gain${sc.cold ? ", and his form and fixtures make it a sound one" : ""}` : L.stance === "protect" ? "as you're protecting a lead, think twice" : "only worth it because the xP gain is clear"}.` : "";
      const freed = x.out.now_cost - x.inn.now_cost >= 25 ? ` It frees £${price(x.sellP - x.inn.now_cost)}m: plan where it goes next week rather than leaving it in the bank.` : "";
      return {
        sec: "buy", k: x.free ? "good" : "warn", lab: "Projection",
        t: `${x.free ? "" : "Worth a −4: "}Sell ${nm(x.out)}, buy ${nm(x.inn)} (${tShort(x.inn.team)}, £${price(x.inn.now_cost)}m)`,
        d: `${why ? why.trim() + " " : ""}Your best XI gains ${fmt1(x.gain)} xP over the next 5 gameweeks${x.free ? "" : ` (${fmt1(x.gain - 4)} after the hit)`} and ${fmt1(x.g1)} in GW${gwNext}${x.slot > 10 ? ` (${nm(x.out)} is on your bench now)` : ""}.${i === 0 && x.free ? ` That beats rolling, which is worth about ${rollValue.toFixed(1)} pts of flexibility.` : ""} ${nm(x.out)} sells for £${price(x.sellP)}m (now £${price(x.out.now_cost)}m); leaves £${price(x.bankAfter)}m in the bank.${sh1 !== sh0 ? ` Playable squad ${sh0} → ${sh1} of 15.` : ""}${tmpl}${freed} ${timing}`,
        unc: `${nm(x.inn)}: ${pct(minutesProfile(x.inn).pStart)} to start in GW${gwNext}, next 3 ${[0, 1, 2].map((k) => (teamFx[x.inn.team][gwNext + k] || []).map(fxLabel).join(" + ") || "blank").join(", ")}. The 5-gameweek gain is a projection; fixtures after GW${gwNext} use FDR, not odds.`,
        why: whyHTML([x.out, x.inn]), act: { a: "xfer", out: x.out.id, inn: x.inn.id, gain: x.gain, hit: !x.free, bankAfter: x.bankAfter, l: `Make this transfer` },
      };
    });
    // Players kept this week on momentum and fixture, even though the 5-gameweek model would sell them.
    Object.values(held).filter((h) => h.score >= Math.max(3, rollValue + 1.5)).sort((a, b) => b.score - a.score).forEach((h) => {
      const pmI = priceMove(h.inn);
      res.push({ sec: "buy", k: "info", lab: "Assumption", hold: h.out.id, t: `Keep ${nm(h.out)} this week`,
        d: `He returned in GW${h.mo.gw} (${h.mo.ret}) and has an easy next fixture: ${h.mo.fxT}. Selling him for ${nm(h.inn)} projects ${fmt1(h.gain)} pts over 5 gameweeks, but the move will still be there after GW${gwNext}, so ride the form this week and revisit then.${pmI.cls === "up" ? ` Cost of waiting: ${nm(h.inn)}'s price is rising (${pmI.txt.charAt(0).toLowerCase() + pmI.txt.slice(1)}), so he may cost £0.1m more.` : ""}`,
        unc: `GW${gwNext} xP: ${nm(h.out)} ${gp1(h.out).toFixed(1)} vs ${nm(h.inn)} ${gp1(h.inn).toFixed(1)}. If ${nm(h.out)} blanks or his minutes drop, make the switch next week.`,
        why: whyHTML([h.out, h.inn]) });
    });
    if (!res.some((x) => x.act)) res.push({ sec: "buy", k: "good", lab: "Assumption", t: ftLeft ? `Roll your transfer` : "No upgrade worth a −4 hit", d: ftLeft ? `No affordable signing adds more than ${Math.max(3, rollValue + 1.5).toFixed(1)} xP to your best XI over 5 gameweeks (bank £${price(c.bank)}m), which is less than the value of rolling. You'll have ${Math.min(5, ftLeft + 1)} free transfer${ftLeft + 1 > 1 ? "s" : ""} next gameweek.` : `You've used your free transfers. No upgrade gains enough over 5 gameweeks to cover the 4-point cost.`, unc: "An injury in team news could make a transfer worthwhile: check before the deadline." });
    GWE.buys = { key, out: res };
    return res;
  }

  // ---- Chips: use now vs the best plausible window in the next 5 gameweeks ----
  function gwChips(st) {
    const B = GWE.base, key = st.ids.join() + "|" + st.cap;
    if (GWE.chipsAdv && GWE.chipsAdv.key === key) return GWE.chipsAdv.out;
    const TO = gwTO(), N = Math.min(5, 39 - gwNext);
    const live = B.mt && (B.mt.ok ? B.mt : B.mt.last);
    let avail = live && live.chips && live.chips.length ? live.chips.filter((c) => c.status_for_entry === "available").map((c) => c.name) : chipsLeft(myM).filter((c) => !c.used).map((c) => c.name);
    avail = avail.filter((n) => ["bboost", "3xc", "freehit", "wildcard"].includes(n));
    const out = [];
    const def = (D.chips_def || []).find(([n, s, e]) => gwNext >= s && gwNext <= e);
    const expires = def ? def[2] : 38;
    const per = (e, k) => Math.max(0, expertScore(e, k + 1, TO) - (k ? expertScore(e, k, TO) : 0));
    const dgw = (k) => st.ids.filter((id) => (teamFx[E[id].team][gwNext + k] || []).length > 1).length;
    const blank = (k) => st.ids.filter((id) => !(teamFx[E[id].team][gwNext + k] || []).length).length;
    const scen = [];
    for (let g = gwNext; g <= Math.min(38, expires); g++) { const d = st.ids.filter((id) => (teamFx[E[id].team][g] || []).length > 1).length, b = st.ids.filter((id) => !(teamFx[E[id].team][g] || []).length).length; if (d >= 3 || b >= 3) scen.push(`GW${g}: ${d >= 3 ? `${d} of your players play twice` : `${b} of your players have no game`}`); }
    if (avail.includes("bboost")) {
      const bench = st.ids.slice(11);
      const v = [...Array(N)].map((_, k) => bench.reduce((a, id) => a + per(E[id], k), 0));
      const bestK = v.indexOf(Math.max(...v));
      const now = bestK === 0 && v[0] >= 10;
      out.push({ sec: "chip", k: now ? "warn" : "good", lab: "Projection", t: now ? `Bench Boost: use it this week` : `Bench Boost: save it`, d: `Your bench projects ${v[0].toFixed(1)} xP in GW${gwNext}; the best week in the next ${N} is GW${gwNext + bestK} (${v[bestK].toFixed(1)}). A Bench Boost is best in a double gameweek with 15 playable players${dgw(0) ? `; ${dgw(0)} of yours play twice this week` : ""}.`, unc: scen.length ? `Fixture scenarios before it expires (GW${expires}): ${scen.join("; ")}.` : `No double gameweeks are scheduled for your players before it expires (GW${expires}); rearranged fixtures could create one.` });
    }
    if (avail.includes("3xc")) {
      const xi = st.ids.slice(0, 11);
      const v = [...Array(N)].map((_, k) => Math.max(...st.ids.map((id) => per(E[id], k))));
      const bestK = v.indexOf(Math.max(...v)), capNow = Math.max(...xi.map((id) => gp1(E[id])));
      const now = bestK === 0 && capNow >= 9;
      out.push({ sec: "chip", k: now ? "warn" : "good", lab: "Projection", t: now ? `Triple Captain: use it this week` : `Triple Captain: save it`, d: `Your best captain projects ${capNow.toFixed(1)} xP this week, so the chip adds about ${capNow.toFixed(1)}. The best week in the next ${N} is GW${gwNext + bestK} (${v[bestK].toFixed(1)}). It's worth most on a premium player with two games or a standout home fixture.`, unc: `Must be used by GW${expires}. ${scen.length ? `Scenarios: ${scen.join("; ")}.` : "No doubles scheduled yet."}` });
    }
    if (avail.includes("freehit")) {
      const fh = freeHitXI(st), curBest = bestXI(st.ids).sum, gain = fh ? fh.sum - curBest : 0, blanks = blank(0);
      const now = gain >= 15 || blanks >= 4;
      out.push({ sec: "chip", k: now ? "warn" : "good", lab: "Projection", t: now ? `Free Hit: worth using this week` : `Free Hit: save it`, d: fh ? `The best XI you could field for one week within your £${price(fh.budget)}m projects ${fh.sum.toFixed(1)} xP vs ${curBest.toFixed(1)} for your best XI: ${gain >= 0 ? "+" : ""}${gain.toFixed(1)}. ${blanks ? `${blanks} of your players have no GW${gwNext} game. ` : ""}A Free Hit is best saved for a blank or double gameweek, when the gap is much bigger. Your squad returns unchanged afterwards.` : "Couldn't build a Free Hit team.", unc: `Must be used by GW${expires}. ${scen.length ? `Scenarios: ${scen.join("; ")}.` : "No blanks or doubles scheduled yet."}`, why: fh ? `<details class="why"><summary>Free Hit XI</summary><div class="why-b"><div class="why-p"><ul>${fh.ids.map((id) => `<li>${esc(E[id].web_name)} (${tShort(E[id].team)}, £${price(E[id].now_cost)}m) ${gp1(E[id]).toFixed(1)}</li>`).join("")}</ul></div></div></details>` : "" });
    }

      const sh = squadHealth(st.ids).n, buys = GWE.buys ? GWE.buys.out.filter((x) => x.act).length : 0;
      const now = sh <= 12;
      out.push({ sec: "chip", k: now ? "warn" : "good", lab: "Projection", t: now ? `Wildcard: consider it` : `Wildcard: save it`, d: `${sh} of 15 players are genuinely playable${buys ? ` and ${buys} upgrade${buys > 1 ? "s" : ""} fit within your free transfers` : ""}. A Wildcard pays off when you need 4+ transfers, or before a fixture swing or double gameweek.`, unc: `Must be used by GW${expires}.` });
    }
    if (!out.length) out.push({ sec: "chip", k: "good", lab: "Fact", t: "No chips available", d: `You have no chips left to play before GW${expires}.` });
    GWE.chipsAdv = { key, out };
    return out;
  }
  // Free Hit: the best one-week XI within your total selling value, with a cheap bench.
  function freeHitXI(st) {
    if (GWE.fh && GWE.fh.key === gwNext) return GWE.fh.v;
    const B = GWE.base, budgetAll = GWE.st.ids.reduce((a, id) => a + (B.sell[id] ?? E[id].now_cost), 0) + gwCalc(GWE.st).bank;
    const pool = Object.values(E).filter((e) => isFit(e) && e.minutes >= 270 && (teamFx[e.team][gwNext] || []).length);
    const cheap = { 1: 40, 2: 40, 3: 45, 4: 45 };
    const budget = budgetAll - (cheap[1] + cheap[2] + cheap[3] + 5); // a 4-man bench at near minimum prices
    const top = {}; [1, 2, 3, 4].forEach((t) => (top[t] = pool.filter((e) => e.element_type === t).sort((a, b) => gp1(b) - gp1(a)).slice(0, 25)));
    // start from the best XI in 3-4-3/4-4-2/etc., then downgrade where it costs the fewest points per £
    let best = null;
    [[3, 4, 3], [3, 5, 2], [4, 4, 2], [4, 3, 3], [4, 5, 1], [5, 3, 2], [5, 4, 1]].forEach(([d, m, f]) => {
      const need = { 1: 1, 2: d, 3: m, 4: f };
      let xi = [1, 2, 3, 4].flatMap((t) => top[t].slice(0, need[t]));
      const ok = () => { const c = {}; xi.forEach((e) => (c[e.team] = (c[e.team] || 0) + 1)); return Object.values(c).every((n) => n <= 3); };
      let guard = 0;
      while ((xi.reduce((a, e) => a + e.now_cost, 0) > budget || !ok()) && guard++ < 60) {
        let move = null;
        xi.forEach((e, i) => top[e.element_type].forEach((r) => {
          if (xi.includes(r) || r.now_cost >= e.now_cost) return;
          const loss = (gp1(e) - gp1(r)) / (e.now_cost - r.now_cost);
          if (!move || loss < move.loss) move = { i, r, loss };
        }));
        if (!move) break; xi[move.i] = move.r;
      }
      if (xi.reduce((a, e) => a + e.now_cost, 0) > budget || !ok()) return;
      const sum = xi.reduce((a, e) => a + gp1(e), 0);
      if (!best || sum > best.sum) best = { ids: xi.map((e) => e.id), sum, budget: budgetAll };
    });
    GWE.fh = { key: gwNext, v: best };
    return best;
  }

  function gwApply(act) {
    if (act.a === "xfer") { gwTransfer(act.out, act.inn); return; }
    const st = GWE.st;
    if (act.a === "bestxi") {
      const bx = bestXI(st.ids);
      const order = (ids) => [...ids].sort((a, b) => E[a].element_type - E[b].element_type);
      const bench = [bx.gkBench, ...bx.bench.sort((a, b) => gp1(E[b]) * minutesProfile(E[b]).pPlay - gp1(E[a]) * minutesProfile(E[a]).pPlay)];
      st.ids = [...order(bx.ids), ...bench];
      const xi = st.ids.slice(0, 11), byP = [...xi].sort((a, b) => gp1(E[b]) - gp1(E[a]));
      if (!xi.includes(st.cap)) st.cap = byP.find((id) => id !== st.vc) || byP[0];
      if (!xi.includes(st.vc) || st.vc === st.cap) st.vc = byP.find((id) => id !== st.cap);
    } else if (act.a === "cap") { st.cap = act.id; st.vc = act.vc; }
    else if (act.a === "swap") { gwSwap(act.id, act.with); }
    else if (act.a === "bench") { st.ids = [...st.ids.slice(0, 12), ...act.ids]; }
    GWE.sel = null; gwSave();
  }

  // ---- drawing ----
  function drawGw() {
    const app = $("#app"), B = GWE.base, st = GWE.st; if (!B || view !== "gw") return;
    const c = gwCalc(st), c0 = gwCalc({ ids: B.ids, cap: B.cap, vc: B.vc, xf: [] });
    const ev = D.events.find((x) => x.id === gwNext);
    const dPts = c.pts - c0.pts, net = c.gain5 - 4 * c.paid;
    const changed = st.xf.length || st.ids.join() !== B.ids.join() || st.cap !== B.cap || st.vc !== B.vc;
    const sel = GWE.sel ? E[GWE.sel] : null;
    if (sel) GWE.pk.pos = sel.element_type;
    const nextHit = !B.unlimited && c.n >= B.ft;
    const fmt1 = (v) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(1);

    const card = (id, slot) => {
      const e = E[id], f = nextFx(e.team, gwNext), fx = f && f.gw === gwNext ? f.list : [];

        <span class="kit">${st.cap === id ? '<span class="badge">C</span>' : st.vc === id ? '<span class="badge vc">V</span>' : ""}${a < 1 ? `<span class="flag ${a === 0 ? "out" : ""}">!</span>` : ""}${code != null ? `<img src="kit/${code}${e.element_type === 1 ? "_1" : ""}.png" alt="" width="56" height="56" decoding="async" onerror="this.parentNode.classList.add('nokit');this.remove()">` : ""}</span>
        <span class="plate"><span class="nm">${esc(e.web_name)}</span><span class="pts">${(gp1(e) * (st.cap === id ? (B.pending.includes("3xc") ? 3 : 2) : 1)).toFixed(1)}</span><span class="fx3" title="Next 3 gameweeks, coloured by FDR">${[0, 1, 2].map((k) => { const l = teamFx[e.team][gwNext + k] || []; return l.length ? `<i class="fdr${l[0].fdr}" title="GW${gwNext + k}: ${fxLabel(l[0])}${l.length > 1 ? " and " + fxLabel(l[1]) : ""}">${l[0].home ? tShort(l[0].opp).toUpperCase() : tShort(l[0].opp).toLowerCase()}${l.length > 1 ? "+" : ""}</i>` : `<i class="fdr0" title="GW${gwNext + k}: no fixture">–</i>`; }).join("")}</span>${(() => { const mp = minutesProfile(e); return `<span class="meta st-${confCls(mp.pStart) || "mid"}" title="Chance he starts the GW${gwNext} match. ${esc(mp.label)}: ${esc(mp.pattern)}">${isNew ? '<b class="newtag">New · </b>' : ""}${mp.hasFx ? `${pct(mp.pStart)}<span class="w-start"> start</span>` : "No match"}</span>`; })()}</span>
      </button>`;
    };
    const xiIds = st.ids.slice(0, 11), benchIds = st.ids.slice(11);
    const pitch = `<div class="pitch">${[1, 2, 3, 4].map((t) => `<div class="row">${xiIds.filter((id) => E[id].element_type === t).map((id) => card(id, true)).join("")}</div>`).join("")}</div>
      <div class="bench"><div class="bench-lbl">Bench (in substitution order)</div><div class="row">${benchIds.map((id) => card(id, true)).join("")}</div></div>`;

    const selBar = sel ? `<div class="selbar"><span><strong>${esc(sel.web_name)}</strong> selected. Tap ${st.ids.indexOf(sel.id) < 11 ? "a bench player to swap him out" : "a starter to bring him in"}, or pick a replacement on the right.</span>
        <span class="acts"><button class="btn sm pri pk-jump" data-act="pick">Find replacement</button>${st.ids.indexOf(sel.id) < 11 ? `<button class="btn sm" data-act="cap" ${st.cap === sel.id ? "disabled" : ""}>Captain</button><button class="btn sm" data-act="vc" ${st.vc === sel.id ? "disabled" : ""}>Vice-captain</button>` : ""}<button class="btn sm" data-act="clear">Cancel</button></span></div>`
      : `<div class="selbar idle">Tap a player to swap him with the bench, change the captain, or replace him with someone from the list.</div>`;

    // recommendations on the edited team
    const adv = gwAdvice(st);

    GWE.adv = adv;
    const SECS = [["xi", "Best XI this gameweek"], ["cap", "Captain and vice-captain"], ["risk", "Risks before the deadline"], ["bench", "Bench cover and squad health"], ["buy", `Transfers: roll or buy (${B.unlimited ? "chip active" : `${Math.max(0, B.ft - c.n)} free transfer${B.ft - c.n === 1 ? "" : "s"}`}, £${price(c.bank)}m in the bank)`], ["chip", "Chips"]];
    const LAB = { Fact: "lab-fact", Projection: "lab-proj", Assumption: "lab-asm" };
    const advHTML = SECS.map(([k, l]) => `<div class="adv-sec"><h4>${l}</h4><ul class="insights">${adv.map((x, i) => [x, i]).filter(([x]) => x.sec === k).map(([x, i]) => `<li class="${x.k}"><div><div class="t">${x.t}${x.lab ? ` <span class="lab ${LAB[x.lab]}">${x.lab}</span>` : ""}</div><div class="d">${x.d}</div>${x.unc ? `<div class="unc"><b>Main uncertainty:</b> ${x.unc}</div>` : ""}${x.act || x.why ? `<div class="adv-acts">${x.act ? `<button class="btn sm pri" data-adv="${i}">${esc(x.act.l)}</button>` : ""}${x.why || ""}</div>` : ""}</div></li>`).join("")}</ul></div>`).join("");
    // The decision: one line per area, from the first item in each section.
    const first = (k) => adv.find((x) => x.sec === k);
    const L = leagueCtx();
    const dec = [["XI", first("xi")], ["Captain", first("cap")], ["Transfers", first("buy")], ["Chips", adv.filter((x) => x.sec === "chip").find((x) => x.k === "warn") || { t: "Save your chips this week" }]].filter(([, x]) => x);
    const risksN = adv.filter((x) => x.sec === "risk" && x.k !== "good").length;
    const odT = FA.odds && FA.odds.fetched ? ukTime(FA.odds.fetched) : null, nwT = FA.news && FA.news.fetched ? ukTime(FA.news.fetched) : null;
    const decHTML = `<div class="decision"><div class="dec-h"><h3>Your GW${gwNext} decision</h3>${L.text ? `<span class="stance st-${L.stance}">${L.stance === "chase" ? "Chasing" : L.stance === "protect" ? "Protecting a lead" : "Balanced"}</span>` : ""}</div>
      <ol>${dec.map(([k, x]) => `<li><span class="dk">${k}</span> ${x.t}</li>`).join("")}${risksN ? `<li><span class="dk">Check</span> ${risksN} minutes or availability risk${risksN > 1 ? "s" : ""} below before the deadline</li>` : ""}</ol>
      ${L.text ? `<p class="note">${L.text}</p>` : ""}
      <p class="note src">Sources: squad, bank and free transfers from your FPL Pick Team (${B.live ? "live" : "rebuilt from public data"}); player stats from FPL (Opta), loaded ${new Date(D.generated_at).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}; bookmaker odds ${odT ? `refreshed ${odT}` : "not loaded: fixture difficulty used instead"}; news ${nwT ? `checked ${nwT}` : "not loaded"}. <span class="lab lab-fact">Fact</span> confirmed data, <span class="lab lab-proj">Projection</span> model estimate, <span class="lab lab-asm">Assumption</span> a judgement call.</p></div>`;
    const capSel = `<div class="capsel"><label>Captain <select id="gwCap">${xiIds.map((id) => `<option value="${id}" ${st.cap === id ? "selected" : ""}>${esc(E[id].web_name)} (${gp1(E[id]).toFixed(1)})</option>`).join("")}</select></label><label>Vice-captain <select id="gwVc">${xiIds.map((id) => `<option value="${id}" ${st.vc === id ? "selected" : ""}>${esc(E[id].web_name)} (${gp1(E[id]).toFixed(1)})</option>`).join("")}</select></label></div>`;

    const xfList = st.xf.length ? `<ul class="moves">${st.xf.map((t, i) => `<li class="${!B.unlimited && i >= B.ft ? "hit" : ""}"><span><span class="down">${esc(E[t.out].web_name)}</span> <span class="note">£${price(B.sell[t.out] ?? E[t.out].now_cost)}m</span> → <span class="up">${esc(E[t.inn].web_name)}</span> <span class="note">£${price(E[t.inn].now_cost)}m</span> ${!B.unlimited && i >= B.ft ? '<span class="pill sev3">−4 pts</span>' : '<span class="pill ok">Free</span>'} <span class="note">${fmt1(gp1(E[t.inn]) - gp1(E[t.out]))} GW${gwNext}, ${fmt1(gp5(E[t.inn]) - gp5(E[t.out]))} over 5 GWs</span></span><button class="btn sm" data-undo-x="${i}">Undo</button></li>`).join("")}</ul>` : "";

    app.innerHTML = `<section class="view">
      <div class="panel-head"><h2>Current gameweek: GW${gwNext}</h2><span class="note">Deadline ${ev ? new Date(ev.deadline).toLocaleString("en-GB", { timeZone: "Europe/London", weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : ""} UK</span></div>
      <p class="fresh">${B.src}.${D.source === "live" ? " Checking FPL for changes every minute." : ""}</p>
      ${gwSetupHTML()}
      ${B.pairs.length ? `<p class="note">Transfers already made on FPL for GW${gwNext}: ${B.pairs.map(([o, i]) => `${o ? esc(o.web_name) : "?"} → ${i ? esc(i.web_name) : "?"}`).join(", ")}${B.cost ? ` (−${B.cost} pts)` : ""}.</p>` : ""}
      <div class="ed-sum ${changed ? "changed" : ""}">
        <div><div class="k">Projected GW${gwNext} pts</div><div class="v">${c.pts.toFixed(1)}</div><small class="${dPts > 0.05 ? "up" : dPts < -0.05 ? "down" : ""}">${changed ? `${fmt1(dPts)} vs official team (${c0.pts.toFixed(1)})${c.paid ? `; ${fmt1(dPts - 4 * c.paid)} after the hit` : ""}` : "your official team"}</small></div>
        <div class="${c.hit ? "bad" : ""}"><div class="k">Transfer cost</div><div class="v ${c.hit ? "down" : ""}">${c.hit ? "−" + c.hit + " pts" : "0 pts"}</div><small>${B.unlimited ? "Wildcard/Free Hit active: unlimited" : `${c.n} new, ${Math.max(0, B.ft - c.n)} of ${B.ft} free left${nextHit ? " · next one costs −4" : ""}`}</small></div>
        <div><div class="k">In the bank</div><div class="v ${c.bank < 0 ? "down" : ""}">£${price(c.bank)}m</div><small>${c.n ? `was £${price(B.bank)}m` : `team value £${price(B.value)}m`}</small></div>
        <div><div class="k">Net gain, 5 GWs</div><div class="v ${net > 0.05 ? "up" : net < -0.05 ? "down" : ""}">${c.n ? fmt1(net) : "–"}</div><small>${c.n ? `transfers ${fmt1(c.gain5)}${c.paid ? `, hits −${4 * c.paid}` : ""}` : "make a transfer to see it"}</small></div>
        <div><div class="k">Formation</div><div class="v">${c.formation}</div><small>${changed ? `official ${c0.formation}` : "official"}</small></div>
        <div class="reset"><button class="btn ${changed ? "pri" : ""}" id="gwReset" ${changed ? "" : "disabled"}>Reset to official team</button></div>
      </div>
      ${GWE.msg ? `<p class="ed-msg" role="alert">${esc(GWE.msg)}</p>` : ""}
      ${xfList}
      <div class="ed-grid">
        <div class="panel ed-team"><div class="panel-head"><h3>Your GW${gwNext} team</h3><span class="note">Each shirt: GW${gwNext} projected points (captain's doubled), next 3 fixtures by FDR, and his chance of starting the GW${gwNext} match</span></div>${capSel}${selBar}${pitch}</div>
        <div class="panel ed-pick" id="gwPick"></div>
      </div>
      <div class="panel adv"><div class="panel-head"><h3>Recommendations for GW${gwNext}</h3><span class="note">For the team as edited. Only what could change your XI, captain, bench, transfers or chips before the deadline.</span></div>${decHTML}<div class="adv-grid">${advHTML}</div>
        <p class="note">xP is minutes-adjusted expected points (appearance, goals, assists, clean sheets, penalties, bonus and defensive contributions under this season's rules). Minutes come from each player's last 5 matches (a start counts at 50+ minutes), blended with his season rate and FPL's chance of playing. Penalty-box touches, shots, chances created and manager comments aren't in FPL's free data, so they aren't used. Tap Why? for the stats and odds behind a call.</p></div>
      <p class="note">Changes here are a sandbox saved in this browser only: make them on the FPL site to make them real. Projected points use the site's expert score (xG, xA, clean sheet odds, defensive contributions, bonus, fixtures and bookmaker odds, minutes, injuries and news). Sale prices follow FPL's rule that you keep half of any rise.</p>
      ${freshness()}
    </section>`;
    drawPicker();
    app.querySelectorAll(".pc.ed").forEach((b) => b.addEventListener("click", () => {
      const id = Number(b.dataset.el);
      if (!GWE.sel) { GWE.sel = id; GWE.msg = ""; }
      else if (GWE.sel === id) GWE.sel = null;
      else gwSwap(GWE.sel, id);
      drawGw();
    }));
    app.querySelector('[data-act="cap"]')?.addEventListener("click", () => { if (st.vc === GWE.sel) st.vc = st.cap; st.cap = GWE.sel; GWE.sel = null; gwSave(); drawGw(); });
    app.querySelector('[data-act="vc"]')?.addEventListener("click", () => { if (st.cap === GWE.sel) st.cap = st.vc; st.vc = GWE.sel; GWE.sel = null; gwSave(); drawGw(); });
    app.querySelectorAll("[data-adv]").forEach((b) => b.addEventListener("click", () => { const x = GWE.adv[Number(b.dataset.adv)]; if (x && x.act) { gwApply(x.act); drawGw(); } }));
    $("#gwCap")?.addEventListener("change", (ev) => { const v = Number(ev.target.value); if (st.vc === v) st.vc = st.cap; st.cap = v; gwSave(); drawGw(); });
    $("#gwVc")?.addEventListener("change", (ev) => { const v = Number(ev.target.value); if (st.cap === v) st.cap = st.vc; st.vc = v; gwSave(); drawGw(); });
    const missing = st.ids.filter((id) => !(id in FA.summ));
    if (missing.length && D.source === "live" && !GWE.fetching) { GWE.fetching = true; fetchSumm(missing).then(() => { GWE.fetching = false; drawGw(); }).catch(() => { GWE.fetching = false; }); }
    app.querySelector('[data-act="pick"]')?.addEventListener("click", () => $("#gwPick")?.scrollIntoView({ behavior: "smooth", block: "start" }));
    app.querySelector('[data-act="clear"]')?.addEventListener("click", () => { GWE.sel = null; GWE.msg = ""; drawGw(); });
    app.querySelectorAll("[data-undo-x]").forEach((b) => b.addEventListener("click", () => { gwUndo(Number(b.dataset.undoX)); drawGw(); }));
    $("#gwReset")?.addEventListener("click", () => { GWE.st = { sig: B.sig, ids: [...B.ids], cap: B.cap, vc: B.vc, xf: [] }; GWE.sel = null; GWE.msg = ""; gwSave(); drawGw(); });
  }

  function drawPicker() {
    const box = $("#gwPick"); if (!box) return;
    const st = GWE.st, pk = GWE.pk, sel = GWE.sel ? E[GWE.sel] : null, B = GWE.base;
    const c = gwCalc(st), nextHit = !B.unlimited && c.n >= B.ft;
    box.innerHTML = `<div class="panel-head"><h3>Player picker</h3><span class="note">${sel ? `Replacing <strong>${esc(sel.web_name)}</strong> (sells £${price(st.xf.some((t) => t.inn === sel.id) ? sel.now_cost : B.sell[sel.id] ?? sel.now_cost)}m)` : "Select a player in your team first"}</span></div>
      <div class="pk-ctl">
        <div class="seg" role="group" aria-label="Position">${[[1, "GK"], [2, "DEF"], [3, "MID"], [4, "FWD"]].map(([v, l]) => `<button data-pkpos="${v}" aria-pressed="${v === pk.pos}" ${sel && sel.element_type !== v ? "disabled" : ""}>${l}</button>`).join("")}</div>
        <select id="pkClub" aria-label="Club"><option value="all">All clubs</option>${[...D.teams].sort((a, b) => a.name.localeCompare(b.name)).map((t) => `<option value="${t.id}" ${String(t.id) === String(pk.club) ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select>
        <select id="pkSort" aria-label="Sort by">${[["p1", `Proj GW${gwNext}`], ["p5", "Proj 5 GWs"], ["price", "Price"], ["form", "Form"], ["own", "Ownership"]].map(([v, l]) => `<option value="${v}" ${v === pk.sort ? "selected" : ""}>${l}</option>`).join("")}</select>
        <input type="search" id="pkQ" placeholder="Search name" value="${esc(pk.q)}">
      </div>
      <p class="pk-hint ${sel && nextHit ? "bad" : ""}">${!sel ? "Tap a player on the pitch, then tap a name here to swap him in." : B.unlimited ? "Chip active: transfers are free." : nextHit ? `You've used your free transfers: this one will cost <strong>−4 pts</strong>.` : `This transfer is free (${B.ft - c.n} of ${B.ft} left).`} Budget £${price(c.bank)}m in the bank.</p>
      <div class="pk-list" id="pkList"></div>`;
    drawPickList();
    box.querySelectorAll("[data-pkpos]").forEach((b) => b.addEventListener("click", () => { pk.pos = Number(b.dataset.pkpos); drawPicker(); }));
    $("#pkClub").addEventListener("change", (e) => { pk.club = e.target.value; drawPickList(); });
    $("#pkSort").addEventListener("change", (e) => { pk.sort = e.target.value; drawPickList(); });
    $("#pkQ").addEventListener("input", debounce(() => { pk.q = $("#pkQ").value; drawPickList(); }, 150));
  }
  function drawPickList() {
    const box = $("#pkList"); if (!box) return;
    const st = GWE.st, pk = GWE.pk, sel = GWE.sel ? E[GWE.sel] : null;
    const q = pk.q.trim().toLowerCase();
    const key = { p1: (e) => gp1(e), p5: (e) => gp5(e), price: (e) => e.now_cost, form: (e) => +e.form || 0, own: (e) => +e.selected_by_percent || 0 }[pk.sort];
    const list = Object.values(E).filter((e) => e.element_type === pk.pos && (pk.club === "all" || String(e.team) === String(pk.club)) && (!q || `${e.web_name} ${e.first_name} ${e.second_name}`.toLowerCase().includes(q)) && (e.minutes > 0 || q || pk.club !== "all" || e.now_cost >= 45))
      .sort((a, b) => key(b) - key(a)).slice(0, 60);
    box.innerHTML = list.length ? list.map((e) => {
      const mine = st.ids.includes(e.id), why = sel && !mine ? gwTransferCheck(sel.id, e) : "";
      const d = sel ? gp1(e) - gp1(sel) : null, code = T[e.team]?.code;
      return `<button type="button" class="pk-row ${mine ? "mine" : ""} ${why ? "no" : ""}" data-in="${e.id}" ${!sel || mine || why ? "disabled" : ""}>
        ${code != null ? `<img src="kit/${code}${e.element_type === 1 ? "_1" : ""}.png" alt="" width="30" height="30" loading="lazy" onerror="this.remove()">` : "<span></span>"}
        <span class="pk-nm"><strong>${esc(e.web_name)}</strong>${availability(e) < 1 ? ` <span class="flag-i ${availability(e) === 0 ? "out" : ""}" title="${esc(e.news)}">!</span>` : ""}<small>${tShort(e.team)} · £${price(e.now_cost)}m · ${e.selected_by_percent}%</small></span>
        <span class="pk-fx">${fxStrip(e.team, gwNext, 3)}</span>
        <span class="pk-p"><strong>${gp1(e).toFixed(1)}</strong><small>${gp5(e).toFixed(1)} / 5</small></span>
        <span class="pk-d">${mine ? '<span class="note">In team</span>' : why ? `<span class="note">${esc(why)}</span>` : d != null ? `<span class="${d >= 0 ? "up" : "down"}">${d >= 0 ? "+" : "−"}${Math.abs(d).toFixed(1)}</span>` : ""}</span>
      </button>`;
    }).join("") : `<p class="empty">No players match.</p>`;

  }
  function gwSetupHTML() {

        <ol>

            <pre><code>const s=[localStorage,sessionStorage].flatMap(x=>Object.keys(x).filter(k=>k.startsWith("oidc.user:")).map(k=>[x,k]))[0];const m=s[1].match(/^oidc\\.user:(.+):([^:]+)$/);copy(JSON.stringify({authority:m[1],client_id:m[2],refresh_token:JSON.parse(s[0][s[1]]).refresh_token}))</code></pre></li>

  function pitchHTML(m, proj) {
    const picks = squadOf(m);
    if (!picks.length) return `<p class="empty">No picks available yet.</p>`;
    const xi = picks.filter((p) => p[1] <= 11), bench = picks.filter((p) => p[1] > 11);
    const card = (p) => {
      const [el, , mult, cap, vc] = p; const e = E[el]; if (!e) return "";
      const nf = nextFx(e.team); const f = nf?.list[0];
      const a = availability(e);
      const flag = a < 1 ? `<span class="flag ${a === 0 ? "out" : ""}" title="${esc(e.news)}">!</span>` : "";
      const pts = e.event_points * (mult || 1);
      const code = T[e.team]?.code;
      return `<div class="pc" title="${esc(e.first_name + " " + e.second_name)} · ${esc(T[e.team]?.name)} · £${price(e.now_cost)}m${e.news ? " · " + esc(e.news) : ""}">
        <span class="kit">${cap ? '<span class="badge">C</span>' : vc ? '<span class="badge vc">V</span>' : ""}${flag}${code != null ? `<img src="kit/${code}${e.element_type === 1 ? "_1" : ""}.png" alt="${esc(T[e.team]?.name)} ${e.element_type === 1 ? "goalkeeper " : ""}kit" width="56" height="56" decoding="async" onerror="this.parentNode.classList.add('nokit');this.remove()">` : ""}</span>
        <span class="plate">
          <span class="nm">${esc(e.web_name)}</span>
          <span class="pts">${proj ? (proj[el] || 0).toFixed(1) : mult === 0 && p[1] <= 11 ? "–" : pts}</span>
          <span class="fx fdr${f ? f.fdr : 0}">${f ? fxLabel(f) + (nf.list.length > 1 ? " +1" : "") : "No fixture"}</span>

  }

  // ---- League trend: who scored the most each gameweek, who owned him, and what the league captained ----
  async function renderLeagueTrend() {

  // ---- What the league tells you: your team against the top 10 of the mini-league ----
  // Rebuilt from live data on every load, so after each gameweek points appear, change or drop out on
  // their own. Every comparison uses the other managers in the top 10 (9 when you are in it).
  function insights() {
    const out = [];
    const sorted = [...members].sort((a, b) => a.rank - b.rank);
    const meRow = members.find((x) => x.entry === me);
    const top = sorted.filter((x) => x.entry !== me).slice(0, meRow.rank <= 10 ? 9 : 10);
    const T10 = top.length;
    const group = [...top, meRow].sort((a, b) => b.total - a.total);
    const myPicks = squadOf(myM), mine = new Set(myPicks.map((p) => p[0]));
    const own10 = {}, eo10 = {}, cap10 = {};
    top.forEach((x) => squadOf(x.m).forEach(([el, , mult, cap]) => { own10[el] = (own10[el] || 0) + 1; eo10[el] = (eo10[el] || 0) + mult; if (cap) cap10[el] = (cap10[el] || 0) + 1; }));
    const hist = (x, g) => x.m.history.find((r) => r[0] === g);
    const lastDone = D.events.filter((e) => e.finished).map((e) => e.id).pop() || gwCur;
    const nm = (x) => esc(firstName(x));
    // "Plays" = has minutes recently (or this season when recent data isn't loaded); excludes bench fodder like a 0-minute keeper.
    const plays = (e) => { const mi = minutesInfo(e); return e.minutes > 0 && mi.avg >= 20; };

    // 1. Where you stand within the top 10, and this gameweek's movement
    const posNow = group.findIndex((x) => x.entry === me) + 1;
    const prevTotals = group.map((x) => ({ x, t: (hist(x, gwCur - 1) || [0, 0, 0])[2] })).sort((a, b) => b.t - a.t);
    const posPrev = prevTotals.findIndex((v) => v.x.entry === me) + 1;
    const leader = group[0], tenth = group[group.length - 1];
    const mv = posPrev - posNow;
    out.push({ k: "info", t: `${ordinal(posNow)} of the top ${group.length}${mv ? ` (${mv > 0 ? "up" : "down"} ${Math.abs(mv)} since GW${gwCur - 1})` : ""}`,
      d: leader.entry === me ? `You lead the top 10 by ${meRow.total - group[1].total} pts.` : `${leader.total - meRow.total} pts behind ${nm(leader)} in 1st; ${meRow.total - tenth.total} pts clear of ${nm(tenth)} in ${ordinal(group.length)}. In GW${gwCur} you scored ${meRow.event_total} against a top-10 average of ${Math.round(top.reduce((a, x) => a + x.event_total, 0) / T10)}.` });

    // 2. Momentum over the last 3 gameweeks
    const last3 = (x) => [0, 1, 2].reduce((a, i) => { const r = hist(x, gwCur - i); return a + (r ? r[1] - r[4] : 0); }, 0);
    const my3 = last3(meRow), avg3 = top.reduce((a, x) => a + last3(x), 0) / T10;
    const hottest = [...top].sort((a, b) => last3(b) - last3(a))[0];
    out.push({ k: my3 >= avg3 ? "good" : "warn", t: `Last 3 gameweeks: ${my3} pts vs a top-10 average of ${Math.round(avg3)} (${my3 >= avg3 ? "+" : "−"}${Math.abs(Math.round(my3 - avg3))})`,
      d: `Hottest in the top 10: ${nm(hottest)} with ${last3(hottest)} pts${hottest.rank < meRow.rank ? "" : ", chasing you from below"}. ${my3 >= avg3 ? "You're gaining on the pack." : "The pack is pulling away; differentials are your route back."}` });

    // 3. Template threats: owned by at least half the top 10, not by you. Keepers/defenders from a club whose
    // defence you already own count as covered (you share their clean sheets).
    const tmpl = Object.keys(own10).map(Number).filter((el) => !mine.has(el) && own10[el] / T10 >= 0.5 && E[el]).sort((a, b) => eo10[b] - eo10[a]);
    const coverOf = (e) => (e.element_type <= 2 ? myPicks.map((p) => E[p[0]]).filter((m) => m && m.team === e.team && m.element_type <= 2) : []);
    const threats = tmpl.filter((el) => !coverOf(E[el]).length).slice(0, 5), covered = tmpl.filter((el) => coverOf(E[el]).length);
    const fmtT = (el) => `<strong>${esc(E[el].web_name)}</strong> (${own10[el]} of ${T10}${availability(E[el]) < 1 ? `, ${pct(availability(E[el]))} fit` : ""}, form ${E[el].form})`;
    const coverTxt = covered.length ? ` ${covered.map((el) => `${esc(E[el].web_name)} (${own10[el]} of ${T10}) is covered: you already share ${esc(T[E[el].team].name)} clean sheets through ${coverOf(E[el]).map((m) => esc(m.web_name)).join(" and ")}.`).join(" ")}` : "";
    if (threats.length) out.push({ k: "bad", t: `${threats.length} top-10 template player${threats.length > 1 ? "s" : ""} you don't own`, d: threats.map(fmtT).join(", ") + `. Every point they score is ground lost on most of the top 10.` + coverTxt });
    else out.push({ k: "good", t: "No template gaps against the top 10", d: `You own every player that half or more of the top 10 have, or already cover his club's defence.` + coverTxt });

    // 4. Your differentials: players who actually play and few of the top 10 own
    const diffs = myPicks.filter((p) => p[1] <= 11).map((p) => p[0]).filter((el) => E[el] && plays(E[el]) && (own10[el] || 0) / T10 <= 0.34);
    if (!diffs.length) out.push({ k: "warn", t: "No real differentials in your starting XI", d: `Every starter is owned by more than a third of the top 10, so your team largely moves with theirs. To gain ground you need at least one regular starter few of them own.` });
    if (diffs.length) {
      const pts = diffs.reduce((a, el) => a + (myPicks.find((p) => p[0] === el)[2] ? E[el].event_points * myPicks.find((p) => p[0] === el)[2] : 0), 0);
      out.push({ k: "good", t: `Your ${diffs.length} differential${diffs.length > 1 ? "s" : ""} against the top 10`,
        d: diffs.map((el) => `<strong>${esc(E[el].web_name)}</strong> (${own10[el] || 0} of ${T10}, form ${E[el].form})`).join(", ") + `. Starters owned by a third or fewer of the top 10; they scored ${pts} for you in GW${gwCur}. Bench fodder and players without minutes are left out. Keep them while their fixtures and minutes hold; they're how you gain ground.` });
    }

    // 5. Captaincy against the top 10
    const myCap = myPicks.find((p) => p[3]);
    const caps = Object.entries(cap10).sort((a, b) => b[1] - a[1]);
    if (caps.length && myCap) {
      const same = cap10[myCap[0]] || 0, top1 = caps[0];
      const capPts = (x) => { const c = squadOf(x.m).find((p) => p[3]); return c ? E[c[0]].event_points * c[2] : 0; };
      const avgCapPts = top.reduce((a, x) => a + capPts(x), 0) / T10;
      out.push({ k: "info", t: `GW${gwCur} armband: ${esc(E[top1[0]].web_name)} on ${top1[1]} of ${T10} top-10 teams`,
        d: `You captained ${esc(E[myCap[0]].web_name)}${same ? `, like ${same} of them` : ", a differential pick"}: ${E[myCap[0]].event_points * myCap[2]} pts against a top-10 captain average of ${avgCapPts.toFixed(1)}. Other choices: ${caps.slice(1, 4).map(([el, c]) => `${esc(E[el]?.web_name)} (${c})`).join(", ") || "none"}.` });
    }

    // 6. Effective ownership risk next gameweek (captain counts double)
    const eoRisk = Object.keys(eo10).map(Number).filter((el) => E[el] && availability(E[el]) > 0).map((el) => ({ el, eo: eo10[el] / T10, mineMult: (myPicks.find((p) => p[0] === el) || [0, 0, 0])[2] })).filter((x) => x.eo - x.mineMult >= 0.6).sort((a, b) => (b.eo - b.mineMult) - (a.eo - a.mineMult)).slice(0, 3);
    if (eoRisk.length) out.push({ k: "warn", t: "Biggest exposure gaps to the top 10", d: eoRisk.map((x) => `<strong>${esc(E[x.el].web_name)}</strong>: top-10 effective ownership ${pct(x.eo)} vs your ${pct(x.mineMult)}${mine.has(x.el) && x.mineMult === 0 ? " (he's on your bench)" : ""}`).join("; ") + ". Effective ownership counts starters, with captains double. If these players haul, you lose ground on the pack; start or cover the biggest one, or go against it knowingly." });

    // 7. Chips
    const myLeft = chipsLeft(myM).filter((c) => !c.used);
    const more = top.filter((x) => chipsLeft(x.m).filter((c) => !c.used).length > myLeft.length);
    out.push({ k: more.length ? "warn" : "good", t: more.length ? `${more.length} of the top 10 have more chips left than you` : "You have as many chips left as anyone in the top 10",
      d: `You have ${myLeft.map((c) => CHIP_LABEL[c.name]).join(", ") || "none"} left this half. ${more.length ? more.slice(0, 5).map((x) => `${nm(x)} (${chipsLeft(x.m).filter((c) => !c.used).map((c) => CHIP_LABEL[c.name]).join(" ")})`).join(", ") + ". Expect them to gain when they play them; time yours for a double or blank gameweek." : ""}` });

    // 8. Squad structure: value, hits, bench
    const val = (x) => squadValue(x.m) + bankOf(x.m);
    const valRank = 1 + top.filter((x) => val(x) > val(meRow)).length;
    const hits = (x) => seasonSum(x.m, 4), bench = (x) => seasonSum(x.m, 5);
    const avgHits = top.reduce((a, x) => a + hits(x), 0) / T10, avgBench = top.reduce((a, x) => a + bench(x), 0) / T10;
    out.push({ k: bench(meRow) > avgBench * 1.15 ? "warn" : "good", t: `Team value £${price(val(meRow))}m: ${ordinal(valRank)} of the top ${T10 + 1}`,
      d: `Hits taken: ${hits(meRow) ? "−" + hits(meRow) : "none"} (top-10 average ${avgHits >= 0.5 ? "−" + avgHits.toFixed(0) : "none"}). Points left on your bench: ${bench(meRow)} (top-10 average ${avgBench.toFixed(0)})${bench(meRow) > avgBench * 1.15 ? ", more than most; check your bench order and which defender you start" : ""}.` });

    // 9. Your squad: injuries and tough fixtures (only players who play)
    const flagged = myPicks.map((p) => p[0]).filter((el) => E[el] && availability(E[el]) < 1);
    if (flagged.length) out.push({ k: "warn", t: `${flagged.length} of your players flagged`, d: flagged.map((el) => `<strong>${esc(E[el].web_name)}</strong>: ${esc(E[el].news || "doubtful")}`).join("; ") });
    const tough = myPicks.filter((p) => p[1] <= 11 && E[p[0]] && plays(E[p[0]])).map((p) => ({ el: p[0], f: avgFdr(E[p[0]].team, gwNext, 3) })).filter((x) => x.f >= 3.67).sort((a, b) => b.f - a.f);
    if (tough.length) out.push({ k: "warn", t: "Starters facing a tough next three", d: tough.map((x) => `<strong>${esc(E[x.el].web_name)}</strong> (average difficulty ${x.f.toFixed(1)}, ${own10[x.el] || 0} of ${T10} top-10 own)`).join(", ") + ". If the top 10 own them too, the damage is shared; if not, consider moving them on." });
    return out;
  }
  function avgFdr(team, from, n) {
    const l = []; for (let g = from; g < from + n && g <= 38; g++) (teamFx[team][g] || []).forEach((f) => l.push(f.fdr));
    return l.length ? l.reduce((a, b) => a + b, 0) / l.length : 3;
  }

  // ---------- mini league analysis ----------
  const FRIENDS = ["Dipesh Patel", "Dhruve Gor", "Parit Shah", "Umesh Majithia"];
  const FAMILY = ["Dhruve Gor", "Parit Shah"];
  const norm = (s) => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
  const CHIP_NAME = { wildcard: "Wildcard", freehit: "Free Hit", bboost: "Bench Boost", "3xc": "Triple Captain" };
  const firstName = (x) => (x.player_name || "").split(" ")[0] || "Them";

  function analysisGroup() {
    const sorted = [...members].sort((a, b) => a.rank - b.rank);
    const group = [];
    if (sorted[0] && sorted[0].entry !== me) group.push({ x: sorted[0], role: "League leader" });
    const missing = [];
    FRIENDS.forEach((name) => {
      const x = members.find((m) => norm(m.player_name) === norm(name));
      if (!x) { missing.push(name); return; }
      const g = group.find((q) => q.x.entry === x.entry);
      const rel = FAMILY.some((f) => norm(f) === norm(name)) ? "Family" : "Friend";
      if (g) g.role = "League leader · " + rel.toLowerCase(); else if (x.entry !== me) group.push({ x, role: rel });
    });
    return { group, missing };
  }
  // Per-gameweek numbers for one manager. Net points = GW points minus hits, so the running total matches FPL.
  function gwStats(m) {
    const by = {};
    m.history.forEach(([ev, pts, total, tr, cost, bench, orank, value, bank]) => (by[ev] = { net: pts - cost, cost, total, tr, bench, orank, value, bank }));
    const chipAt = {}; m.chips.forEach(([n, ev]) => (chipAt[ev] = n));
    const nets = m.history.map((r) => r[1] - r[4]);
    const best = m.history.reduce((b, r) => (!b || r[1] - r[4] > b[1] ? [r[0], r[1] - r[4]] : b), null);
    const worst = m.history.reduce((b, r) => (!b || r[1] - r[4] < b[1] ? [r[0], r[1] - r[4]] : b), null);
    return { by, chipAt, avg: nets.length ? nets.reduce((a, b) => a + b, 0) / nets.length : 0, best, worst };
  }
  function chipStatus(m, name, s, e) {
    const u = m.chips.find(([n, ev]) => n === name && ev >= s && ev <= e);
    if (u) return { cls: "used", txt: `Used GW${u[1]}`, left: false };
    if (gwNext > e) return { cls: "exp", txt: "Not used, expired", left: false };
    if (gwNext < s) return { cls: "avail", txt: `Unlocks GW${s}`, left: true };
    return { cls: "avail", txt: "Available", left: true };
  }

  function renderAnalysis() {
    const { group, missing } = analysisGroup();
    if (!group.length) { $("#app").innerHTML = `<p class="empty">None of your friends or family were found in ${esc(D.league.name)}.</p>`; return; }
    let sel = store.get("h2h", null);
    if (!group.some((g) => g.x.entry === sel)) sel = group[0].x.entry;
    const them = group.find((g) => g.x.entry === sel).x;
    const meRow = members.find((x) => x.entry === me);
    const A = gwStats(myM), B = gwStats(them.m);
    const tn = firstName(them);
    const gws = []; for (let g = 1; g <= gwCur; g++) if (A.by[g] || B.by[g]) gws.push(g);
    let won = 0, lost = 0, drawn = 0;
    gws.forEach((g) => { if (A.by[g] && B.by[g]) { const d = A.by[g].net - B.by[g].net; d > 0 ? won++ : d < 0 ? lost++ : drawn++; } });
    const gap = meRow.total - them.total;

    const cards = group.map(({ x, role }) => {
      const d = x.total - meRow.total;

        <span class="tm">${esc(x.entry_name)}</span>
        <span class="row2"><span>${ordinal(x.rank)} · ${fmt(x.total)} pts</span><span class="${d > 0 ? "down" : d < 0 ? "up" : ""}">${d > 0 ? d + " ahead" : d < 0 ? -d + " behind" : "level"}</span></span>
      </button>`;
    }).join("");

    // head-to-head rows: [label, mine, theirs, kind] kind: "hi" higher is better, "lo" lower is better, "rank", null = no verdict
    const lh = lastHist(myM), th = lastHist(them.m);
    const money = (v) => "£" + price(v) + "m";
    const sumIdx = (m, i) => m.history.reduce((a, r) => a + r[i], 0);
    const capOf = (m) => { const c = squadOf(m).find((p) => p[3]); return c ? E[c[0]]?.web_name : "–"; };
    const rows = [
      ["League position", meRow.rank, them.rank, "rank", ordinal],
      ["Total points", meRow.total, them.total, "hi", fmt],
      [`GW${gwCur} points`, A.by[gwCur]?.net ?? 0, B.by[gwCur]?.net ?? 0, "hi", String],
      ["Average per gameweek", A.avg, B.avg, "hi", (v) => v.toFixed(1)],
      ["Best gameweek", A.best?.[1] ?? 0, B.best?.[1] ?? 0, "hi", null, (v, who) => `${v} <small style="color:var(--muted)">GW${(who === "a" ? A.best : B.best)?.[0]}</small>`],
      ["Worst gameweek", A.worst?.[1] ?? 0, B.worst?.[1] ?? 0, "hi", null, (v, who) => `${v} <small style="color:var(--muted)">GW${(who === "a" ? A.worst : B.worst)?.[0]}</small>`],
      ["Overall rank", lh[6], th[6], "orank", fmt],
      ["Squad value", squadValue(myM), squadValue(them.m), "hi", money],
      ["In the bank", bankOf(myM), bankOf(them.m), "hi", money],
      ["Total team value", squadValue(myM) + bankOf(myM), squadValue(them.m) + bankOf(them.m), "hi", money],
      ["Transfers made", sumIdx(myM, 3), sumIdx(them.m, 3), null, String],
      ["Points lost to hits", sumIdx(myM, 4), sumIdx(them.m, 4), "lo", (v) => (v ? "−" + v : "0")],
      ["Points left on bench", sumIdx(myM, 5), sumIdx(them.m, 5), "lo", String],
      [`GW${gwCur} captain`, capOf(myM), capOf(them.m), "text", esc],
    ];
    const diffCell = ([label, a, b, kind, f]) => {
      if (kind === "text" || kind === null) return `<td class="n" style="color:var(--muted)">${kind === "text" ? (a === b ? "Same" : "Different") : sign(a - b)}</td>`;
      if (kind === "rank" || kind === "orank") {
        const d = b - a; // positive = you are higher up
        if (!d) return `<td class="n">Level</td>`;
        return `<td class="n ${d > 0 ? "up" : "down"}">${fmt(Math.abs(d))} ${kind === "rank" ? "place" + (Math.abs(d) === 1 ? "" : "s") : ""} ${d > 0 ? "above" : "below"}</td>`;
      }
      let d = a - b; const good = kind === "hi" ? d > 0 : d < 0;
      const txt = label.includes("value") || label.includes("bank") ? (d > 0 ? "+" : d < 0 ? "−" : "") + "£" + price(Math.abs(d)) + "m" : label.startsWith("Average") ? sign(Number(d.toFixed(1))) : sign(d);
      return `<td class="n ${d === 0 ? "" : good ? "up" : "down"}">${d === 0 ? "Level" : txt}</td>`;
    };
    const h2hRows = rows.map((r) => {
      const [label, a, b, , f, custom] = r;
      const show = (v, who) => (custom ? custom(v, who) : f(v));
      return `<tr><td>${label}</td><td class="n">${show(a, "a")}</td><td class="n">${show(b, "b")}</td>${diffCell(r)}</tr>`;
    }).join("");

    // Chips come in two sets: GW1-19 and GW20-38.
    const halfRows = [];
    [[1, 19], [20, 38]].forEach(([hs, he]) => {
      const defs = D.chips_def.filter(([, s, e]) => s <= he && e >= hs);
      if (!defs.length) return;
      halfRows.push(`<tr class="half"><td colspan="3">${hs === 1 ? "First half" : "Second half"} · GW${hs}–${he}</td></tr>`);
      ["wildcard", "freehit", "bboost", "3xc"].forEach((n) => {
        const d = defs.find(([c]) => c === n); if (!d) return;

        halfRows.push(`<tr><td>${CHIP_NAME[n]}</td><td><span class="st ${a.cls}">${a.txt}</span></td><td><span class="st ${b.cls}">${b.txt}</span></td></tr>`);
      });
    });
    const nowLeft = (m) => D.chips_def.filter(([n, s, e]) => gwNext >= s && gwNext <= e && chipStatus(m, n, s, e).left).length;

    const tableRows = gws.map((g) => {
      const a = A.by[g], b = B.by[g];
      const d = a && b ? a.net - b.net : null, gapT = a && b ? a.total - b.total : null;
