      ${gwWinnersHTML()}
      <div class="panel" id="cmp"></div>
    </section>`;
    document.querySelectorAll("tbody tr.click").forEach((tr) => tr.addEventListener("click", () => {
      const e = Number(tr.dataset.e); if (e === me) return; store.set("rival", e); renderLeague(); $("#cmp").scrollIntoView({ behavior: "smooth", block: "start" });
    }));
    renderCompare(rival);
  }

  // Highest scorer in the league for every gameweek so far (points after hits).
  function gwWinnersHTML() {
    const rows = [], wins = {};
    for (let g = 1; g <= gwCur; g++) {
      const sc = members.map((x) => { const r = x.m.history.find((h) => h[0] === g); return r ? { x, net: r[1] - r[4], chip: x.m.chips.find(([, ev]) => ev === g)?.[0] } : null; }).filter(Boolean).sort((a, b) => b.net - a.net);
      if (!sc.length) continue;
      const top = sc.filter((v) => v.net === sc[0].net), second = sc.find((v) => v.net < sc[0].net);
      const mine = sc.find((v) => v.x.entry === me);
      top.forEach((v) => (wins[v.x.entry] = (wins[v.x.entry] || 0) + 1 / top.length));
      rows.push({ g, top, pts: sc[0].net, margin: second ? sc[0].net - second.net : 0, avg: sc.reduce((a, v) => a + v.net, 0) / sc.length, mine, myRank: mine ? 1 + sc.filter((v) => v.net > mine.net).length : null, n: sc.length });
    }
    const ev = D.events.find((e) => e.id === gwCur);
    const tally = Object.entries(wins).map(([e, w]) => ({ x: members.find((m) => m.entry === Number(e)), w })).sort((a, b) => b.w - a.w || a.x.rank - b.x.rank);
    const myWins = wins[me] || 0;
    const fmtW = (w) => (Number.isInteger(w) ? w : w.toFixed(1));
    return `<div class="panel">
      <div class="panel-head"><h2>Gameweek winners</h2><span class="note">Top score in ${esc(D.league.name)} each gameweek, after hits${ev && !ev.finished ? `. GW${gwCur} is still in progress` : ""}</span></div>
      <div class="win-tally">${tally.map(({ x, w }) => `<span class="wt ${x.entry === me ? "me" : ""}"><strong>${fmtW(w)}</strong> ${esc(x.player_name)}</span>`).join("")}${myWins ? "" : `<span class="wt me"><strong>0</strong> You</span>`}</div>
      <p class="note">Gameweek wins so far. A shared top score is split between the managers who tied.</p>
      <div class="tbl-wrap"><table class="cards-sm win-tbl">
        <thead><tr><th>Gameweek</th><th>Winner</th><th class="n">Points</th><th class="n">Won by</th><th class="n">League avg</th><th class="n">Your score</th></tr></thead>
        <tbody>${rows.slice().reverse().map((r) => `<tr class="${r.top.some((v) => v.x.entry === me) ? "me" : ""}"><td>GW${r.g}${r.g === gwCur && ev && !ev.finished ? ' <span class="pill">Live</span>' : ""}</td>
          <td><span class="mgr"><span>${r.top.map((v) => `${esc(v.x.entry_name)}${v.chip ? ` <span class="chip on">${CHIP_LABEL[v.chip] || esc(v.chip)}</span>` : ""}`).join(" & ")}</span><small>${r.top.map((v) => esc(v.x.player_name)).join(" & ")}${r.top.length > 1 ? " (tied)" : ""}</small></span></td>
          <td class="n"><strong>${r.pts}</strong></td><td class="n">${r.top.length > 1 ? "Tie" : "+" + r.margin}</td><td class="n">${r.avg.toFixed(0)}</td>
          <td class="n">${r.mine ? `${r.mine.net} <small style="color:var(--muted)">${ordinal(r.myRank)} of ${r.n}</small>` : "–"}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>`;
  }

  function raceChart(rival) {
    const gws = []; for (let g = 1; g <= gwCur; g++) gws.push(g);
    const totals = {}; members.forEach((x) => { totals[x.entry] = {}; x.m.history.forEach((r) => (totals[x.entry][r[0]] = r[2])); });
    const avg = {}; gws.forEach((g) => { const v = members.map((x) => totals[x.entry][g]).filter((v) => v != null); avg[g] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; });
    const series = members.map((x) => ({ e: x.entry, pts: gws.filter((g) => totals[x.entry][g] != null).map((g) => [g, totals[x.entry][g] - avg[g]]) }));
    let lo = 0, hi = 0; series.forEach((s) => s.pts.forEach(([, v]) => { lo = Math.min(lo, v); hi = Math.max(hi, v); }));
    const steps = [5, 10, 20, 25, 50, 100, 200]; const step = steps.find((s) => (hi - lo) / s <= 6) || 200;
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const W = 820, H = 320, L = 44, R = 110, Tp = 12, B = 28;
    const x = (g) => L + ((g - 1) / Math.max(1, gwCur - 1)) * (W - L - R);
    const y = (v) => Tp + (1 - (v - lo) / (hi - lo || 1)) * (H - Tp - B);
    let g = "";
    for (let v = lo; v <= hi; v += step) g += `<line class="${v === 0 ? "zero" : "grid"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? "+" + v : v}</text>`;
    gws.forEach((gw) => { if (gwCur <= 12 || gw % 2 === 1 || gw === gwCur) g += `<text class="ax" x="${x(gw)}" y="${H - 8}" text-anchor="middle">${gw}</text>`; });
    const path = (s) => s.pts.map(([gw, v], i) => (i ? "L" : "M") + x(gw).toFixed(1) + "," + y(v).toFixed(1)).join("");
    series.filter((s) => s.e !== me && s.e !== rival).forEach((s) => (g += `<path class="other" d="${path(s)}"/>`));
    const sr = series.find((s) => s.e === rival), sm = series.find((s) => s.e === me);
    const rn = members.find((x) => x.entry === rival)?.player_name.split(" ")[0] || "Rival";
    if (sr) g += `<path class="riv" d="${path(sr)}"/>`;
    if (sm) g += `<path class="mine" d="${path(sm)}"/>`;
    const last = (s) => s && s.pts[s.pts.length - 1];
    const pm = last(sm), pr = last(sr);
    // end labels: nudge apart in pixel space when they would overlap
    let ym = pm ? y(pm[1]) : 0, yr = pr ? y(pr[1]) : 0;
    if (pm && pr && Math.abs(ym - yr) < 15) { const mid = (ym + yr) / 2, up = pm[1] >= pr[1]; ym = mid + (up ? -8 : 8); yr = mid + (up ? 8 : -8); }
    const end = (p, ly, cls, colorVar, label) => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" style="fill:var(${colorVar})"/><text class="${cls}" x="${x(p[0]) + 8}" y="${ly + 4}">${esc(label)} ${p[1] > 0 ? "+" : ""}${Math.round(p[1])}</text>`;
    if (pr) g += end(pr, yr, "lbl-rv", "--s-them", rn);
    if (pm) g += end(pm, ym, "lbl-me", "--s-me", "You");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Season race chart">${g}</svg>`;
  }

  function renderCompare(rival) {

  // ---------- planner ----------
  let selOut = null;
  function planState() { return store.get("plan:" + gwNext, []); }
  function setPlan(p) { store.set("plan:" + gwNext, p); }
  function plannedSquad() {
    const plan = planState();
    const sq = squadOf(myM).map((p) => ({ el: p[0], slot: p[1], orig: p[0] }));
    plan.forEach(({ out, inn }) => { const s = sq.find((x) => x.el === out); if (s) s.el = inn; });

  }

        && ((teamCount[e.team] || 0) - (e.team === o.team ? 1 : 0)) < 3 && availability(e) > 0 && (!q || e.web_name.toLowerCase().includes(q)))
        .map((e) => ({ e, p: project(e, h) })).sort((a, b) => b.p - a.p).slice(0, 25);
      repl = `<div class="panel">
        <div class="panel-head"><h3>Replacements for ${esc(o.web_name)} (budget £${price(budget)}m)</h3><input type="search" id="q" placeholder="Filter by name" value="${esc(q)}"></div>
        <div class="tbl-wrap"><table class="cards-sm"><thead><tr><th>Player</th><th class="n">£</th><th class="n">Form</th><th class="n">xGI/90</th><th class="n">FPL xP</th><th class="n">Proj ${h}GW</th><th class="n">vs out</th><th class="n">League</th><th>Next fixtures</th><th></th></tr></thead><tbody>
        ${cands.map(({ e, p }) => `<tr><td><span class="mgr">${esc(e.web_name)}<small>${tShort(e.team)}${e.news ? " · " + esc(e.news) : ""}</small></span></td><td class="n">${price(e.now_cost)}</td><td class="n">${e.form}</td><td class="n">${Number(e.expected_goal_involvements_per_90 || 0).toFixed(2)}</td><td class="n">${e.ep_next}</td><td class="n"><strong>${p.toFixed(1)}</strong></td><td class="n ${p - project(o, h) >= 0 ? "up" : "down"}">${sign(Number((p - project(o, h)).toFixed(1)))}</td><td class="n">${Math.round((own[e.id] || 0) * 100)}%</td><td>${fxStrip(e.team, gwNext, Math.min(h, 6))}</td><td><button class="btn sm pri" data-in="${e.id}">Bring in</button></td></tr>`).join("") || '<tr><td colspan="10" class="empty">Nobody fits this budget and team limit.</td></tr>'}
        </tbody></table></div></div>`;
    }

    const capRank = sq.filter((s) => s.slot <= 11).map((s) => E[s.el]).sort((a, b) => parseFloat(b.ep_next) - parseFloat(a.ep_next)).slice(0, 5);

    $("#app").innerHTML = `

      <div class="panel-head"><h2>GW${gwNext} transfer planner</h2>
        <label class="controls"><span class="note">Projection window</span><select id="hz">${[3, 5, 8].map((v) => `<option value="${v}" ${v === h ? "selected" : ""}>Next ${v} GWs</option>`).join("")}</select></label></div>
      <div class="plan-sum">
        <div><div class="k">In the bank</div><div class="v ${bank < 0 ? "down" : ""}">£${price(bank)}m</div></div>
        <div><div class="k">Transfers</div><div class="v">${plan.length} / ${ft} free</div></div>

        <div><div class="k">Projected gain</div><div class="v ${gain - hits >= 0 ? "up" : "down"}">${sign(Number((gain - hits).toFixed(1)))}</div></div>

      <div class="grid-2">
        <div class="panel"><div class="panel-head"><h3>Your squad after the plan</h3></div><div class="squad-list">${sqHTML}</div></div>

      <div class="panel" id="top10"><div class="panel-head"><h2>What the top 10 own</h2></div><p class="empty">Working out top-10 ownership and next-gameweek projections…</p></div>

    document.querySelectorAll("[data-undo]").forEach((b) => b.addEventListener("click", () => { const p = planState(); p.splice(Number(b.dataset.undo), 1); setPlan(p); renderPlanner(); }));
    $("#reset")?.addEventListener("click", () => { setPlan([]); selOut = null; renderPlanner(); });
    renderTop10(sq.map((x) => x.el));
    const q = $("#q"); if (q) q.addEventListener("input", debounce(() => { const pos = q.selectionStart; renderPlanner(); const nq = $("#q"); nq.focus(); nq.setSelectionRange(pos, pos); }, 250));
  }
  // Top-10 ownership of your (planned) squad, and the players they have that you don't, with next-gameweek projections.
  async function ensureFA(ids) {
    if (FA.odds === undefined) FA.odds = await (oddsCache ? Promise.resolve(oddsCache) : fetch("api/odds", { cache: "no-store" }).then((r) => (r.ok && (r.headers.get("content-type") || "").includes("json") ? r.json() : null)).catch(() => null));
    if (FA.odds) oddsCache = FA.odds;
    const need = [...new Set(ids)].filter((id) => !(id in FA.summ));
    if (D.source === "live" && need.length) await pool(need, 8, async (id) => { try { const j = await api(`element-summary/${id}/`); FA.summ[id] = j.history.map((h) => [h.round, h.minutes]); } catch (e) { FA.summ[id] = null; } });
  }
  async function renderTop10(squadIds) {
    const box = $("#top10"); if (!box) return;

    const N = top.length;
    const owners = {}; top.forEach((x) => squadOf(x.m).forEach((p) => (owners[p[0]] = owners[p[0]] || []).push(x)));
    const mine = new Set(squadIds);
    const missing = Object.keys(owners).map(Number).filter((id) => !mine.has(id) && E[id]);
    try { await ensureFA([...squadIds, ...missing]); } catch (e) { /* projections fall back to season minutes */ }
    if (!document.body.contains(box)) return; // the planner re-rendered meanwhile
    const TO = teamOdds();
    const nf = (e) => { const f = nextFx(e.team); return f && f.gw === gwNext ? f.list.map((x) => `<span class="fdrc fdr${x.fdr}">${esc(tShort(x.opp))} (${x.home ? "H" : "A"})</span>`).join("") : '<span class="fdrc fdr0">Blank</span>'; };
    const pNext = (e) => proj(e, 1, TO).total;
    const bar = (n) => `<span class="obar"><i style="width:${(n / N) * 100}%"></i></span>`;
    const mineRows = squadIds.map((id) => ({ e: E[id], n: (owners[id] || []).length })).sort((a, b) => b.n - a.n || a.e.element_type - b.e.element_type);
    const overlap = top.reduce((a, x) => a + squadOf(x.m).filter((p) => mine.has(p[0])).length, 0) / (N || 1);
    const templ = Object.keys(owners).map(Number).filter((id) => owners[id].length / N >= 0.5);
    const templMine = templ.filter((id) => mine.has(id)).length;
    const miss = missing.map((id) => ({ e: E[id], who: owners[id], n: owners[id].length, p: pNext(E[id]) })).sort((a, b) => b.n - a.n || b.p - a.p);
    const showAll = store.get("top10all", false);
    const shown = showAll ? miss : miss.filter((x) => x.n >= 2);
    const status = (e) => availability(e) < 1 ? ` <span class="pill sev${availability(e) === 0 ? 3 : 2}" title="${esc(e.news)}">${availability(e) === 0 ? "Out" : pct(availability(e))}</span>` : "";
    box.innerHTML = `
      <div class="panel-head"><h2>What the top 10 own</h2><span class="note">The ${N === 9 ? "other 9 managers in the top 10" : "top 10 managers"}: ${top.map((x) => esc(firstName(x))).join(", ")}</span></div>
      <div class="kpis">
        <div class="kpi"><span class="k">Shared with an average top-10 team</span><span class="v">${overlap.toFixed(1)}<small style="font-size:1rem;color:var(--muted)">/15</small></span><span class="s">Players in common</span></div>
        <div class="kpi"><span class="k">Top-10 template you own</span><span class="v">${templMine}<small style="font-size:1rem;color:var(--muted)">/${templ.length}</small></span><span class="s">Players in half or more of their squads</span></div>
        <div class="kpi"><span class="k">Players they have, you don't</span><span class="v">${miss.length}</span><span class="s">${miss.filter((x) => x.n >= 2).length} owned by 2 or more</span></div>
      </div>
      <div class="t10-grid">
        <div class="panel">
          <div class="panel-head"><h3>Your players: top-10 ownership</h3><span class="note">Squad after your planned transfers</span></div>
          <div class="tbl-wrap"><table class="cards-sm">
            <thead><tr><th>Player</th><th class="n">Top 10 own</th><th></th><th class="n">Proj GW${gwNext}</th></tr></thead>
            <tbody>${mineRows.map(({ e, n }) => `<tr><td><span class="mgr"><span>${esc(e.web_name)}${ycBadge(e)}${status(e)}</span><small>${POSN(e)} · ${tShort(e.team)}</small></span></td><td class="n"><strong>${pct(n / (N || 1))}</strong> <small style="color:var(--muted)">${n} of ${N}</small></td><td>${bar(n)}</td><td class="n">${pNext(e).toFixed(1)}</td></tr>`).join("")}</tbody>
          </table></div>
          <p class="note">High ownership means a safe pick against the top 10; low ownership is a differential that can win or lose you ground.</p>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Players they have that you don't</h3>
            <label class="controls"><input type="checkbox" id="t10all" ${showAll ? "checked" : ""}> <span class="note">Include players only 1 team owns</span></label></div>
          <div class="tbl-wrap"><table class="cards-sm">
            <thead><tr><th>Player</th><th class="n">Owned by</th><th>GW${gwNext}</th><th class="n">Proj GW${gwNext}</th><th class="n">FPL xP</th></tr></thead>
            <tbody>${shown.map((x) => `<tr><td><span class="mgr"><span>${esc(x.e.web_name)}${ycBadge(x.e)}${status(x.e)}</span><small>${POSN(x.e)} · ${tShort(x.e.team)} · £${price(x.e.now_cost)}m · ${x.who.map((w) => esc(firstName(w))).join(", ")}</small></span></td><td class="n"><strong>${x.n} of ${N}</strong> ${bar(x.n)}</td><td>${nf(x.e)}</td><td class="n"><strong>${x.p.toFixed(1)}</strong></td><td class="n">${x.e.ep_next}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">No player is in 2 or more top-10 squads without being in yours.</td></tr>`}</tbody>
          </table></div>
          <p class="note">Proj GW${gwNext} is this site's projection (form, bookmaker odds, minutes and injury news); FPL xP is FPL's own expected points for comparison.</p>
        </div>
      </div>`;
    $("#t10all").addEventListener("change", (ev) => { store.set("top10all", ev.target.checked); renderTop10(squadIds); });
  }

  function debounce(fn, ms) { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }
  function chipAdvice() {
    const doubles = [], blanks = [];
    for (let g = gwNext; g <= 38; g++) {
      const d = D.teams.filter((t) => (teamFx[t.id][g] || []).length > 1).length;
      const b = D.teams.filter((t) => !(teamFx[t.id][g] || []).length).length;
      if (d) doubles.push(`GW${g} (${d} teams)`); if (b) blanks.push(`GW${g} (${b} teams)`);
    }
    return (doubles.length ? `Double gameweeks scheduled: ${doubles.join(", ")}; save Bench Boost or Triple Captain for these. ` : "No double gameweeks have been scheduled yet. ") + (blanks.length ? `Blank gameweeks: ${blanks.join(", ")}; a Free Hit covers these.` : "");
  }

  // ---------- fixtures ----------
  // FDR over a window; a blank gameweek counts as the hardest rating (5) so it ranks low.
  function windowFdr(team, n) {
    const l = []; for (let g = gwNext; g < gwNext + n && g <= 38; g++) { const f = teamFx[team][g] || []; if (!f.length) l.push(5); else f.forEach((x) => l.push(x.fdr)); }
    return l.length ? l.reduce((a, b) => a + b, 0) / l.length : 3;
  }
  const fdrCells = (team, gws) => gws.map((g) => {
    const l = teamFx[team][g] || [];
    return `<td>${l.length ? l.map((f) => `<span class="fdrc fdr${f.fdr}" title="FDR ${f.fdr}">${esc(tShort(f.opp))} (${f.home ? "H" : "A"})</span>`).join("") : '<span class="fdrc fdr0">Blank</span>'}</td>`;
  }).join("");
  const avgBadge = (a) => `<span class="fdrc fdr${Math.min(5, Math.max(1, Math.round(a)))}" title="Average FDR">${a.toFixed(1)}</span>`;

  function renderFixtures() {
    let n = store.get("fxN", 5); if (n !== 3 && n !== 5) n = 5;
    const gws = []; for (let g = gwNext; g < gwNext + n && g <= 38; g++) gws.push(g);
    const mineTeams = {}; squadOf(myM).forEach((p) => { const t = E[p[0]]?.team; mineTeams[t] = (mineTeams[t] || 0) + 1; });
    const rows = D.teams.map((t) => ({ t, a: windowFdr(t.id, n) })).sort((x, y) => x.a - y.a || x.t.name.localeCompare(y.t.name));
    const squad = squadOf(myM).map((p) => ({ e: E[p[0]], slot: p[1] })).filter((x) => x.e)
      .sort((a, b) => a.e.element_type - b.e.element_type || windowFdr(a.e.team, n) - windowFdr(b.e.team, n));
    const head = `<th>GW${gws.join("</th><th>GW")}</th>`;
    $("#app").innerHTML = `
    <section class="view">
      <div class="panel-head"><h2>Fixture difficulty</h2>
        <div class="controls"><span class="note">Show</span><div class="seg" role="group" aria-label="Gameweeks to show">${[3, 5].map((v) => `<button data-fxn="${v}" aria-pressed="${v === n}">Next ${v} GWs</button>`).join("")}</div></div></div>
      <div class="fdr-legend"><span>FDR</span>${[1, 2, 3, 4, 5].map((v) => `<span class="fdrc fdr${v}">${v} ${["Very easy", "Easy", "Medium", "Hard", "Very hard"][v - 1]}</span>`).join("")}</div>
      <div class="panel">
        <div class="panel-head"><h3>Your players' next ${n} gameweeks</h3><span class="note">Grouped by position, easiest run first</span></div>
        <div class="tbl-wrap"><table class="fx-tbl">
          <thead><tr><th>Player</th><th>Team</th><th class="n">Avg FDR</th>${head}</tr></thead>
          <tbody>${squad.map(({ e, slot }) => `<tr><td><span class="mgr">${esc(e.web_name)}<small>${D.positions[e.element_type]}${slot > 11 ? " · bench" : ""}</small></span></td><td>${tShort(e.team)}</td><td class="n">${avgBadge(windowFdr(e.team, n))}</td>${fdrCells(e.team, gws)}</tr>`).join("")}</tbody>
        </table></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h3>All teams, best fixtures first</h3><span class="note">Highlighted rows are teams you own players from</span></div>
        <div class="tbl-wrap"><table class="fx-tbl">
          <thead><tr><th class="n">#</th><th>Team</th><th class="n">Avg FDR</th>${head}</tr></thead>
          <tbody>${rows.map(({ t, a }, i) => `<tr class="${mineTeams[t.id] ? "me" : ""}"><td class="n">${i + 1}</td><td>${esc(t.name)} ${mineTeams[t.id] ? `<span class="pill acc" title="Players you own">${mineTeams[t.id]}</span>` : ""}</td><td class="n">${avgBadge(a)}</td>${fdrCells(t.id, gws)}</tr>`).join("")}</tbody>
        </table></div>
        <p class="note">FDR is FPL's official fixture difficulty rating. A blank gameweek counts as 5 in the average; a double gameweek shows both games.</p>
      </div>
      ${freshness()}
    </section>`;
    document.querySelectorAll("[data-fxn]").forEach((b) => b.addEventListener("click", () => { store.set("fxN", Number(b.dataset.fxn)); renderFixtures(); }));
  }

  // ---------- bookmaker odds ----------
  // The Worker returns bookmaker 1X2 and over/under 2.5 probabilities (margin removed, averaged across UK bookmakers).
  // Clean sheet and to-score chances come from a Poisson goals model fitted to those prices.
  const ODDS_ALIASES = { ARS: ["arsenal"], AVL: ["aston villa"], BOU: ["bournemouth"], BRE: ["brentford"], BHA: ["brighton"], BUR: ["burnley"],
    CHE: ["chelsea"], COV: ["coventry"], CRY: ["crystal palace"], EVE: ["everton"], FUL: ["fulham"], HUL: ["hull"], IPS: ["ipswich"], LEE: ["leeds"],
    LEI: ["leicester"], LIV: ["liverpool"], MCI: ["manchester city", "man city"], MUN: ["manchester united", "man utd", "man united"], NEW: ["newcastle"],
    NFO: ["nottingham", "nott'm forest"], SOU: ["southampton"], SUN: ["sunderland"], TOT: ["tottenham", "spurs"], WHU: ["west ham"], WOL: ["wolverhampton", "wolves"] };
  function oddsTeamId(name) {
    const n = norm(name);
    const t = D.teams.find((t) => (ODDS_ALIASES[t.short] || []).some((a) => n.startsWith(a)))
      || D.teams.find((t) => n.includes(norm(t.name)) || norm(t.name).includes(n));
    return t ? t.id : null;
  }
  const PMF = (() => { const m = new Map(); return (l) => { const k = l.toFixed(3); if (!m.has(k)) { const a = [Math.exp(-l)]; for (let i = 1; i <= 10; i++) a.push(a[i - 1] * l / i); m.set(k, a); } return m.get(k); }; })();
  function scoreProbs(lh, la) {
    const a = PMF(lh), b = PMF(la); let H = 0, Dr = 0, A = 0, O = 0;
    for (let i = 0; i <= 10; i++) for (let j = 0; j <= 10; j++) { const p = a[i] * b[j]; if (i > j) H += p; else if (i < j) A += p; else Dr += p; if (i + j > 2) O += p; }
    return { H, D: Dr, A, O };
  }
  function fitGoals(pH, pD, pA, pO) {
    const err = (lh, la) => { const r = scoreProbs(lh, la); return (r.H - pH) ** 2 + (r.D - pD) ** 2 + (r.A - pA) ** 2 + (pO == null ? 0 : (r.O - pO) ** 2); };
    let best = [1.4, 1.1], be = Infinity;
    for (let lh = 0.1; lh <= 4; lh += 0.05) for (let la = 0.1; la <= 4; la += 0.05) { const e = err(lh, la); if (e < be) { be = e; best = [lh, la]; } }
    const [h0, a0] = best;
    for (let lh = Math.max(0.05, h0 - 0.05); lh <= h0 + 0.05; lh += 0.005) for (let la = Math.max(0.05, a0 - 0.05); la <= a0 + 0.05; la += 0.005) { const e = err(lh, la); if (e < be) { be = e; best = [lh, la]; } }
    return best;
  }

  let oddsCache = null;
  function renderOdds() {
    $("#app").innerHTML = `<section class="view"><div class="panel-head"><h2>GW${gwNext} bookmaker odds</h2></div><p class="empty">Loading bookmaker odds…</p></section>`;
    const load = oddsCache ? Promise.resolve(oddsCache) : fetch("api/odds", { cache: "no-store" }).then(async (r) => {
      const ct = r.headers.get("content-type") || "";
      if (!ct.includes("json")) throw new Error("offline");
      const j = await r.json(); if (!r.ok) throw Object.assign(new Error(j.error || "odds"), { info: j }); return j;
    });
    load.then((j) => { oddsCache = j; drawOdds(j); }).catch((e) => {
      const msg = e.message === "offline" ? "Bookmaker odds load on the live site, fc27-planner.fc27-fpl.workers.dev."
        : e.message === "not_configured" ? "Bookmaker odds aren't switched on yet: the site needs an odds API key."
        : `Couldn't load bookmaker odds (${esc(e.info?.detail || e.message)}). Try again later.`;
      $("#app").innerHTML = `<section class="view"><div class="panel-head"><h2>GW${gwNext} bookmaker odds</h2></div><div class="err">${msg}</div></section>`;
    });
  }
  function drawOdds(j) {
    const fx = D.fixtures.filter((f) => f[1] === gwNext).sort((a, b) => String(a[6]).localeCompare(String(b[6])));
    const ev = j.events.map((e) => ({ ...e, h: oddsTeamId(e.home), a: oddsTeamId(e.away) }));
    const mineTeams = {}; squadOf(myM).forEach((p) => { const t = E[p[0]]?.team; mineTeams[t] = (mineTeams[t] || 0) + 1; });
    const rows = fx.map((f) => {
      const o = ev.find((e) => e.h === f[2] && e.a === f[3]);
      if (!o) return { f, o: null };
      const [pH, pD, pA] = o.h2h; const [lh, la] = fitGoals(pH, pD, pA, o.over25);
      return { f, o, pH, pD, pA, csH: Math.exp(-la), csA: Math.exp(-lh), scH: 1 - Math.exp(-lh), scA: 1 - Math.exp(-la), lh, la };
    });
    const got = rows.filter((r) => r.o);
    const op = (p, cls = "") => `<td class="op ${cls}" style="--p:${p.toFixed(3)}">${Math.round(p * 100)}%</td>`;
    const tm = (id) => `${esc(T[id]?.name)}${mineTeams[id] ? ` <span class="pill acc" title="Players you own">${mineTeams[id]}</span>` : ""}`;
    const ko = (t) => t ? new Date(t).toLocaleString("en-GB", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "TBC";
    const top = (key, side) => got.map((r) => ({ r, p: r[key + side], team: side === "H" ? r.f[2] : r.f[3] })).sort((a, b) => b.p - a.p)[0];
    const bestOf = (key) => [top(key, "H"), top(key, "A")].filter(Boolean).sort((a, b) => b.p - a.p)[0];
    const bcs = bestOf("cs"), bsc = bestOf("sc");
    const fav = got.map((r) => (r.pH >= r.pA ? { p: r.pH, team: r.f[2] } : { p: r.pA, team: r.f[3] })).sort((a, b) => b.p - a.p)[0];
    const uk = (t) => new Date(t).toLocaleString("en-GB", { timeZone: "Europe/London", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
    const nextTxt = j.nextRefresh ? `Next refresh ${uk(j.nextRefresh.at)}, ${j.nextRefresh.days} day${j.nextRefresh.days > 1 ? "s" : ""} before the GW${j.gw} deadline.` : j.gw ? `No more refreshes before the GW${j.gw} deadline.` : "";
    $("#app").innerHTML = `
    <section class="view">
      <div class="panel-head"><h2>GW${gwNext} bookmaker odds</h2><span class="note">Chances implied by UK bookmaker prices, bookmaker margin removed</span></div>
      <div class="odds-stamp"><span><span class="k">Odds last refreshed</span> <strong>${uk(j.fetched)}</strong> <span class="note">UK time</span></span>${nextTxt ? `<span class="note">${nextTxt}</span>` : ""}${j.stale ? `<span class="note down">The last refresh attempt failed, so these are the most recent odds available.</span>` : ""}</div>
      ${got.length ? `<div class="kpis">
        <div class="kpi"><span class="k">Biggest favourite</span><span class="v">${Math.round(fav.p * 100)}%</span><span class="s">${esc(T[fav.team]?.name)} to win</span></div>
        <div class="kpi"><span class="k">Best clean sheet chance</span><span class="v">${Math.round(bcs.p * 100)}%</span><span class="s">${esc(T[bcs.team]?.name)}</span></div>
        <div class="kpi"><span class="k">Most likely to score</span><span class="v">${Math.round(bsc.p * 100)}%</span><span class="s">${esc(T[bsc.team]?.name)}</span></div>
      </div>` : ""}
      <div class="tbl-wrap"><table class="odds-tbl cards-sm">
        <thead>
          <tr><th rowspan="2">Match</th><th class="grp" colspan="3">Result</th><th class="grp" colspan="2">Clean sheet</th><th class="grp" colspan="2">To score</th></tr>
          <tr><th class="n bl">Home win</th><th class="n">Draw</th><th class="n">Away win</th><th class="n bl">Home</th><th class="n">Away</th><th class="n bl">Home</th><th class="n">Away</th></tr>
        </thead>
        <tbody>${rows.map((r) => `<tr><td><span class="match"><span>${tm(r.f[2])} v ${tm(r.f[3])}</span><small>${ko(r.f[6])}</small></span></td>${r.o
          ? `${op(r.pH, "bl")}${op(r.pD)}${op(r.pA)}${op(r.csH, "bl")}${op(r.csA)}${op(r.scH, "bl")}${op(r.scA)}`
          : `<td class="bl" colspan="7"><span class="note">${j.nextRefresh ? `Odds arrive at the next refresh, ${uk(j.nextRefresh.at)}` : "No odds published yet"}</span></td>`}</tr>`).join("")}</tbody>
      </table></div>
      <p class="note">Result chances come straight from bookmaker prices (average of ${got.length ? Math.round(got.reduce((a, r) => a + r.o.books, 0) / got.length) : 0} UK bookmakers per match). Clean sheet and to-score chances are worked out from the same prices plus the over/under 2.5 goals line, using a standard goals model. Numbered badges mark teams you own players from. Odds refresh 3 days and 1 day before each gameweek deadline.</p>
    </section>`;
  }
})();
</script>
