<title>FC27 Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky scoreboard bar, then tabbed views (Overview / League / Planner / Fixtures) in one 1180px column. */
:root {
  --bg: #f3f6f2;
  --surface: #ffffff;
  --surface-2: #e8eee7;
  --line: #d3ddd2;
  --ink: #15211a;
  --muted: #5d6c62;
  --accent: #1d7a4b;
  --accent-ink: #ffffff;
  --rival: #0f9cb3;
  --s-me: #1d7a4b;
  --s-them: #0f9cb3;
  --card-yellow: #f2c200;
  --c-bank: #1d7a4b;
  --c-solid: #2f6fd0;
  --c-punt: #c47f0e;
  --card-yellow-ink: #1b1200;
  --good: #1d7a4b;
  --bad: #b8382f;
  --warn: #b7831a;
  --pitch-a: #2f7d4f;
  --pitch-b: #2a7349;
  --pitch-line: rgba(255,255,255,.35);
  --card-on-pitch: #ffffff;
  --card-on-pitch-ink: #15211a;
  --fdr1: #1f8a52; --fdr1-ink: #ffffff;
  --fdr2: #7cc69a; --fdr2-ink: #0f2a1b;
  --fdr3: #dfe4dd; --fdr3-ink: #2a332d;
  --fdr4: #e98a78; --fdr4-ink: #3b0f09;
  --fdr5: #a8261d; --fdr5-ink: #ffffff;
  --chart-other: #b8c5b9;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #161f1a; --surface-2: #1d2922; --line: #2a3830; --ink: #e6eee8; --muted: #93a499;
    --accent: #45c283; --accent-ink: #07140d; --rival: #2a97c0; --s-me: #3aa860; --s-them: #2a97c0; --c-bank: #3aa860; --c-solid: #5b8ff0; --c-punt: #c0841a; --good: #45c283; --bad: #f0786d; --warn: #e3b55a;
    --pitch-a: #1d4f33; --pitch-b: #1a482e; --pitch-line: rgba(255,255,255,.18); --card-on-pitch: #0f1813; --card-on-pitch-ink: #e6eee8;
    --fdr1: #2c9d61; --fdr1-ink: #ffffff; --fdr2: #2d6a46; --fdr2-ink: #dff3e7; --fdr3: #34403a; --fdr3-ink: #d4ddd7;
    --fdr4: #8a3c30; --fdr4-ink: #ffe3dd; --fdr5: #6e1913; --fdr5-ink: #ffd9d4; --chart-other: #3a4a40;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #161f1a; --surface-2: #1d2922; --line: #2a3830; --ink: #e6eee8; --muted: #93a499;
  --accent: #45c283; --accent-ink: #07140d; --rival: #2a97c0; --s-me: #3aa860; --s-them: #2a97c0; --c-bank: #3aa860; --c-solid: #5b8ff0; --c-punt: #c0841a; --good: #45c283; --bad: #f0786d; --warn: #e3b55a;
  --pitch-a: #1d4f33; --pitch-b: #1a482e; --pitch-line: rgba(255,255,255,.18); --card-on-pitch: #0f1813; --card-on-pitch-ink: #e6eee8;
  --fdr1: #2c9d61; --fdr1-ink: #ffffff; --fdr2: #2d6a46; --fdr2-ink: #dff3e7; --fdr3: #34403a; --fdr3-ink: #d4ddd7;
  --fdr4: #8a3c30; --fdr4-ink: #ffe3dd; --fdr5: #6e1913; --fdr5-ink: #ffd9d4; --chart-other: #3a4a40;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.15rem; font-weight: 600; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Scoreboard bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-size: 1.7rem; }
.brand .who { color: var(--muted); font-size: .85rem; }
.deadline { margin-left: auto; display: flex; align-items: baseline; gap: 8px; }
.deadline .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.deadline .cd { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs a { text-decoration: none; color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
main { padding-block: 20px 48px; display: grid; gap: 28px; }
section.view { display: grid; gap: 28px; }
.fresh { font-size: .78rem; color: var(--muted); }

/* KPI strip */
.kpis { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.kpi { flex: 1 1 150px; background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.kpi .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kpi .v { font-family: var(--font-display); font-size: 2rem; font-weight: 700; line-height: 1.05; }
.kpi .s { font-size: .8rem; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--bad); }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.note { font-size: .8rem; color: var(--muted); margin: 0; }

/* Pitch */
.pitch { border-radius: var(--r); padding: 14px 8px; display: grid; gap: 14px;
  background: repeating-linear-gradient(180deg, var(--pitch-a) 0 44px, var(--pitch-b) 44px 88px);
  position: relative; overflow: hidden; }
.pitch::before { content: ""; position: absolute; inset: 10px; border: 1.5px solid var(--pitch-line); border-radius: 4px; pointer-events: none; }
.pitch::after { content: ""; position: absolute; left: 50%; top: 10px; width: 120px; height: 46px; transform: translateX(-50%); border: 1.5px solid var(--pitch-line); border-top: 0; pointer-events: none; }
.row { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; position: relative; z-index: 1; }
.bench { background: var(--surface-2); border-radius: var(--r); padding: 10px 8px; }
.bench .row { justify-content: center; }
.bench-lbl { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: center; margin-bottom: 6px; }
.pc { width: 92px; text-align: center; display: grid; justify-items: center; gap: 0; position: relative; }
.pc .kit { position: relative; display: block; width: 56px; height: 56px; margin-bottom: -6px; z-index: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.pc .kit img { width: 56px; height: 56px; display: block; object-fit: contain; }
.pc .kit.nokit::before { content: ""; position: absolute; inset: 6px 4px 2px; background: var(--card-on-pitch); clip-path: polygon(30% 0, 70% 0, 100% 18%, 88% 40%, 80% 34%, 80% 100%, 20% 100%, 20% 34%, 12% 40%, 0 18%); opacity: .9; }
.pc .kit .badge { top: -2px; right: -10px; z-index: 2; }
.pc .kit .flag { top: -2px; left: -10px; z-index: 2; }
.pc .plate { width: 100%; background: var(--card-on-pitch); color: var(--card-on-pitch-ink); border-radius: 7px; padding: 8px 4px 5px; display: grid; gap: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.pc .nm { font-weight: 600; font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc .meta { font-size: .68rem; color: var(--muted); }
.pc .pts { font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; line-height: 1; }
.pc .fx { font-size: .66rem; border-radius: 4px; padding: 1px 3px; font-weight: 600; }
.badge { position: absolute; top: -6px; right: -4px; width: 20px; height: 20px; border-radius: 50%; font-size: .68rem; font-weight: 700; display: grid; place-items: center; background: var(--ink); color: var(--bg); }
.badge.vc { background: var(--muted); }
.flag { position: absolute; top: -6px; left: -4px; width: 18px; height: 18px; border-radius: 50%; font-size: .7rem; font-weight: 700; display: grid; place-items: center; background: var(--warn); color: #1b1200; }
.flag.out { background: var(--bad); color: #fff; }
.pc .meta { white-space: nowrap; }
@media (max-width: 480px) {
  .pitch { padding: 12px 2px; } .bench { padding: 10px 2px; }
  .pitch .row, .bench .row { gap: 3px; flex-wrap: nowrap; }
  .pc { width: 20%; max-width: 64px; min-width: 0; } .pc .nm { font-size: .66rem; max-width: 100%; } .pc .pts { font-size: 1.05rem; }
  .pc .fx { font-size: .6rem; padding: 1px 2px; } .pc .meta { font-size: .58rem; }
  .pc .kit, .pc .kit img { width: 40px; height: 40px; }
  .pc .plate { min-width: 0; overflow: hidden; }
  .pc .plate { padding: 7px 2px 4px; }
}

.fdr1 { background: var(--fdr1); color: var(--fdr1-ink); } .fdr2 { background: var(--fdr2); color: var(--fdr2-ink); }
.fdr3 { background: var(--fdr3); color: var(--fdr3-ink); } .fdr4 { background: var(--fdr4); color: var(--fdr4-ink); }
.fdr5 { background: var(--fdr5); color: var(--fdr5-ink); } .fdr0 { background: transparent; color: var(--muted); }

/* Insights */
.insights { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.insights li { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 12px; align-items: stretch; }
.insights li::before { content: ""; border-radius: 4px; background: var(--line); }
.insights li.warn::before { background: var(--warn); } .insights li.bad::before { background: var(--bad); } .insights li.good::before { background: var(--good); } .insights li.info::before { background: var(--rival); }
.insights .t { font-weight: 600; }
.insights .d { color: var(--muted); font-size: .86rem; }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .86rem; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
td.n, th.n { text-align: right; }
tr:last-child td { border-bottom: 0; }
tr.me td { background: color-mix(in srgb, var(--accent) 12%, transparent); font-weight: 600; }
tr.rv td { background: color-mix(in srgb, var(--rival) 12%, transparent); }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: var(--surface-2); }
.mgr { display: grid; line-height: 1.25; }
.mgr small { color: var(--muted); font-weight: 400; }
.chips { display: flex; gap: 3px; }
.chip { font-size: .64rem; font-weight: 700; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.used { text-decoration: line-through; opacity: .55; }
.pill { display: inline-block; font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.pill.acc { background: var(--accent); color: var(--accent-ink); }
.strip { display: inline-flex; gap: 2px; vertical-align: middle; }
.strip span { min-width: 34px; text-align: center; font-size: .68rem; font-weight: 600; border-radius: 3px; padding: 2px 2px; }

/* Chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .other { stroke: var(--chart-other); stroke-width: 1.2; fill: none; }
.chart .mine { stroke: var(--s-me); stroke-width: 3; fill: none; }
.chart .riv { stroke: var(--s-them); stroke-width: 2.5; fill: none; }
.chart .lbl-me { fill: var(--ink); font-weight: 700; font-size: 12px; font-family: var(--font-body); }
.chart .lbl-rv { fill: var(--ink); font-weight: 700; font-size: 12px; font-family: var(--font-body); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

/* Compare */
.cmp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .cmp { grid-template-columns: minmax(0, 1fr); } }
.cmp h3 { font-size: 1rem; margin-bottom: 6px; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: .85rem; }
.plist li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding-bottom: 3px; }
.plist li span:last-child { color: var(--muted); }

/* Mini League analysis */
.picks5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.pick { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; }
.pick:hover { border-color: var(--muted); }
.pick[aria-pressed="true"] { border-color: var(--s-them); box-shadow: inset 0 0 0 1px var(--s-them); }
.pick .role { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.pick .role i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.pick[aria-pressed="true"] .role i { background: var(--s-them); }
.pick .nm { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; line-height: 1.1; }
.pick .tm { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick .row2 { display: flex; justify-content: space-between; gap: 8px; font-size: .82rem; }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; text-align: center; }
.vs .side { display: grid; gap: 2px; }
.vs .side .who { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: center; align-items: center; gap: 6px; }
.vs .side .who i { width: 10px; height: 10px; border-radius: 50%; }
.vs .big { font-family: var(--font-display); font-size: 2.6rem; font-weight: 700; line-height: 1; }
.vs .mid { font-size: .8rem; color: var(--muted); }
.h2h td:nth-child(1) { color: var(--muted); }
.h2h td:nth-child(2), .h2h td:nth-child(3) { font-weight: 600; }
.chipgrid td .st { font-weight: 600; }
.chipgrid td .st.avail { color: var(--good); }
.chipgrid td .st.exp { color: var(--bad); }
.chipgrid td .st.used { color: var(--muted); }
.chipgrid tr.half td { background: var(--surface-2); font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.chart { position: relative; }
.chart .bar-me { fill: var(--s-me); } .chart .bar-them { fill: var(--s-them); }
.chart .hit { fill: transparent; cursor: crosshair; }
.chart .hit:hover, .chart .hit.on { fill: var(--ink); fill-opacity: .05; }
.chart .dgood { fill: var(--good); font-size: 10.5px; font-weight: 700; font-family: var(--font-body); }
.chart .dbad { fill: var(--bad); font-size: 10.5px; font-weight: 700; font-family: var(--font-body); }
.chart .dzero { fill: var(--muted); font-size: 10.5px; font-family: var(--font-body); }
.chart .xh { stroke: var(--muted); stroke-width: 1; }
.chart .dot-me { fill: var(--s-me); stroke: var(--surface); stroke-width: 2; }
.chart .dot-them { fill: var(--s-them); stroke: var(--surface); stroke-width: 2; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: .8rem; line-height: 1.4; min-width: 150px; z-index: 3; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
.tip b { font-family: var(--font-display); font-size: .95rem; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.tip .r { display: flex; justify-content: space-between; gap: 12px; }
td .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.gw-tbl td.n small { color: var(--muted); font-weight: 400; margin-left: 4px; }
/* Future analysis */
#future h3 { margin-top: 4px; }
.stack { display: grid; gap: 24px; }
.lede { margin: 0; font-size: .98rem; line-height: 1.6; max-width: 80ch; }
.prio { list-style: none; counter-reset: pr; margin: 0; padding: 0; display: grid; gap: 10px; }
.prio li { counter-increment: pr; display: grid; grid-template-columns: 30px 128px minmax(0, 1fr); gap: 10px; align-items: start; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.prio li::before { content: counter(pr); font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; line-height: 1; color: var(--muted); }
.prio li > .pill { justify-self: start; margin-top: 2px; }
.prio .t { font-weight: 600; }
.prio .d { color: var(--muted); font-size: .86rem; margin-top: 2px; }
.prio .d strong { color: var(--ink); }
@media (max-width: 640px) { .prio li { grid-template-columns: 26px minmax(0, 1fr); } .prio li > div { grid-column: 2; } }
.pill.sev3 { background: var(--bad); color: #fff; } .pill.sev2 { background: var(--warn); color: #1b1200; } .pill.sev1 { background: var(--surface-2); color: var(--ink); } .pill.ok { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
td.why { white-space: normal; min-width: 220px; font-size: .8rem; color: var(--muted); }
.fx-tbl tr.half td { background: var(--surface-2); font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.yc { display: inline-flex; align-items: center; justify-content: center; min-width: 15px; height: 19px; padding: 0 3px; margin-left: 6px; border-radius: 3px; font-size: .68rem; font-weight: 800; vertical-align: 1px; border: 1.5px solid var(--card-yellow); color: var(--ink); }
.yc.hot { background: var(--card-yellow); color: var(--card-yellow-ink); box-shadow: 0 0 0 2px color-mix(in srgb, var(--card-yellow) 35%, transparent); }
.ban-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 14px; border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--card-yellow) 60%, var(--line)); background: color-mix(in srgb, var(--card-yellow) 10%, var(--surface)); font-size: .86rem; }
.ban-strip.ret { border-color: color-mix(in srgb, var(--rival) 55%, var(--line)); background: color-mix(in srgb, var(--rival) 8%, var(--surface)); }
.ban-strip.ok { border-color: var(--line); background: var(--surface); color: var(--muted); }
.ban-strip .k { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.ban-item { display: inline-flex; align-items: center; gap: 6px; }
.ban-item .yc { margin-left: 0; }
.t10-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.sq-sum { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: .9rem; }
.sq-sum .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-right: 4px; }
.squad-tbl tr.click:focus-visible td { outline: 2px solid var(--accent); outline-offset: -2px; }

  // ---------- phone cards: copy column headers onto each cell ----------
  function labelTable(t) {
    if (!t.tHead || !t.tBodies[0]) return;
    const grid = [];
    [...t.tHead.rows].forEach((tr, r) => {
      grid[r] = grid[r] || []; let c = 0;
      [...tr.cells].forEach((th) => { while (grid[r][c]) c++; for (let i = 0; i < (th.rowSpan || 1); i++) for (let j = 0; j < (th.colSpan || 1); j++) (grid[r + i] = grid[r + i] || [])[c + j] = th; c += th.colSpan || 1; });
    });
    const n = Math.max(0, ...grid.map((g) => g.length)), labels = [];
    for (let c = 0; c < n; c++) { const parts = []; grid.forEach((g) => { const x = g[c] && g[c].textContent.trim(); if (x && !parts.includes(x)) parts.push(x); }); labels[c] = parts.join(" · "); }
    const titleCol = labels.findIndex((l) => l && l !== "#");
    [...t.tBodies[0].rows].forEach((tr) => { let c = 0; [...tr.cells].forEach((td) => { const span = td.colSpan || 1; if (span === 1) { td.dataset.label = labels[c] || ""; if (c === titleCol) td.classList.add("title"); } else td.classList.add("span"); c += span; }); });
  }

  // ---------- loading: live through the site's /api/ proxy, else the saved snapshot ----------
  const ENTRY_ID = 1965328, LEAGUE_ID = 111899;
  const EL_FIELDS = ["id", "web_name", "first_name", "second_name", "team", "element_type", "now_cost",
    "total_points", "event_points", "form", "points_per_game", "ep_next", "ep_this",
    "selected_by_percent", "minutes", "starts", "goals_scored", "assists", "clean_sheets",
    "expected_goals", "expected_assists", "expected_goal_involvements",
    "expected_goal_involvements_per_90", "expected_goals_conceded_per_90",
    "defensive_contribution_per_90", "bonus", "status", "news", "chance_of_playing_next_round",
    "cost_change_event", "cost_change_start", "transfers_in_event", "transfers_out_event", "penalties_order",
    "yellow_cards", "red_cards", "news_added", "chance_of_playing_this_round",
    "expected_goals_per_90", "expected_assists_per_90", "saves_per_90", "defensive_contribution",
    "price_change_percent", "price_change_projections", "price_change_locked_until", "price_change_calibrating",
    "expected_goals_conceded", "goals_conceded", "bps",
    "corners_and_indirect_freekicks_order", "direct_freekicks_order", "penalties_text"];
  const setStatus = (t) => { const a = $("#app"); if (a && !D) a.innerHTML = `<p class="empty">${esc(t)}</p>`; };

  async function api(path) {
    const r = await fetch("api/" + path, { cache: "no-store" });
    if (r.status === 404 && path === "bootstrap-static/") throw new Error("no live API on this host");
    if (!r.ok) throw new Error(`FPL request ${path} returned ${r.status}`);
    const ct = r.headers.get("content-type") || "";
    if (!ct.includes("json")) throw new Error("no live API on this host");
    return r.json();
  }
  async function pool(items, n, fn) {
    const out = new Array(items.length); let i = 0;
    await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); } }));
    return out;
  }
  async function loadLive() {
    setStatus("Fetching live data from FPL…");
    const [boot, fixtures, entry, transfers] = await Promise.all([api("bootstrap-static/"), api("fixtures/"), api(`entry/${ENTRY_ID}/`), api(`entry/${ENTRY_ID}/transfers/`).catch(() => [])]);
    const events = boot.events, current = events.find((e) => e.is_current), nxt = events.find((e) => e.is_next);
    const curGw = current ? current.id : 0;
    let standings = [], league = null;
    for (let page = 1; page <= 5; page++) {
      const lg = await api(`leagues-classic/${LEAGUE_ID}/standings/?page_standings=${page}`);
      league = lg.league; standings = standings.concat(lg.standings.results);
      if (!lg.standings.has_next) break;
    }
    const ids = standings.map((r) => r.entry); if (!ids.includes(ENTRY_ID)) ids.push(ENTRY_ID);
    let done = 0;
    const managers = {};
    await pool(ids, 8, async (eid) => {
      try {
        const [h, p, en] = await Promise.all([api(`entry/${eid}/history/`), curGw ? api(`entry/${eid}/event/${curGw}/picks/`).catch(() => null) : null, api(`entry/${eid}/`).catch(() => null)]);
        managers[eid] = {
          history: h.current.map((c) => [c.event, c.points, c.total_points, c.event_transfers, c.event_transfers_cost, c.points_on_bench, c.overall_rank, c.value, c.bank]),
          chips: h.chips.map((c) => [c.name, c.event]),
          orank: en ? en.summary_overall_rank : null,
          picks: p ? { chip: p.active_chip, picks: p.picks.map((x) => [x.element, x.position, x.multiplier, +x.is_captain, +x.is_vice_captain]), bank: p.entry_history.bank, value: p.entry_history.value } : null,
        };
      } catch (e) { if (eid === ENTRY_ID) throw e; }
      setStatus(`Fetching live data from FPL… ${++done} of ${ids.length} managers`);
    });
    return {
      generated_at: new Date().toISOString(), source: "live", me: ENTRY_ID, entry,
      league: { id: league.id, name: league.name },
      standings: standings.map((r) => ({ entry: r.entry, entry_name: r.entry_name, player_name: r.player_name, rank: r.rank, last_rank: r.last_rank, total: r.total, event_total: r.event_total })),
      managers, transfers: transfers.map((t) => [t.event, t.element_in, t.element_in_cost, t.element_out, t.element_out_cost]),
      price_deadlines: boot.game_config?.settings?.price_change_deadlines || [],
      events: events.map((e) => ({ id: e.id, deadline: e.deadline_time, finished: e.finished, is_current: e.is_current, is_next: e.is_next, avg: e.average_entry_score, high: e.highest_score, data_checked: e.data_checked, most_captained: e.most_captained, top_element: e.top_element, top_points: e.top_element_info ? e.top_element_info.points : null })),
      current_gw: curGw, next_gw: nxt ? nxt.id : null,
      chips_def: boot.chips.map((c) => [c.name, c.start_event, c.stop_event]),
      teams: boot.teams.map((t) => ({ id: t.id, name: t.name, short: t.short_name, strength: t.strength, code: t.code })),
      positions: Object.fromEntries(boot.element_types.map((t) => [String(t.id), t.singular_name_short])),
      elements: boot.elements.filter((e) => !e.removed).map((e) => EL_FIELDS.map((f) => e[f] ?? null)),
      element_fields: EL_FIELDS,
      fixtures: fixtures.map((f) => [f.id, f.event, f.team_h, f.team_a, f.team_h_difficulty, f.team_a_difficulty, f.kickoff_time, +!!f.finished, +!!f.started, f.team_h_score, f.team_a_score]),
    };
  }
  async function loadSnapshot(liveErr) {
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error(liveErr ? liveErr.message : "data.json returned " + r.status);
    const d = await r.json(); d.source = "snapshot"; d.liveError = liveErr && !/no live API/.test(liveErr.message) ? liveErr.message : null;
    return d;
  }
  loadLive()
    .catch((e) => loadSnapshot(e))
    .then((d) => { D = d; prepare(); route(); window.addEventListener("hashchange", route); tick(); setInterval(tick, 1000); })
    .catch((e) => { $("#app").innerHTML = `<div class="err"><strong>Couldn't load the FPL data.</strong><br>${esc(e.message)}. FPL may be updating (this happens between gameweeks); try reloading in a few minutes.</div>`; });

  // ---------- data prep ----------
  function prepare() {
    const F = D.element_fields;
    E = {};
    D.elements.forEach((row) => { const o = {}; F.forEach((f, i) => (o[f] = row[i])); E[o.id] = o; });
    T = {}; D.teams.forEach((t) => (T[t.id] = t));
    me = D.me; myM = D.managers[me];
    gwCur = D.current_gw; gwNext = D.next_gw || gwCur;
    members = D.standings.map((s) => ({ ...s, m: D.managers[s.entry] })).filter((x) => x.m);

    // FPL's per-gameweek history isn't updated until a gameweek is fully processed, so overlay the
    // live figures (league standings totals and each manager's live overall rank) on the current gameweek.
    members.forEach((x) => {
      const h = x.m.history, last = h[h.length - 1];
      if (!last || last[0] !== gwCur) return;
      const prev = h.length > 1 ? h[h.length - 2][2] : 0;
      last[2] = x.total; last[1] = x.total - prev + last[4];
      if (x.m.orank) last[6] = x.m.orank;
    });
    if (D.entry.summary_overall_rank && myM.history.length && lastHist(myM)[0] === gwCur) lastHist(myM)[6] = D.entry.summary_overall_rank;

    // league ownership, effective ownership and captaincy (current GW picks)
    own = {}; eo = {}; capCount = {};
    const withPicks = members.filter((x) => x.m.picks);
    withPicks.forEach((x) => x.m.picks.picks.forEach(([el, , mult, cap]) => {
      own[el] = (own[el] || 0) + 1; eo[el] = (eo[el] || 0) + mult; if (cap) capCount[el] = (capCount[el] || 0) + 1;
    }));
    const n = withPicks.length || 1;
    Object.keys(own).forEach((k) => { own[k] = own[k] / n; eo[k] = eo[k] / n; });
    D._n = n;

    // fixtures by team and GW
    teamFx = {};
    D.teams.forEach((t) => (teamFx[t.id] = {}));
    D.fixtures.forEach(([id, ev, h, a, hd, ad, ko, fin, st, hs, as]) => {
      if (!ev) return;
      (teamFx[h][ev] ||= []).push({ opp: a, home: true, fdr: hd, fin, hs, as });
      (teamFx[a][ev] ||= []).push({ opp: h, home: false, fdr: ad, fin, hs: as, as: hs });
    });
    $("#teamName").textContent = D.entry.name;
    $("#who").textContent = `${D.entry.player_first_name} ${D.entry.player_last_name} · ${D.league.name}`;
  }

  const squadOf = (m) => (m && m.picks ? m.picks.picks : []);
  const pos = (el) => D.positions[String(E[el]?.element_type)] || "";
  const tShort = (id) => T[id]?.short || "?";
  function fxLabel(f) { const s = tShort(f.opp); return f.home ? s.toUpperCase() + " (H)" : s.toUpperCase() + " (A)"; }
  function nextFx(teamId, from = gwNext) {
    for (let g = from; g <= 38; g++) { const l = teamFx[teamId][g]; if (l && l.length) return { gw: g, list: l }; }
    return null;
  }
  function fxStrip(teamId, from, n) {
    let h = '<span class="strip">';
    for (let g = from; g < from + n && g <= 38; g++) {
      const l = teamFx[teamId][g] || [];
      if (!l.length) h += `<span class="fdr0" title="GW${g}: no fixture">—</span>`;
      else l.forEach((f) => (h += `<span class="fdr${f.fdr}" title="GW${g}">${esc(f.home ? tShort(f.opp) : tShort(f.opp).toLowerCase())}</span>`));
    }
    return h + "</span>";
  }
  function availability(p) {
    if (p.chance_of_playing_next_round == null) return p.status === "a" ? 1 : p.status === "d" ? 0.75 : p.status === "i" || p.status === "s" || p.status === "u" ? 0 : 1;
    return p.chance_of_playing_next_round / 100;
  }
  // Planner projection: blended form/points-per-game, scaled by fixture difficulty per fixture, over `h` gameweeks.
  function project(p, h) {
    const rate = (parseFloat(p.form) + parseFloat(p.points_per_game)) / 2 || 0;
    const a = availability(p);
    let tot = 0;
    for (let g = gwNext, i = 0; i < h && g <= 38; g++, i++) {
      const l = teamFx[p.team][g] || [];
      const av = i < 2 ? a : Math.max(a, 0.85);
      l.forEach((f) => (tot += rate * FDR_MULT[f.fdr] * av));
    }
    return tot;
  }
  function chipsLeft(m) {
    const used = m.chips;
    const g = gwNext;
    return D.chips_def
      .filter(([, s, e]) => g >= s && g <= e)
      .map(([name, s, e]) => ({ name, used: used.some(([u, ev]) => u === name && ev >= s && ev <= e) }));
  }
  // Free transfers for the next deadline, rebuilt from transfer history: +1 a week, capped at 5;
  // a Wildcard or Free Hit week keeps the saved transfers but adds none. (FPL only publishes the real number when logged in.)
  function freeTransfers(m, startEv) {
    let ft = 1;
    const chipAt = {}; m.chips.forEach(([n, ev]) => (chipAt[ev] = n));
    m.history.forEach(([ev, , , tr]) => {
      if (ev <= startEv) { ft = 1; return; }
      if (chipAt[ev] === "wildcard" || chipAt[ev] === "freehit") ft = Math.min(5, ft); // saved transfers kept, none added
      else ft = Math.min(5, Math.max(0, ft - tr) + 1);

  const squadValue = (m) => squadOf(m).reduce((a, p) => a + (E[p[0]]?.now_cost || 0), 0); // current prices, as FPL shows squad value
  const bankOf = (m) => m.picks?.bank ?? lastHist(m)[8];
  const seasonSum = (m, idx) => m.history.reduce((a, r) => a + r[idx], 0);

  // ---------- routing ----------
  function route() {
    const v = (location.hash || "#overview").slice(1);
    view = ["overview", "analysis", "league", "planner", "insights", "fixtures", "odds"].includes(v) ? v : "overview";
    document.querySelectorAll(".tabs a").forEach((a) => { if (a.dataset.v === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    ({ overview: renderOverview, analysis: renderAnalysis, league: renderLeague, planner: renderPlanner, insights: renderInsights, fixtures: renderFixtures, odds: renderOdds })[view]();
  }

  function tick() {
    const ev = D.events.find((e) => e.id === gwNext);
    if (!ev) return;
    const ms = new Date(ev.deadline) - Date.now();
    $("#dlLbl").textContent = `GW${ev.id} deadline`;
    if (ms <= 0) { $("#countdown").textContent = "passed"; return; }
    const d = Math.floor(ms / 864e5), h = Math.floor((ms % 864e5) / 36e5), mi = Math.floor((ms % 36e5) / 6e4);
    $("#countdown").textContent = d > 0 ? `${d}d ${h}h ${mi}m` : `${h}h ${mi}m ${Math.floor((ms % 6e4) / 1000)}s`;
  }
  function freshness() {
    const mins = Math.round((Date.now() - new Date(D.generated_at)) / 6e4);
    const when = mins < 1 ? "just now" : mins < 60 ? `${mins} min ago` : mins < 1440 ? `${Math.round(mins / 60)} h ago` : new Date(D.generated_at).toLocaleString("en-GB");
    const gwState = `GW${gwCur} ${D.events.find((e) => e.id === gwCur)?.finished ? "finished" : "in progress"}.`;
    if (D.source === "live") return `<p class="fresh">Live from the official FPL API, loaded at ${new Date(D.generated_at).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}. Reload the page for the latest. ${gwState}</p>`;
    return `<p class="fresh">Saved snapshot from the official FPL API, taken ${when}${D.liveError ? ` (live data unavailable: ${esc(D.liveError)})` : ""}. ${gwState}</p>`;
  }

  // ---------- overview ----------
  function renderOverview() {
    const sorted = [...members].sort((a, b) => b.total - a.total);
    const meRow = members.find((x) => x.entry === me);
    const myRank = meRow ? meRow.rank : "–";
    const leader = sorted[0];
    const above = sorted.filter((x) => x.total > meRow.total).pop();
    const lh = lastHist(myM);
    const avgGw = Math.round(members.reduce((a, x) => a + x.event_total, 0) / members.length);
    const gwRank = 1 + members.filter((x) => x.event_total > meRow.event_total).length;
    const ft = freeTransfers(myM, D.entry.started_event || 1);
    const cl = chipsLeft(myM);
    const ev = D.events.find((e) => e.id === gwCur);
    const move = meRow.last_rank ? meRow.last_rank - meRow.rank : 0;

    $("#app").innerHTML = `
    <section class="view">
      <div class="kpis">
        <div class="kpi"><span class="k">League position</span><span class="v">${myRank}<small style="font-size:1rem;color:var(--muted)">/${members.length}</small></span><span class="s ${move > 0 ? "up" : move < 0 ? "down" : ""}">${move > 0 ? "▲ " + move : move < 0 ? "▼ " + -move : "No change"} since last GW</span></div>
        <div class="kpi"><span class="k">Total points</span><span class="v">${fmt(meRow.total)}</span><span class="s">${leader.entry === me ? "You lead the league" : `${leader.total - meRow.total} behind ${esc(leader.player_name)}`}</span></div>
        <div class="kpi"><span class="k">GW${gwCur} points</span><span class="v">${meRow.event_total}</span><span class="s">League avg ${avgGw} · ${ordinal(gwRank)} this GW${ev?.avg ? ` · FPL avg ${ev.avg}` : ""}</span></div>
        <div class="kpi"><span class="k">Overall rank</span><span class="v ${rankDir(myM)}">${fmt(D.entry.summary_overall_rank || lh[6] || 0)}</span>${rankMove(myM)}<span class="s">${above ? `${above.total - meRow.total} pts to ${ordinal(above.rank)} in league` : "Top of the league"}</span></div>
        <div class="kpi"><span class="k">Bank · Squad value</span><span class="v">£${price(bankOf(myM))}m</span><span class="s">Squad value £${price(squadValue(myM))}m · total £${price(squadValue(myM) + bankOf(myM))}m</span></div>
        <div class="kpi"><span class="k">Free transfers</span><span class="v">${ft}</span><span class="s">Estimate for GW${gwNext} · ${cl.filter((c) => !c.used).map((c) => CHIP_LABEL[c.name] || c.name).join(" ") || "no chips"} left</span></div>
      </div>

          ${pitchHTML(myM)}
        </div>
        <div class="panel">
          <div class="panel-head"><h2>What the league tells you</h2><span class="note">You vs the top 10 · updates every gameweek</span></div>
          <ul class="insights">${insights().map((i) => `<li class="${i.k}"><div><div class="t">${i.t}</div><div class="d">${i.d}</div></div></li>`).join("")}</ul>
        </div>
      </div>
      <div class="panel" id="future"><div class="panel-head"><h2>Future analysis</h2></div><p class="empty">Analysing fixtures, injury news, minutes and bookmaker odds…</p></div>
    </section>`;
    renderFuture();
  }

  // ---------- future analysis ----------
  // Everything here is recomputed on each page load from live FPL data, FPL's official player news,
  // recent minutes (per-player match history) and the cached bookmaker odds.
  const FA = { summ: {}, past: {}, odds: undefined, comp: null };
  // Per-player match history (minutes by gameweek) and last season's Premier League minutes.
  async function fetchSumm(ids) {
    const need = [...new Set(ids)].filter((id) => !(id in FA.summ));
    if (D.source !== "live" || !need.length) return;
    await pool(need, 8, async (id) => {
      try { const j = await api(`element-summary/${id}/`); FA.summ[id] = j.history.map((h) => [h.round, h.minutes, h.total_points]); const hp = j.history_past || []; FA.past[id] = hp.length ? hp[hp.length - 1].minutes : null; }
      catch (e) { FA.summ[id] = null; }
    });
    XS.clear();
  }

  // ---- Returning players: teammates back from injury (or due back) who can take minutes ----
  // A returnee is an established player (1,500+ league minutes last season, or priced well above the
  // position's floor) who is fit or due back within 5 gameweeks but has barely played recently.
  // He replaces the lowest-priced current starter in his position priced at or below him. A returning
  // midfielder also threatens attacking defenders, and a returning forward attacking midfielders.
  const PRICE_FLOOR = { 1: 4.6, 2: 4.8, 3: 5.3, 4: 5.5 };
  const returnFrom = (r) => {
    if (availability(r) >= 0.75) return 0;
    const back = expectedBack(r); if (!back) return 99;
    return D.events.filter((ev) => ev.id >= gwNext && Date.parse(ev.deadline) < back).length;
  };
  function returneePool() {
    return Object.values(E).filter((e) => {
      const gp = teamPlayed(e.team); if (!gp) return false;
      return returnFrom(e) <= 4 && e.now_cost / 10 >= PRICE_FLOOR[e.element_type] && (e.minutes / gp < 45 || e.starts <= gp - 3);
    }).map((e) => e.id);
  }
  function computeCompetition() {
    FA.comp = {}; XS.clear();
    const rets = returneePool().map((id) => E[id]).filter((e) => {
      const past = FA.past[e.id];
      const pedigree = past != null ? past >= 1500 : e.now_cost / 10 >= PRICE_FLOOR[e.element_type] + 1.5;
      return minutesInfo(e).avg < 30 && pedigree;
    });
    const groups = {};
    rets.forEach((r) => (groups[r.team + ":" + r.element_type] = groups[r.team + ":" + r.element_type] || []).push(r));
    Object.entries(groups).forEach(([k, rs]) => {
      const [team, type] = k.split(":").map(Number);
      const starters = Object.values(E).filter((e) => e.team === team && e.element_type === type && !rs.includes(e) && minutesInfo(e).avg >= 60).sort((a, b) => a.now_cost - b.now_cost);
      const taken = new Set();
      [...rs].sort((a, b) => b.now_cost - a.now_cost).forEach((r) => {
        const v = starters.find((x) => !taken.has(x.id) && x.now_cost <= r.now_cost); if (!v) return;
        taken.add(v.id); (FA.comp[v.id] = FA.comp[v.id] || []).push({ r, kind: "direct" });
      });
      const adj = type === 3 ? 2 : type === 4 ? 3 : null;
      if (adj) Object.values(E).filter((e) => e.team === team && e.element_type === adj && minutesInfo(e).avg >= 60 && parseFloat(e.expected_goal_involvements_per_90) >= (adj === 2 ? 0.25 : 0.45))
        .forEach((v) => rs.forEach((r) => (FA.comp[v.id] = FA.comp[v.id] || []).push({ r, kind: "adjacent" })));
    });
  }
  // Share of a player's expected minutes left in gameweek index i once a rival returns.
  function compFactor(e, i) {
    const c = FA.comp && FA.comp[e.id]; if (!c) return 1;
    let f = 1;
    c.forEach(({ r, kind }) => { const from = returnFrom(r); if (i < from) return; f = Math.min(f, kind === "direct" ? (i === from ? 0.8 : 0.6) : 0.9); });
    return f;
  }
  const listAnd = (xs) => (xs.length > 1 ? xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1] : xs[0] || "");

  function expectedBack(e) {

  // Yellow-card bans (Premier League): 5 by GW19 = 1 match, 10 by GW32 = 2 matches, 15 by GW38 = 3 matches.

  const ycBadge = (e) => { const r = banRisk(e); return r && r.away <= 2 ? ` <span class="yc ${r.away === 1 ? "hot" : ""}" title="${r.y} yellow cards: ${r.away} more before GW${r.until} means a ${r.games}-match ban">${r.y}</span>` : ""; };

  // Chance a player is available for gameweek g (i = index from the next gameweek).

  // Next-gameweek clean sheet / scoring chances per team, from the bookmaker odds.

  // Points projection: blended form and points per game, scaled per fixture (bookmaker odds for the

  }
  // Risk flags: [severity, text]; 3 = sell now, 2 = strongly consider, 1 = watch.
  function risks(e, TO) {
    const r = [], mi = minutesInfo(e), a = availability(e), news = e.news ? esc(e.news) : "";
    if (e.status === "s") r.push([3, `Suspended${news ? ": " + news : ""}`]);
    else if (["i", "u", "n"].includes(e.status) || a === 0) r.push([3, `Unavailable: ${news || "ruled out"}`]);
    else if (a <= 0.5) r.push([2, `Doubtful, ${pct(a)} chance of playing: ${news}`]);
    else if (a < 1) r.push([1, `Slight doubt, ${pct(a)} chance of playing: ${news}`]);
    if (a > 0 && e.status !== "s") {
      const where = mi.src === "recent" ? "over the last 3 gameweeks" : "this season";
      if (e.element_type === 1 && mi.avg < 45) r.push([1, `Backup keeper: ${Math.round(mi.avg)} minutes a game ${where}, only useful if your first-choice keeper is out`]);
      else if (mi.avg < 45) r.push([2, `Only ${Math.round(mi.avg)} minutes a game ${where}`]);
      else if (mi.avg < 65) r.push([1, `Rotation risk: ${Math.round(mi.avg)} minutes a game ${where}`]);
      if (mi.src === "recent" && mi.last === 0 && mi.avg >= 45) r.push([1, `Didn't play in GW${mi.lastGw}`]);
    }
    compReasons(e).forEach((x) => r.push(x));
    const ban = banRisk(e);
    // A ban risk is a watch item, never a reason to sell on its own: the projection already allows for it.
    if (ban && ban.away === 1 && e.status !== "s") r.push([1, `On ${ban.y} yellow cards: one more before GW${ban.until} means a ${ban.games}-match ban (booked in ${pct(ban.p)} of his games, ${pct(ban.pBan)} chance of a ban in the next 4 gameweeks)`]);
    const f3 = windowFdr(e.team, 3);
    if (f3 >= 4) r.push([2, `Very hard next 3 fixtures (average FDR ${f3.toFixed(1)})`]);
    else if (f3 >= 3.5) r.push([1, `Hard next 3 fixtures (average FDR ${f3.toFixed(1)})`]);
    const o = TO[e.team];
    if (o && e.element_type <= 2 && o.cs < 0.2) r.push([1, `Bookmakers give ${tShort(e.team)} only a ${pct(o.cs)} clean sheet chance in GW${gwNext}`]);
    if (o && e.element_type >= 3 && o.score < 0.62) r.push([1, `${tShort(e.team)} are only ${pct(o.score)} to score in GW${gwNext}`]);
    if (e.cost_change_event < 0) r.push([1, `Price fell £${price(-e.cost_change_event)}m this gameweek`]);
    newsFor(e).filter((x) => x.tone === "neg").slice(0, 1).forEach((x) => r.push([x.strong ? 2 : 1, `In the news (${esc(x.it.source)}, ${ago(x.it.date)}): "${esc(x.it.title)}"`]));

  }
  const sevOf = (rk) => rk.reduce((m, r) => Math.max(m, r[0]), 0);

  // ---- Football news: BBC Sport and Guardian Premier League headlines, matched to players ----
  // A player matches when his full name appears, or his short name appears alongside his club
  // (or his short name is unique, 5+ letters). The words around the name decide the tone.
  const NEWS_NEG = /\b(injur\w*|ruled out|out for|sidelined|scan|hamstring|knee|ankle|groin|calf|thigh|setback|doubt\w*|surgery|limped|stretchered|illness|concussion|suspen\w*|banned|sent off|sees red|red card|dropped|benched|axed|left out|omitted)\b/i;
  const NEWS_STRONG = /\b(ruled out|out for|surgery|weeks|months|sidelined|suspen\w*|banned|sent off|sees red|red card)\b/i;
  const NEWS_POS = /\b(returns?|returned|back in training|fit again|available again|boost|recalled|hat-trick|brace|double|scores?d?|stars|shines|impress\w*|winner|player of the match)\b/i;
  const NEWS_MGR = /\b(sacked|appointed|new (head )?coach|new manager|first game as|caretaker|interim)\b/i;
  const teamWords = (t) => [T[t]?.name].filter(Boolean).map((x) => x.toLowerCase());

  const TEAM_ALIASES = { MCI: ["man city", "manchester city"], MUN: ["man utd", "man united", "manchester united"], TOT: ["spurs", "tottenham"], NFO: ["forest", "nottingham"], NEW: ["newcastle"], BHA: ["brighton"], WHU: ["west ham"], WOL: ["wolves"], AVL: ["villa"], CRY: ["palace"], LEE: ["leeds"], IPS: ["ipswich"], COV: ["coventry"], HUL: ["hull"], BOU: ["bournemouth"], SUN: ["sunderland"] };

  // Every player's short and full surname (4+ letters), used to tell whose news a sentence is.

  const NF = new Map(), XS = new Map(); // per-run caches for news matches and expert scores

    if (!FA.news || !FA.news.items) return [];

    const short = e.web_name.toLowerCase(), full = `${e.first_name} ${e.second_name}`.toLowerCase();
    const out = [];
    FA.news.items.forEach((it) => {
      const text = `${it.title} . ${it.desc}`, low = text.toLowerCase();
      let at = low.indexOf(full);
      if (at < 0) { const re = new RegExp(`(^|[^a-zà-ÿ])${short.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}([^a-zà-ÿ]|$)`); const m = re.exec(low); if (m && (mentionsTeam(low, e.team) || (nameCount[short] === 1 && short.length >= 5))) at = m.index; }

  function teamNews(t) {

  // ---- Expert score: one number used for every recommendation ----

  function candidates(type, budget, squad, tc, outTeam, TO, avoid, minPrice = 0) {
    return Object.values(E).filter((e) => e.element_type === type && !squad.has(e.id) && e.now_cost <= budget && e.now_cost >= minPrice && isFit(e)
        && ((tc[e.team] || 0) - (e.team === outTeam ? 1 : 0)) < 3)
      .map((e) => { const p5 = expertScore(e, 5, TO), p3 = expertScore(e, 3, TO); return { e, p5, p3, mins: minutesInfo(e), swing: p3 * (avoid.has(e.id) ? 0 : 1) }; })
      .filter((c) => c.mins.avg >= 60 && sevOf(risks(c.e, TO)) < 2)
      .sort((a, b) => b.p5 + 0.4 * b.swing - (a.p5 + 0.4 * a.swing));
  }

  async function loadNews() {
    if (FA.news !== undefined) return;
    NF.clear(); XS.clear();
    FA.news = await fetch("api/news", { cache: "no-store" }).then((r) => (r.ok && (r.headers.get("content-type") || "").includes("json") ? r.json() : null)).catch(() => null);
  }
  async function renderFuture() {
    const box = $("#future"); if (!box) return;
    try {
      await loadNews();
      if (FA.odds === undefined) FA.odds = await (oddsCache ? Promise.resolve(oddsCache) : fetch("api/odds", { cache: "no-store" }).then((r) => (r.ok && (r.headers.get("content-type") || "").includes("json") ? r.json() : null)).catch(() => null));
      if (FA.odds) oddsCache = FA.odds;
      const TO = teamOdds();
      // Recent minutes: your squad, the strongest targets per position and the top-6 players you don't own.
      const mineIds = squadOf(myM).map((p) => p[0]);
      const pre = [1, 2, 3, 4].flatMap((t) => Object.values(E).filter((e) => e.element_type === t && isFit(e) && !mineIds.includes(e.id))
        .map((e) => [e.id, proj(e, 5, TO).total]).sort((a, b) => b[1] - a[1]).slice(0, 8).map((x) => x[0]));

      const topMissing = Object.keys(topOwn).map(Number).filter((id) => !mineIds.includes(id) && topOwn[id] >= 2);

      if (D.source === "live" && need.length) box.querySelector(".empty") && (box.querySelector(".empty").textContent = `Checking recent minutes and returning players for ${need.length} players…`);

    } catch (err) {
      box.innerHTML = `<div class="panel-head"><h2>Future analysis</h2></div><div class="err">The analysis couldn't be built (${esc(err.message)}). Reload to try again.</div>`;
    }
  }

  function drawFuture(box, TO, top, topOwn, sortedM, meRow) {
    const leader = sortedM[0].entry === me ? sortedM[1] : sortedM[0];
    const lName = firstName(leader);
    const leaderOwns = new Set(squadOf(leader.m).map((p) => p[0]));
    const picks = squadOf(myM);
    const ft = freeTransfers(myM, D.entry.started_event || 1);
    let bank = myM.picks?.bank ?? lastHist(myM)[8];
    const squad = new Set(picks.map((p) => p[0]));
    const tc = {}; picks.forEach((p) => (tc[E[p[0]].team] = (tc[E[p[0]].team] || 0) + 1));
    const mine = picks.map(([id, slot]) => { const e = E[id], rk = risks(e, TO); return { e, slot, rk, sev: sevOf(rk), p5: expertScore(e, 5, TO), p3: expertScore(e, 3, TO), mins: minutesInfo(e) }; });

    // Transfer plan: greedy, most urgent first. Bench players count for less unless they're unavailable.
    const moves = []; const pool5 = [...mine];
    for (let k = 0; k < 4 && moves.length < 3; k++) {
      let best = null;
      pool5.forEach((m) => {
        // Unless a player is unavailable, don't downgrade by more than £3m (that just leaves money idle).
        const c = candidates(m.e.element_type, bank + sellPrice(m.e.id), squad, tc, m.e.team, TO, leaderOwns, m.sev >= 3 ? 0 : m.e.now_cost - 30)[0]; if (!c) return;
        // Bench players matter less; a backup keeper hardly at all.
        const w = m.slot <= 11 ? 1 : m.e.element_type === 1 ? 0.1 : 0.25, gain = c.p5 - m.p5;
        const score = m.sev * 8 * (m.slot <= 11 ? 1 : 0.5) + gain * w;
        // Selling a template player the leader owns is a big gamble: only for a clear gain.

      });
      if (!best) break;

    }
    const moved = new Map(moves.map((mv) => [mv.m.e.id, mv.c.e]));
    const lgOwnAll = {}; members.forEach((x) => squadOf(x.m).forEach((p) => (lgOwnAll[p[0]] = (lgOwnAll[p[0]] || 0) + 1)));

    // Projections for the next 3 gameweeks: starting XI plus captain each week.
    const xiProj = (ids) => { let t = 0; for (let i = 0; i < 3; i++) { const v = ids.map((id) => proj(E[id], 3, TO).per[i] || 0); t += v.reduce((a, b) => a + b, 0) + Math.max(0, ...v); } return t; };
    const myXI = picks.filter((p) => p[1] <= 11).map((p) => p[0]);

        weeks.push({ g, tot, hard });
      }

      .map((id) => { const e = E[id], rk = risks(e, TO), p5 = proj(e, 5, TO); return { e, n: topOwn[id], rk, sev: sevOf(rk), p5: p5.total, mins: p5.mins, lead: leaderOwns.has(id), plan: moves.some((m) => m.c.e.id === id) }; })
      .sort((a, b) => b.n - a.n || b.p5 - a.p5);
    const posTop = {}; [1, 2, 3, 4].forEach((t) => { const v = Object.values(E).filter((e) => e.element_type === t && isFit(e)).map((e) => proj(e, 5, TO).total).sort((a, b) => b - a); posTop[t] = v[Math.min(14, v.length - 1)] || 0; });
    // Defensive coverage: owning any keeper or defender from a club already pays you when that club

    // Watch list, minus yellow-card risks (those have their own Suspension item).

    if (watch.length) pr.push({ tag: "Watch", cls: "", t: "Keep, but check team news before the deadline", d: watch.map(({ m, rs }) => `<strong>${esc(m.e.web_name)}</strong>: ${rs.map((r) => r[1]).join("; ")}`).join(". ") });

    const targets = [1, 2, 3, 4].map((t) => {

        <div class="panel">

  // Per-gameweek numbers for one manager. Net points = GW points minus hits, so the running total matches FPL.
  function gwStats(m) {

        <span class="role"><i></i>${role}</span>
