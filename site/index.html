        <span class="tm">${esc(x.entry_name)}</span>
        <span class="row2"><span>${ordinal(x.rank)} · ${fmt(x.total)} pts</span><span class="${d > 0 ? "down" : d < 0 ? "up" : ""}">${d > 0 ? d + " ahead" : d < 0 ? -d + " behind" : "level"}</span></span>
      </button>`;
    }).join("");

    // head-to-head rows: [label, mine, theirs, kind] kind: "hi" higher is better, "lo" lower is better, "rank", null = no verdict
    const lh = lastHist(myM), th = lastHist(them.m);
    const money = (v) => "£" + price(v) + "m";
    const sumIdx = (m, i) => m.history.reduce((a, r) => a + r[i], 0);
    const capOf = (m) => { const c = squadOf(m).find((p) => p[3]); return c ? E[c[0]]?.web_name : "–"; };
    const rows = [
      ["League position", meRow.rank, them.rank, "rank", ordinal],
      ["Total points", meRow.total, them.total, "hi", fmt],
      [`GW${gwCur} points`, A.by[gwCur]?.net ?? 0, B.by[gwCur]?.net ?? 0, "hi", String],
      ["Average per gameweek", A.avg, B.avg, "hi", (v) => v.toFixed(1)],
      ["Best gameweek", A.best?.[1] ?? 0, B.best?.[1] ?? 0, "hi", null, (v, who) => `${v} <small style="color:var(--muted)">GW${(who === "a" ? A.best : B.best)?.[0]}</small>`],
      ["Worst gameweek", A.worst?.[1] ?? 0, B.worst?.[1] ?? 0, "hi", null, (v, who) => `${v} <small style="color:var(--muted)">GW${(who === "a" ? A.worst : B.worst)?.[0]}</small>`],
      ["Overall rank", lh[6], th[6], "orank", fmt],
      ["Squad value", squadValue(myM), squadValue(them.m), "hi", money],
      ["In the bank", bankOf(myM), bankOf(them.m), "hi", money],
      ["Total team value", squadValue(myM) + bankOf(myM), squadValue(them.m) + bankOf(them.m), "hi", money],
      ["Transfers made", sumIdx(myM, 3), sumIdx(them.m, 3), null, String],
      ["Points lost to hits", sumIdx(myM, 4), sumIdx(them.m, 4), "lo", (v) => (v ? "−" + v : "0")],
      ["Points left on bench", sumIdx(myM, 5), sumIdx(them.m, 5), "lo", String],
      [`GW${gwCur} captain`, capOf(myM), capOf(them.m), "text", esc],
    ];
    const diffCell = ([label, a, b, kind, f]) => {
      if (kind === "text" || kind === null) return `<td class="n" style="color:var(--muted)">${kind === "text" ? (a === b ? "Same" : "Different") : sign(a - b)}</td>`;
      if (kind === "rank" || kind === "orank") {
        const d = b - a; // positive = you are higher up
        if (!d) return `<td class="n">Level</td>`;
        return `<td class="n ${d > 0 ? "up" : "down"}">${fmt(Math.abs(d))} ${kind === "rank" ? "place" + (Math.abs(d) === 1 ? "" : "s") : ""} ${d > 0 ? "above" : "below"}</td>`;
      }
      let d = a - b; const good = kind === "hi" ? d > 0 : d < 0;
      const txt = label.includes("value") || label.includes("bank") ? (d > 0 ? "+" : d < 0 ? "−" : "") + "£" + price(Math.abs(d)) + "m" : label.startsWith("Average") ? sign(Number(d.toFixed(1))) : sign(d);
      return `<td class="n ${d === 0 ? "" : good ? "up" : "down"}">${d === 0 ? "Level" : txt}</td>`;
    };
    const h2hRows = rows.map((r) => {
      const [label, a, b, , f, custom] = r;
      const show = (v, who) => (custom ? custom(v, who) : f(v));
      return `<tr><td>${label}</td><td class="n">${show(a, "a")}</td><td class="n">${show(b, "b")}</td>${diffCell(r)}</tr>`;
    }).join("");

    // Chips come in two sets: GW1-19 and GW20-38.
    const halfRows = [];
    [[1, 19], [20, 38]].forEach(([hs, he]) => {
      const defs = D.chips_def.filter(([, s, e]) => s <= he && e >= hs);
      if (!defs.length) return;
      halfRows.push(`<tr class="half"><td colspan="3">${hs === 1 ? "First half" : "Second half"} · GW${hs}–${he}</td></tr>`);
      ["wildcard", "freehit", "bboost", "3xc"].forEach((n) => {
        const d = defs.find(([c]) => c === n); if (!d) return;
        const a = chipStatus(myM, n, d[1], d[2]), b = chipStatus(them.m, n, d[1], d[2]);
        halfRows.push(`<tr><td>${CHIP_NAME[n]}</td><td><span class="st ${a.cls}">${a.txt}</span></td><td><span class="st ${b.cls}">${b.txt}</span></td></tr>`);
      });
    });
    const nowLeft = (m) => D.chips_def.filter(([n, s, e]) => gwNext >= s && gwNext <= e && chipStatus(m, n, s, e).left).length;

    const tableRows = gws.map((g) => {
      const a = A.by[g], b = B.by[g];
      const d = a && b ? a.net - b.net : null, gapT = a && b ? a.total - b.total : null;
      const ca = A.chipAt[g], cb = B.chipAt[g];
      return `<tr><td>GW${g}</td>
        <td class="n">${a ? a.net : "–"}${a?.cost ? `<small>(−${a.cost})</small>` : ""}${ca ? ` <span class="chip on">${CHIP_LABEL[ca]}</span>` : ""}</td>
        <td class="n">${b ? b.net : "–"}${b?.cost ? `<small>(−${b.cost})</small>` : ""}${cb ? ` <span class="chip on">${CHIP_LABEL[cb]}</span>` : ""}</td>
        <td class="n ${d > 0 ? "up" : d < 0 ? "down" : ""}">${d == null ? "–" : d === 0 ? "0" : sign(d)}</td>
        <td class="n">${a ? fmt(a.total) : "–"}</td><td class="n">${b ? fmt(b.total) : "–"}</td>
        <td class="n ${gapT > 0 ? "up" : gapT < 0 ? "down" : ""}"><strong>${gapT == null ? "–" : gapT === 0 ? "Level" : sign(gapT)}</strong></td></tr>`;
    }).join("");

    $("#app").innerHTML = `
    <section class="view">
      <div class="panel-head"><h2>Mini League analysis</h2><span class="note">The league leader, friends and family. Pick one to compare with FC27.</span></div>
      <div class="picks5">${cards}</div>
      ${missing.length ? `<p class="note">Not found in ${esc(D.league.name)}: ${missing.map(esc).join(", ")}.</p>` : ""}

      <div class="panel">
        <div class="vs">
          <div class="side"><span class="who"><i style="background:var(--s-me)"></i>You</span><span class="big">${fmt(meRow.total)}</span><span class="mid">${esc(D.entry.name)} · ${ordinal(meRow.rank)}</span></div>
          <div class="mid"><strong style="font-size:1rem;color:var(--ink)">${gap === 0 ? "Level" : gap > 0 ? `You lead by ${gap}` : `${tn} leads by ${-gap}`}</strong><br>Gameweeks won: you ${won}, ${esc(tn)} ${lost}${drawn ? `, ${drawn} drawn` : ""}</div>
          <div class="side"><span class="who"><i style="background:var(--s-them)"></i>${esc(tn)}</span><span class="big">${fmt(them.total)}</span><span class="mid">${esc(them.entry_name)} · ${ordinal(them.rank)}</span></div>
        </div>
      </div>

      <div class="grid-2">
        <div class="panel">
          <div class="panel-head"><h3>Head to head</h3><span class="note">Difference is from your side</span></div>
          <div class="tbl-wrap"><table class="h2h"><thead><tr><th></th><th class="n"><span class="sw" style="background:var(--s-me)"></span>You</th><th class="n"><span class="sw" style="background:var(--s-them)"></span>${esc(tn)}</th><th class="n">Difference</th></tr></thead><tbody>${h2hRows}</tbody></table></div>
          <p class="note">Squad value is your 15 players at today's prices, as FPL shows it; total team value adds the money in the bank.</p>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Chips</h3><span class="note">You have ${nowLeft(myM)} left this half, ${esc(tn)} has ${nowLeft(them.m)}</span></div>
          <div class="tbl-wrap"><table class="chipgrid"><thead><tr><th>Chip</th><th><span class="sw" style="background:var(--s-me)"></span>You</th><th><span class="sw" style="background:var(--s-them)"></span>${esc(tn)}</th></tr></thead><tbody>${halfRows.join("")}</tbody></table></div>
          <p class="note">First-half chips must be played by the GW19 deadline or they're lost. A second set unlocks from GW20.</p>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Points per gameweek</h3><span class="note">Net of hits. Numbers under each gameweek show your margin.</span></div>
        <div class="legend"><span><i style="background:var(--s-me)"></i>You</span><span><i style="background:var(--s-them)"></i>${esc(them.player_name)}</span></div>
        <div style="overflow-x:auto"><div class="chart" id="gwChart" style="min-width:560px">${gwBarChart(gws, A, B, tn)}</div></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>Season total by gameweek</h3><span class="note">Running total after each gameweek</span></div>
        <div class="legend"><span><i style="background:var(--s-me)"></i>You</span><span><i style="background:var(--s-them)"></i>${esc(them.player_name)}</span></div>
        <div style="overflow-x:auto"><div class="chart" id="totChart" style="min-width:560px">${totalChart(gws, A, B, tn)}</div></div>
        <div class="tbl-wrap"><table class="gw-tbl">
          <thead><tr><th>Gameweek</th><th class="n"><span class="sw" style="background:var(--s-me)"></span>Your pts</th><th class="n"><span class="sw" style="background:var(--s-them)"></span>${esc(tn)} pts</th><th class="n">GW margin</th><th class="n">Your total</th><th class="n">${esc(tn)} total</th><th class="n">Overall gap</th></tr></thead>
          <tbody>${tableRows}</tbody></table></div>
        <p class="note">Small numbers in brackets are points deducted for extra transfers. Chip badges show the chip played that week.</p>
      </div>
      ${freshness()}
    </section>`;

    document.querySelectorAll("[data-h2h]").forEach((b) => b.addEventListener("click", () => { store.set("h2h", Number(b.dataset.h2h)); renderAnalysis(); }));
    wireTip($("#gwChart"), (g) => {
      const a = A.by[g], b = B.by[g], d = a && b ? a.net - b.net : null;
      return `<b>GW${g}</b><div class="r"><span><i style="background:var(--s-me)"></i>You</span><span>${a ? a.net : "–"}${a?.cost ? ` (−${a.cost})` : ""}${A.chipAt[g] ? " · " + CHIP_LABEL[A.chipAt[g]] : ""}</span></div><div class="r"><span><i style="background:var(--s-them)"></i>${esc(tn)}</span><span>${b ? b.net : "–"}${b?.cost ? ` (−${b.cost})` : ""}${B.chipAt[g] ? " · " + CHIP_LABEL[B.chipAt[g]] : ""}</span></div>${d == null ? "" : `<div class="r"><span>Margin</span><span>${d === 0 ? "Level" : sign(d)}</span></div>`}`;
    });
    wireTip($("#totChart"), (g) => {
      const a = A.by[g], b = B.by[g], d = a && b ? a.total - b.total : null;
      return `<b>After GW${g}</b><div class="r"><span><i style="background:var(--s-me)"></i>You</span><span>${a ? fmt(a.total) : "–"}</span></div><div class="r"><span><i style="background:var(--s-them)"></i>${esc(tn)}</span><span>${b ? fmt(b.total) : "–"}</span></div>${d == null ? "" : `<div class="r"><span>Gap</span><span>${d === 0 ? "Level" : sign(d)}</span></div>`}`;
    }, true);
  }

  function niceStep(range, target = 5) { const steps = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500]; return steps.find((s) => range / s <= target) || 1000; }
  const CW = 860;

  function gwBarChart(gws, A, B) {
    const H = 300, L = 38, R = 8, Tp = 12, B0 = 52;
    const max = Math.max(10, ...gws.map((g) => Math.max(A.by[g]?.net ?? 0, B.by[g]?.net ?? 0)));
    const step = niceStep(max, 5), top = Math.ceil(max / step) * step;
    const y = (v) => Tp + (1 - Math.max(0, v) / top) * (H - Tp - B0);
    const band = (CW - L - R) / gws.length, bw = Math.min(18, (band - 8) / 2);
    let g = "";
    for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${CW - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    const bar = (x, v, cls) => {
      if (v == null) return "";
      const y0 = y(0), y1 = y(v), r = Math.min(4, bw / 2, (y0 - y1) / 2);
      if (y0 - y1 < 0.5) return `<rect class="${cls}" x="${x}" y="${y0 - 1}" width="${bw}" height="1"/>`;
      return `<path class="${cls}" d="M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + bw - r}Q${x + bw},${y1} ${x + bw},${y1 + r}V${y0}Z"/>`;
    };
    gws.forEach((gw, i) => {
      const cx = L + band * i + band / 2;
      const a = A.by[gw]?.net, b = B.by[gw]?.net;
      g += bar(cx - bw - 1, a, "bar-me") + bar(cx + 1, b, "bar-them");
      g += `<text class="ax" x="${cx}" y="${H - B0 + 16}" text-anchor="middle">${gw}</text>`;
      if (a != null && b != null) { const d = a - b; g += `<text class="${d > 0 ? "dgood" : d < 0 ? "dbad" : "dzero"}" x="${cx}" y="${H - B0 + 34}" text-anchor="middle">${d === 0 ? "0" : sign(d)}</text>`; }
      g += `<rect class="hit" data-gw="${gw}" x="${L + band * i}" y="${Tp}" width="${band}" height="${H - Tp - B0 + 40}"/>`;
    });
    g += `<text class="ax" x="${L - 6}" y="${H - B0 + 16}" text-anchor="end">GW</text><text class="ax" x="${L - 6}" y="${H - B0 + 34}" text-anchor="end">±</text>`;
    return `<svg viewBox="0 0 ${CW} ${H}" role="img" aria-label="Points per gameweek, you against your rival">${g}</svg>`;
  }

  function totalChart(gws, A, B, tn) {
    const H = 300, L = 46, R = 96, Tp = 14, B0 = 28;
    const vals = []; gws.forEach((g) => { if (A.by[g]) vals.push(A.by[g].total); if (B.by[g]) vals.push(B.by[g].total); });
    const max = Math.max(10, ...vals), step = niceStep(max, 6), top = Math.ceil(max / step) * step;
    const x = (gw) => L + (gws.length <= 1 ? 0 : (gws.indexOf(gw) / (gws.length - 1)) * (CW - L - R));
    const y = (v) => Tp + (1 - v / top) * (H - Tp - B0);
    let g = "";
    for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${CW - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`;
    gws.forEach((gw) => (g += `<text class="ax" x="${x(gw)}" y="${H - 8}" text-anchor="middle">${gw}</text>`));
    const line = (S, cls) => { const pts = gws.filter((gw) => S.by[gw]); return `<path class="${cls}" d="${pts.map((gw, i) => (i ? "L" : "M") + x(gw).toFixed(1) + "," + y(S.by[gw].total).toFixed(1)).join("")}"/>`; };
    g += line(B, "riv") + line(A, "mine");
    const last = (S) => { const l = gws.filter((gw) => S.by[gw]).pop(); return l ? [l, S.by[l].total] : null; };
    const la = last(A), lb = last(B);
    let ya = la ? y(la[1]) : 0, yb = lb ? y(lb[1]) : 0;
    if (la && lb && Math.abs(ya - yb) < 16) { const mid = (ya + yb) / 2, up = la[1] >= lb[1]; ya = mid + (up ? -9 : 9); yb = mid + (up ? 9 : -9); }
    if (lb) g += `<circle class="dot-them" cx="${x(lb[0])}" cy="${y(lb[1])}" r="5"/><text class="lbl-rv" x="${x(lb[0]) + 10}" y="${yb + 4}">${esc(tn)} ${fmt(lb[1])}</text>`;
    if (la) g += `<circle class="dot-me" cx="${x(la[0])}" cy="${y(la[1])}" r="5"/><text class="lbl-me" x="${x(la[0]) + 10}" y="${ya + 4}">You ${fmt(la[1])}</text>`;
    g += `<line class="xh" id="xh" x1="0" x2="0" y1="${Tp}" y2="${H - B0}" visibility="hidden"/>`;
    const half = gws.length > 1 ? (CW - L - R) / (gws.length - 1) / 2 : (CW - L - R) / 2;
    gws.forEach((gw) => (g += `<rect class="hit" data-gw="${gw}" data-x="${x(gw)}" x="${x(gw) - half}" y="${Tp}" width="${half * 2}" height="${H - Tp - B0}"/>`));
    return `<svg viewBox="0 0 ${CW} ${H}" role="img" aria-label="Season total after each gameweek, you against your rival">${g}</svg>`;
  }

  // Shared hover/tap tooltip for the analysis charts.
  function wireTip(box, html, crosshair) {
    if (!box) return;
    const svg = box.querySelector("svg"), tip = document.createElement("div");
    tip.className = "tip"; tip.hidden = true; box.appendChild(tip);
    const xh = crosshair ? svg.querySelector("#xh") : null;
    const show = (r, ev) => {
      box.querySelectorAll(".hit.on").forEach((h) => h.classList.remove("on")); if (!crosshair) r.classList.add("on");
      tip.innerHTML = html(Number(r.dataset.gw)); tip.hidden = false;
      if (xh) { xh.setAttribute("x1", r.dataset.x); xh.setAttribute("x2", r.dataset.x); xh.setAttribute("visibility", "visible"); }
      const bb = box.getBoundingClientRect(), rb = r.getBoundingClientRect();
      let left = rb.left - bb.left + rb.width / 2 + 12; if (left + tip.offsetWidth > bb.width) left = rb.left - bb.left + rb.width / 2 - tip.offsetWidth - 12;
      tip.style.left = Math.max(0, left) + "px"; tip.style.top = Math.max(0, (ev ? ev.clientY - bb.top : 40) - tip.offsetHeight / 2) + "px";
    };
    const hide = () => { tip.hidden = true; box.querySelectorAll(".hit.on").forEach((h) => h.classList.remove("on")); if (xh) xh.setAttribute("visibility", "hidden"); };
    svg.querySelectorAll(".hit").forEach((r) => { r.addEventListener("pointermove", (ev) => show(r, ev)); r.addEventListener("click", (ev) => show(r, ev)); });
    svg.addEventListener("pointerleave", hide);
  }

  // ---------- league ----------
  function renderLeague() {
    const sorted = [...members].sort((a, b) => a.rank - b.rank);
    const meRow = members.find((x) => x.entry === me);
    let rival = store.get("rival", null);
    if (!members.some((x) => x.entry === rival) || rival === me) {
      const above = sorted.filter((x) => x.total > meRow.total);
      rival = (above[above.length - 1] || sorted.find((x) => x.entry !== me)).entry;
    }
    const rows = sorted.map((x) => {
      const mv = x.last_rank ? x.last_rank - x.rank : 0;
      const cap = squadOf(x.m).find((p) => p[3]);
      const chip = x.m.picks?.chip;
      const cl = chipsLeft(x.m);
      return `<tr class="click ${x.entry === me ? "me" : x.entry === rival ? "rv" : ""}" data-e="${x.entry}">
        <td class="n">${x.rank} <span class="${mv > 0 ? "up" : mv < 0 ? "down" : ""}" style="font-size:.7rem">${mv > 0 ? "▲" + mv : mv < 0 ? "▼" + -mv : ""}</span></td>
        <td><span class="mgr">${esc(x.entry_name)}<small>${esc(x.player_name)}</small></span></td>
        <td class="n">${x.event_total}</td>
        <td class="n"><strong>${fmt(x.total)}</strong></td>
        <td class="n ${x.total - meRow.total > 0 ? "down" : x.total - meRow.total < 0 ? "up" : ""}">${x.entry === me ? "–" : sign(x.total - meRow.total)}</td>
        <td>${cap ? esc(E[cap[0]]?.web_name) : "–"}${chip ? ` <span class="chip on">${CHIP_LABEL[chip] || esc(chip)}</span>` : ""}</td>
        <td><span class="chips">${cl.map((c) => `<span class="chip ${c.used ? "used" : ""}" title="${c.used ? "Used" : "Available"}">${CHIP_LABEL[c.name] || c.name}</span>`).join("")}</span></td>
        <td class="n">${seasonSum(x.m, 4) ? "−" + seasonSum(x.m, 4) : "0"}</td>
        <td class="n">${seasonSum(x.m, 5)}</td>
      </tr>`;
    }).join("");

    $("#app").innerHTML = `
    <section class="view">
      <div class="panel-head"><h2>${esc(D.league.name)}: standings</h2><span class="note">Tap a manager to compare squads with them</span></div>
      <div class="tbl-wrap"><table class="cards-sm">
        <thead><tr><th class="n">#</th><th>Team</th><th class="n">GW${gwCur}</th><th class="n">Total</th><th class="n">vs you</th><th>Captain</th><th>Chips (this half)</th><th class="n">Hits</th><th class="n">Bench pts</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      ${freshness()}
      <div class="panel">
        <div class="panel-head"><h2>Season race</h2><span class="note">Points above or below the league average after each gameweek</span></div>
        <div class="legend"><span><i style="background:var(--s-me)"></i>You</span><span><i style="background:var(--s-them)"></i>${esc(members.find((x) => x.entry === rival)?.player_name)}</span><span><i style="background:var(--chart-other)"></i>Rest of the league</span></div>
        <div class="chart">${raceChart(rival)}</div>
      </div>
      ${gwWinnersHTML()}
      <div class="panel" id="cmp"></div>
    </section>`;
    document.querySelectorAll("tbody tr.click").forEach((tr) => tr.addEventListener("click", () => {
      const e = Number(tr.dataset.e); if (e === me) return; store.set("rival", e); renderLeague(); $("#cmp").scrollIntoView({ behavior: "smooth", block: "start" });
    }));
    renderCompare(rival);
  }

  // Highest scorer in the league for every gameweek so far (points after hits).
  function gwWinnersHTML() {
    const rows = [], wins = {};
    for (let g = 1; g <= gwCur; g++) {
      const sc = members.map((x) => { const r = x.m.history.find((h) => h[0] === g); return r ? { x, net: r[1] - r[4], chip: x.m.chips.find(([, ev]) => ev === g)?.[0] } : null; }).filter(Boolean).sort((a, b) => b.net - a.net);
      if (!sc.length) continue;
      const top = sc.filter((v) => v.net === sc[0].net), second = sc.find((v) => v.net < sc[0].net);
      const mine = sc.find((v) => v.x.entry === me);
      top.forEach((v) => (wins[v.x.entry] = (wins[v.x.entry] || 0) + 1 / top.length));
      rows.push({ g, top, pts: sc[0].net, margin: second ? sc[0].net - second.net : 0, avg: sc.reduce((a, v) => a + v.net, 0) / sc.length, mine, myRank: mine ? 1 + sc.filter((v) => v.net > mine.net).length : null, n: sc.length });
    }
    const ev = D.events.find((e) => e.id === gwCur);
    const tally = Object.entries(wins).map(([e, w]) => ({ x: members.find((m) => m.entry === Number(e)), w })).sort((a, b) => b.w - a.w || a.x.rank - b.x.rank);
    const myWins = wins[me] || 0;
    const fmtW = (w) => (Number.isInteger(w) ? w : w.toFixed(1));
    return `<div class="panel">
      <div class="panel-head"><h2>Gameweek winners</h2><span class="note">Top score in ${esc(D.league.name)} each gameweek, after hits${ev && !ev.finished ? `. GW${gwCur} is still in progress` : ""}</span></div>
      <div class="win-tally">${tally.map(({ x, w }) => `<span class="wt ${x.entry === me ? "me" : ""}"><strong>${fmtW(w)}</strong> ${esc(x.player_name)}</span>`).join("")}${myWins ? "" : `<span class="wt me"><strong>0</strong> You</span>`}</div>
      <p class="note">Gameweek wins so far. A shared top score is split between the managers who tied.</p>
      <div class="tbl-wrap"><table class="cards-sm win-tbl">
        <thead><tr><th>Gameweek</th><th>Winner</th><th class="n">Points</th><th class="n">Won by</th><th class="n">League avg</th><th class="n">Your score</th></tr></thead>
        <tbody>${rows.slice().reverse().map((r) => `<tr class="${r.top.some((v) => v.x.entry === me) ? "me" : ""}"><td>GW${r.g}${r.g === gwCur && ev && !ev.finished ? ' <span class="pill">Live</span>' : ""}</td>
          <td><span class="mgr"><span>${r.top.map((v) => `${esc(v.x.entry_name)}${v.chip ? ` <span class="chip on">${CHIP_LABEL[v.chip] || esc(v.chip)}</span>` : ""}`).join(" & ")}</span><small>${r.top.map((v) => esc(v.x.player_name)).join(" & ")}${r.top.length > 1 ? " (tied)" : ""}</small></span></td>
          <td class="n"><strong>${r.pts}</strong></td><td class="n">${r.top.length > 1 ? "Tie" : "+" + r.margin}</td><td class="n">${r.avg.toFixed(0)}</td>
          <td class="n">${r.mine ? `${r.mine.net} <small style="color:var(--muted)">${ordinal(r.myRank)} of ${r.n}</small>` : "–"}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>`;
  }

  function raceChart(rival) {
    const gws = []; for (let g = 1; g <= gwCur; g++) gws.push(g);
    const totals = {}; members.forEach((x) => { totals[x.entry] = {}; x.m.history.forEach((r) => (totals[x.entry][r[0]] = r[2])); });
    const avg = {}; gws.forEach((g) => { const v = members.map((x) => totals[x.entry][g]).filter((v) => v != null); avg[g] = v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; });
    const series = members.map((x) => ({ e: x.entry, pts: gws.filter((g) => totals[x.entry][g] != null).map((g) => [g, totals[x.entry][g] - avg[g]]) }));
    let lo = 0, hi = 0; series.forEach((s) => s.pts.forEach(([, v]) => { lo = Math.min(lo, v); hi = Math.max(hi, v); }));
    const steps = [5, 10, 20, 25, 50, 100, 200]; const step = steps.find((s) => (hi - lo) / s <= 6) || 200;
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const W = 820, H = 320, L = 44, R = 110, Tp = 12, B = 28;
    const x = (g) => L + ((g - 1) / Math.max(1, gwCur - 1)) * (W - L - R);
    const y = (v) => Tp + (1 - (v - lo) / (hi - lo || 1)) * (H - Tp - B);
    let g = "";
    for (let v = lo; v <= hi; v += step) g += `<line class="${v === 0 ? "zero" : "grid"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? "+" + v : v}</text>`;
    gws.forEach((gw) => { if (gwCur <= 12 || gw % 2 === 1 || gw === gwCur) g += `<text class="ax" x="${x(gw)}" y="${H - 8}" text-anchor="middle">${gw}</text>`; });
    const path = (s) => s.pts.map(([gw, v], i) => (i ? "L" : "M") + x(gw).toFixed(1) + "," + y(v).toFixed(1)).join("");
    series.filter((s) => s.e !== me && s.e !== rival).forEach((s) => (g += `<path class="other" d="${path(s)}"/>`));
    const sr = series.find((s) => s.e === rival), sm = series.find((s) => s.e === me);
    const rn = members.find((x) => x.entry === rival)?.player_name.split(" ")[0] || "Rival";
    if (sr) g += `<path class="riv" d="${path(sr)}"/>`;
    if (sm) g += `<path class="mine" d="${path(sm)}"/>`;
    const last = (s) => s && s.pts[s.pts.length - 1];
    const pm = last(sm), pr = last(sr);
    // end labels: nudge apart in pixel space when they would overlap
    let ym = pm ? y(pm[1]) : 0, yr = pr ? y(pr[1]) : 0;
    if (pm && pr && Math.abs(ym - yr) < 15) { const mid = (ym + yr) / 2, up = pm[1] >= pr[1]; ym = mid + (up ? -8 : 8); yr = mid + (up ? 8 : -8); }
    const end = (p, ly, cls, colorVar, label) => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" style="fill:var(${colorVar})"/><text class="${cls}" x="${x(p[0]) + 8}" y="${ly + 4}">${esc(label)} ${p[1] > 0 ? "+" : ""}${Math.round(p[1])}</text>`;
    if (pr) g += end(pr, yr, "lbl-rv", "--s-them", rn);
    if (pm) g += end(pm, ym, "lbl-me", "--s-me", "You");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Season race chart">${g}</svg>`;
  }

  function renderCompare(rival) {
    const r = members.find((x) => x.entry === rival); if (!r) return;
    const mine = new Set(squadOf(myM).map((p) => p[0])), theirs = new Set(squadOf(r.m).map((p) => p[0]));
    const onlyMe = [...mine].filter((e) => !theirs.has(e)), onlyThem = [...theirs].filter((e) => !mine.has(e)), both = [...mine].filter((e) => theirs.has(e));
    const li = (el) => `<li><span>${esc(E[el]?.web_name)} <small style="color:var(--muted)">${pos(el)}</small></span><span>form ${E[el]?.form} · ${fxStrip(E[el].team, gwNext, 3)}</span></li>`;
    const rc = chipsLeft(r.m).filter((c) => !c.used).map((c) => CHIP_LABEL[c.name]).join(" ") || "none";
    const mc = chipsLeft(myM).filter((c) => !c.used).map((c) => CHIP_LABEL[c.name]).join(" ") || "none";
    const meRow = members.find((x) => x.entry === me);
    const rCap = squadOf(r.m).find((p) => p[3]);
    $("#cmp").innerHTML = `
      <div class="panel-head"><h2>You vs ${esc(r.player_name)}</h2>
        <label class="controls"><span class="note">Rival</span><select id="rivalSel">${[...members].sort((a, b) => a.rank - b.rank).filter((x) => x.entry !== me).map((x) => `<option value="${x.entry}" ${x.entry === rival ? "selected" : ""}>${x.rank}. ${esc(x.player_name)}</option>`).join("")}</select></label></div>
      <p class="note">${esc(r.entry_name)} · ${r.total - meRow.total > 0 ? r.total - meRow.total + " pts ahead of you" : r.total === meRow.total ? "level on points" : meRow.total - r.total + " pts behind you"} · their chips left: ${rc} · yours: ${mc} · their captain: ${rCap ? esc(E[rCap[0]]?.web_name) : "–"} · ${both.length} players in common</p>
      <div class="cmp">
        <div><h3>Only you have (${onlyMe.length})</h3><ul class="plist">${onlyMe.map(li).join("") || '<li class="empty">None</li>'}</ul></div>
        <div><h3>Only they have (${onlyThem.length})</h3><ul class="plist">${onlyThem.map(li).join("") || '<li class="empty">None</li>'}</ul></div>
        <div><h3>Shared (${both.length})</h3><ul class="plist">${both.map(li).join("") || '<li class="empty">None</li>'}</ul></div>
      </div>`;
    $("#rivalSel").addEventListener("change", (ev) => { store.set("rival", Number(ev.target.value)); renderLeague(); });
  }

  // ---------- planner ----------
  let selOut = null;
  function planState() { return store.get("plan:" + gwNext, []); }
  function setPlan(p) { store.set("plan:" + gwNext, p); }
  function plannedSquad() {
    const plan = planState();
    const sq = squadOf(myM).map((p) => ({ el: p[0], slot: p[1], orig: p[0] }));
    plan.forEach(({ out, inn }) => { const s = sq.find((x) => x.el === out); if (s) s.el = inn; });
    return sq;
  }
  // ---- prices: paid (latest transfer in, else opening-day price) and sale price under FPL's 50% rule ----
  function boughtPrice(id) { let best = null; (D.transfers || []).forEach((t) => { if (t[1] === id && (!best || t[0] >= best[0])) best = t; }); return best ? best[2] : E[id].now_cost - (E[id].cost_change_start || 0); }
  function sellPrice(id) {
    if (!squadOf(myM).some((p) => p[0] === id)) return E[id].now_cost; // bought this week: sells at today's price
    const b = boughtPrice(id), n = E[id].now_cost; return n <= b ? n : b + Math.floor((n - b) / 2);
  }
  // FPL's own price-change progress: ±100% means the price changes at the next overnight update.
  function priceMove(e) {
    const pct0 = parseFloat(e.price_change_percent) || 0;
    const pr = Array.isArray(e.price_change_projections) ? e.price_change_projections : [];
    const dl = D.price_deadlines || [];
    const by = (off) => (dl[off] ? "by " + new Date(dl[off]).toLocaleDateString("en-GB", { timeZone: "Europe/London", weekday: "short", day: "numeric", month: "short" }) : off === 0 ? "tonight" : `in ${off + 1} nights`);
    if (e.price_change_locked_until && Date.parse(e.price_change_locked_until) > Date.now()) return { pct: pct0, txt: "Locked after a recent change", cls: "" };
    if (e.price_change_calibrating) return { pct: pct0, txt: "FPL is recalibrating", cls: "" };
    const hit = pr.find((x) => Math.abs(parseFloat(x.projected_percent)) >= 100);
    if (hit) { const up = parseFloat(hit.projected_percent) > 0; return { pct: pct0, txt: `${up ? "Rise" : "Fall"} ${Math.abs(hit.likelihood) >= 3 ? "expected" : "possible"} ${by(hit.offset)}`, cls: up ? "up" : "down" }; }
    if (Math.abs(pct0) >= 70) return { pct: pct0, txt: pct0 > 0 ? "Close to rising" : "Close to falling", cls: pct0 > 0 ? "up" : "down" };
    return { pct: pct0, txt: "No change expected soon", cls: "" };
  }
  const pbar = (pct) => `<span class="pbar" title="${pct.toFixed(1)}% of the way to a price change"><i class="${pct >= 0 ? "pos" : "neg"}" style="width:${Math.min(50, Math.abs(pct) / 2)}%"></i></span>`;
  const kfmt = (n) => (Math.abs(n) >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n));
  const statusPill = (e) => {
    if (e.status === "s") return `<span class="pill sev3">Suspended</span>`;
    if (["i", "u", "n"].includes(e.status) || availability(e) === 0) return `<span class="pill sev3">${e.status === "i" ? "Injured" : "Unavailable"}</span>`;
    if (availability(e) < 1) return `<span class="pill sev2">${pct(availability(e))} to play</span>`;
    return `<span class="pill ok">Fit</span>`;
  };

  function renderPlanner() {
    const h = store.get("horizon", 5);
    const plan = planState();
    const sq = plannedSquad();
    const bank0 = myM.picks?.bank ?? lastHist(myM)[8];
    const bank = plan.reduce((b, { out, inn }) => b + (E[out] ? sellPrice(out) : 0) - (E[inn]?.now_cost || 0), bank0);
    const ft = freeTransfers(myM, D.entry.started_event || 1);
    const hits = Math.max(0, plan.length - ft) * 4;
    const gain = plan.reduce((g, { out, inn }) => g + project(E[inn], h) - project(E[out], h), 0);
    const teamCount = {}; sq.forEach((s) => (teamCount[E[s.el].team] = (teamCount[E[s.el].team] || 0) + 1));
    const mine = new Set(sq.map((s) => s.el));

    // Squad table
    const rowsHTML = [1, 2, 3, 4].map((t) => `<tr class="half"><td colspan="13">${{ 1: "Goalkeepers", 2: "Defenders", 3: "Midfielders", 4: "Forwards" }[t]}</td></tr>` + sq.filter((s) => E[s.el].element_type === t).map((s) => {
      const e = E[s.el], isNew = s.el !== s.orig, pm = priceMove(e);
      const bought = isNew ? e.now_cost : boughtPrice(e.id), sell = isNew ? e.now_cost : sellPrice(e.id), profit = sell - bought;
      const net = (e.transfers_in_event || 0) - (e.transfers_out_event || 0);
      return `<tr class="click ${selOut === s.el ? "sel" : ""} ${isNew ? "newrow" : ""}" data-out="${s.el}" tabindex="0">
        <td><span class="mgr"><span>${esc(e.web_name)} ${statusPill(e)}${isNew ? ' <span class="pill acc">New</span>' : ""}</span><small>${POSN(e)} · ${tShort(e.team)}${s.slot > 11 ? " · bench" : ""}${e.news ? ` · <span class="down">${esc(e.news)}</span>` : ""}</small></span></td>
        <td class="n"><strong>£${price(e.now_cost)}m</strong></td>
        <td class="n">£${price(bought)}m → £${price(sell)}m <span class="${profit > 0 ? "up" : profit < 0 ? "down" : "note"}">(${profit === 0 ? "0.0" : (profit > 0 ? "+" : "−") + price(Math.abs(profit))})</span></td>
        <td><span class="pmove"><span><strong class="${pm.pct >= 0 ? "up" : "down"}">${pm.pct > 0 ? "+" : ""}${pm.pct.toFixed(0)}%</strong> ${pbar(pm.pct)}</span><small class="${pm.cls}">${pm.txt}</small></span></td>
        <td class="n ${net > 0 ? "up" : net < 0 ? "down" : ""}">${net > 0 ? "+" : ""}${kfmt(net)}</td>
        <td class="n">${e.starts}</td>
        <td class="n">${fmt(e.minutes)}</td>
        <td class="n">${Number(e.expected_goals).toFixed(2)}</td>
        <td class="n">${Number(e.expected_assists).toFixed(2)}</td>
        <td class="n">${Number(e.expected_goal_involvements).toFixed(2)}</td>
        <td class="n">${ycBadge(e) ? ycBadge(e).replace('class="yc', 'class="yc sm') : e.yellow_cards || 0}${e.red_cards ? ` <span class="note">${e.red_cards} red</span>` : ""}</td>
        <td class="n"><strong>${e.ep_next}</strong> <small class="note">${e.points_per_game}/g</small></td>
      </tr>`;
    }).join("")).join("");
    const tot = sq.reduce((a, s) => { const e = E[s.el], isNew = s.el !== s.orig; a.now += e.now_cost; a.sell += isNew ? e.now_cost : sellPrice(e.id); a.bought += isNew ? e.now_cost : boughtPrice(e.id); return a; }, { now: 0, sell: 0, bought: 0 });

    let repl = "";
    if (selOut) {
      const o = E[selOut];
      const budget = bank + sellPrice(o.id);
      const q = ($("#q")?.value || "").toLowerCase();
      const cands = Object.values(E).filter((e) => e.element_type === o.element_type && !mine.has(e.id) && e.now_cost <= budget
        && ((teamCount[e.team] || 0) - (e.team === o.team ? 1 : 0)) < 3 && availability(e) > 0 && (!q || e.web_name.toLowerCase().includes(q)))
        .map((e) => ({ e, p: project(e, h) })).sort((a, b) => b.p - a.p).slice(0, 25);
      repl = `<div class="panel" id="replPanel">
        <div class="panel-head"><h3>Replacements for ${esc(o.web_name)} (sells for £${price(sellPrice(o.id))}m, budget £${price(budget)}m)</h3><div class="controls"><input type="search" id="q" placeholder="Filter by name" value="${esc(q)}"><button class="btn sm" id="closeRepl">Close</button></div></div>
        <div class="tbl-wrap"><table class="cards-sm"><thead><tr><th>Player</th><th class="n">£</th><th class="n">Form</th><th class="n">xGI/90</th><th class="n">FPL xP</th><th class="n">Proj ${h}GW</th><th class="n">vs out</th><th class="n">League</th><th>Next fixtures</th><th></th></tr></thead><tbody>
        ${cands.map(({ e, p }) => `<tr><td><span class="mgr">${esc(e.web_name)}<small>${tShort(e.team)}${e.news ? " · " + esc(e.news) : ""}</small></span></td><td class="n">${price(e.now_cost)}</td><td class="n">${e.form}</td><td class="n">${Number(e.expected_goal_involvements_per_90 || 0).toFixed(2)}</td><td class="n">${e.ep_next}</td><td class="n"><strong>${p.toFixed(1)}</strong></td><td class="n ${p - project(o, h) >= 0 ? "up" : "down"}">${sign(Number((p - project(o, h)).toFixed(1)))}</td><td class="n">${Math.round((own[e.id] || 0) * 100)}%</td><td>${fxStrip(e.team, gwNext, Math.min(h, 6))}</td><td><button class="btn sm pri" data-in="${e.id}">Bring in</button></td></tr>`).join("") || '<tr><td colspan="10" class="empty">Nobody fits this budget and team limit.</td></tr>'}
        </tbody></table></div></div>`;
    }

    const capRank = sq.filter((s) => s.slot <= 11).map((s) => E[s.el]).sort((a, b) => parseFloat(b.ep_next) - parseFloat(a.ep_next)).slice(0, 5);

    $("#app").innerHTML = `
    <section class="view">
      <div class="panel-head"><h2>GW${gwNext} transfer planner</h2>
        <label class="controls"><span class="note">Projection window</span><select id="hz">${[3, 5, 8].map((v) => `<option value="${v}" ${v === h ? "selected" : ""}>Next ${v} GWs</option>`).join("")}</select></label></div>
      <div class="plan-sum">
        <div><div class="k">In the bank</div><div class="v ${bank < 0 ? "down" : ""}">£${price(bank)}m</div></div>
        <div><div class="k">Transfers</div><div class="v">${plan.length} / ${ft} free</div></div>
        <div><div class="k">Hit cost</div><div class="v ${hits ? "down" : ""}">${hits ? "−" + hits : "0"}</div></div>
        <div><div class="k">Projected gain</div><div class="v ${gain - hits >= 0 ? "up" : "down"}">${sign(Number((gain - hits).toFixed(1)))}</div></div>
      </div>
      ${plan.length ? `<ul class="moves">${plan.map(({ out, inn }, i) => `<li><span><span class="down">${esc(E[out].web_name)}</span> → <span class="up">${esc(E[inn].web_name)}</span> <span class="note">sells £${price(sellPrice(out))}m → costs £${price(E[inn].now_cost)}m</span></span><button class="btn sm" data-undo="${i}">Undo</button></li>`).join("")}</ul><div class="controls"><button class="btn" id="reset">Clear plan</button></div>` : ""}

      <div class="panel">
        <div class="panel-head"><h2>Squad</h2><span class="note">Tap a player to see replacements. Plans are saved in this browser only.</span></div>
        <div class="sq-sum">
          <span><span class="k">Squad value</span> <strong>£${price(tot.now)}m</strong></span>
          <span><span class="k">Sale value</span> <strong>£${price(tot.sell)}m</strong></span>
          <span><span class="k">Paid</span> <strong>£${price(tot.bought)}m</strong></span>
          <span><span class="k">Profit if sold</span> <strong class="${tot.sell - tot.bought >= 0 ? "up" : "down"}">${tot.sell - tot.bought >= 0 ? "+" : "−"}£${price(Math.abs(tot.sell - tot.bought))}m</strong></span>
          <span><span class="k">In the bank</span> <strong>£${price(bank)}m</strong></span>
        </div>
        <div class="tbl-wrap"><table class="cards-sm squad-tbl">
          <thead><tr><th>Player</th><th class="n">Price</th><th class="n">Paid → sells for (profit)</th><th>Price change</th><th class="n">Net transfers this GW</th><th class="n">Starts</th><th class="n">Mins</th><th class="n">xG</th><th class="n">xA</th><th class="n">xGI</th><th class="n">Yellows</th><th class="n">FPL xPts</th></tr></thead>
          <tbody>${rowsHTML}</tbody>
        </table></div>
        <p class="note">Price change is FPL's own progress towards a price change: at +100% the price rises £0.1m at the next overnight update, at −100% it falls. You keep half of any rise when selling (rounded down to £0.1m). xG, xA and xGI are season totals; FPL xPts is FPL's expected points for GW${gwNext}, with points per game alongside.</p>
      </div>
      ${repl}
      <div class="grid-2">
        <div class="panel">
          <div class="panel-head"><h3>Captain shortlist for GW${gwNext}</h3><span class="note">By FPL's expected points</span></div>
          <ul class="plist">${capRank.map((e) => `<li><span><strong>${esc(e.web_name)}</strong> ${nextFx(e.team) ? fxLabel(nextFx(e.team).list[0]) : ""}</span><span>xP ${e.ep_next}${capCount[e.id] ? ` · ${capCount[e.id]} of ${D._n} captained him in GW${gwCur}` : ""}</span></li>`).join("")}</ul>
        </div>
        <div class="panel">
          <div class="panel-head"><h3>Chips</h3></div>
          <p class="note">${chipsLeft(myM).map((c) => `<span class="chip ${c.used ? "used" : ""}">${CHIP_LABEL[c.name]}</span>`).join(" ")} ${chipAdvice()}</p>
        </div>
      </div>
      <div class="panel" id="targets"><div class="panel-head"><h2>Players to target</h2></div><p class="empty">Ranking players on fixtures, xG, xA, defensive contributions and price…</p></div>
      <div class="panel" id="top10"><div class="panel-head"><h2>What the top 10 own</h2></div><p class="empty">Working out top-10 ownership and next-gameweek projections…</p></div>
      <p class="note">Planner projections: average of form and points per game, scaled per fixture by difficulty (easiest ×1.25 to hardest ×0.7), adjusted for injury flags, summed over the window. Double gameweeks count twice; blanks count zero. Budgets use your real sale prices. Free transfers are estimated from your transfer history.</p>
    </section>`;

    $("#hz").addEventListener("change", (e) => { store.set("horizon", Number(e.target.value)); renderPlanner(); });
    const pickOut = (v) => { selOut = selOut === v ? null : v; renderPlanner(); if (selOut) $("#replPanel")?.scrollIntoView({ behavior: "smooth", block: "start" }); };
    document.querySelectorAll("tr[data-out]").forEach((tr) => { tr.addEventListener("click", () => pickOut(Number(tr.dataset.out))); tr.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pickOut(Number(tr.dataset.out)); } }); });
    $("#closeRepl")?.addEventListener("click", () => { selOut = null; renderPlanner(); });

    renderTargets(sq.map((x) => x.el), bank);

  // ---- Players to target: a points model built from FPL's scoring rules ----
  // Per match: appearance (2 for 60+ mins), goals x position goal points plus assists x 3 (from xG/xA per 90,
  // scaled by fixture or bookmaker odds), clean sheet chance (team xG conceded, scaled by fixture or odds),
  // defensive contribution points (chance of 10+ actions for defenders, 12+ for midfielders and forwards),
  // saves for keepers, bonus rate, minus goals conceded. Then minutes share, availability, bans and
  // returning rivals. Ranked on 60% this model and 40% form-based projection.
  const poisAtLeast = (l, k) => { let p = Math.exp(-l), c = p; for (let i = 1; i < k; i++) { p *= l / i; c += p; } return Math.max(0, 1 - c); };
  const DEF_MULT = { 1: 0.7, 2: 0.85, 3: 1, 4: 1.2, 5: 1.4 };
  const SCORE = { 1: { g: 10, cs: 4 }, 2: { g: 6, cs: 4 }, 3: { g: 5, cs: 1 }, 4: { g: 4, cs: 0 } };
  function modelPts(e, n, TO) {
    const t = e.element_type, S = SCORE[t];
    const xg = +e.expected_goals_per_90 || 0, xa = +e.expected_assists_per_90 || 0, xgc = +e.expected_goals_conceded_per_90 || 1.3;
    const dc = +e.defensive_contribution_per_90 || 0, sv = +e.saves_per_90 || 0;
    const share = Math.min(1, minutesInfo(e).avg / 90), full = share >= 0.66;
    const bonus90 = e.minutes > 0 ? (e.bonus / e.minutes) * 90 : 0;
    const dcP = t === 1 ? 0 : poisAtLeast(dc, t === 2 ? 10 : 12);
    let tot = 0;
    for (let g = gwNext, i = 0; i < n && g <= 38; g++, i++) {
      let pts = 0;
      (teamFx[e.team][g] || []).forEach((f, k) => {
        const o = i === 0 && k === 0 ? TO[e.team] : null;
        const am = o ? Math.min(1.5, Math.max(0.6, o.lam / 1.35)) : FDR_MULT[f.fdr];
        const conceded = o ? -Math.log(Math.max(0.01, o.cs)) : xgc * DEF_MULT[f.fdr];
        pts += (full ? 2 : 1) + (xg * S.g + xa * 3) * am * share + (full ? S.cs * Math.exp(-conceded) : 0) + 2 * dcP * share + (t === 1 ? (sv / 3) * share : 0) + bonus90 * am * share - (t <= 2 ? (conceded / 2) * 0.6 * share : 0);
      });
      tot += pts * availFor(e, g, i) * (1 - banMiss(e, i)) * compFactor(e, i);
    }
    return { total: tot, dcP };
  }
  async function renderTargets(squadIds, bank) {

    if (!document.body.contains(box)) return;
    const TO = teamOdds();
    const pool0 = (t) => Object.values(E).filter((e) => e.element_type === t && !mine.has(e.id) && isFit(e) && e.minutes >= 270);
    const pre = [1, 2, 3, 4].flatMap((t) => pool0(t).map((e) => [e.id, modelPts(e, n, TO).total]).sort((a, b) => b[1] - a[1]).slice(0, 14).map((x) => x[0]));
    try { await fetchSumm(pre); } catch (e) { /* season minutes used */ }
    if (!document.body.contains(box)) return;
    const pctl = {}; // percentile of a stat within the position (players with 450+ minutes)
    const rankIn = (t, key, v) => { const k = t + key; if (!pctl[k]) pctl[k] = Object.values(E).filter((e) => e.element_type === t && e.minutes >= 450).map((e) => +e[key] || 0).sort((a, b) => a - b); const arr = pctl[k]; let i = 0; while (i < arr.length && arr[i] <= v) i++; return arr.length ? i / arr.length : 0; };
    const maxSell = (t) => Math.max(0, ...squadIds.filter((id) => E[id].element_type === t).map((id) => sellPrice(id)));
    const POSNAME = { 1: "Goalkeepers", 2: "Defenders", 3: "Midfielders", 4: "Forwards" };

    const leadOwns = new Set(squadOf(lead.m).map((p) => p[0]));
    const blocks = [1, 2, 3, 4].map((t) => {
      const list = pool0(t).filter((e) => minutesInfo(e).avg >= 60 && sevOf(risks(e, TO)) < 2)
        .map((e) => { const m = modelPts(e, n, TO); return { e, m: m.total, dcP: m.dcP, score: expertScore(e, n, TO), fdr: windowFdr(e.team, n) }; })
        .sort((a, b) => b.score - a.score).slice(0, 6);
      const budget = bank + maxSell(t);
      const rows = list.map((c) => {
        const e = c.e, why = [];

        if (t >= 2) { const r = rankIn(t, "expected_goal_involvements_per_90", +e.expected_goal_involvements_per_90); if (r >= 0.8) why.push(`xGI ${(+e.expected_goal_involvements_per_90).toFixed(2)} per 90, top ${Math.max(1, Math.round((1 - r) * 100))}% of ${POSN(e)}s`); }
        if (t >= 2 && c.dcP >= 0.3) why.push(`earns defensive contribution points in about ${pct(c.dcP)} of games (${(+e.defensive_contribution_per_90).toFixed(1)} actions per 90)`);
        if (t === 1 && +e.saves_per_90 >= 3) why.push(`${(+e.saves_per_90).toFixed(1)} saves per 90`);
        if (t <= 2 && TO[e.team]) why.push(`${pct(TO[e.team].cs)} clean sheet chance in GW${gwNext}`);
        if (t >= 3 && TO[e.team] && TO[e.team].score >= 0.75) why.push(`${tShort(e.team)} ${pct(TO[e.team].score)} to score in GW${gwNext}`);
        why.push(`${(c.score / (e.now_cost / 10)).toFixed(1)} projected pts per £m`);
        const aff = e.now_cost <= budget;
        return `<tr><td><span class="mgr"><span>${esc(e.web_name)}${ycBadge(e)}</span><small>${tShort(e.team)} · £${price(e.now_cost)}m · ${e.selected_by_percent}% owned${leadOwns.has(e.id) ? ` · ${esc(firstName(lead))} owns` : ""}</small></span></td>
          <td>${fxStrip(e.team, gwNext, n)}</td><td class="n">${avgBadge(c.fdr)}</td>

      }).join("");
      return `<div class="tgt"><h3>${POSNAME[t]}</h3><div class="tbl-wrap"><table class="fx-tbl cards-sm">
        <thead><tr><th>Player</th><th>Next ${n}</th><th class="n">Avg FDR</th><th class="n">xG/90</th><th class="n">xA/90</th><th class="n">xGI/90</th><th class="n">${t === 1 ? "Saves/90" : "Defcon/90"}</th><th class="n">Mins</th><th class="n">Proj ${n} GW</th><th>Why</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="10" class="empty">No fit, nailed-on players found.</td></tr>`}</tbody></table></div></div>`;
    }).join("");
    box.innerHTML = `
      <div class="panel-head"><h2>Players to target</h2>
        <div class="controls"><span class="note">Fixtures over</span><div class="seg" role="group" aria-label="Fixture window">${[3, 5].map((v) => `<button data-recn="${v}" aria-pressed="${v === n}">Next ${v} GWs</button>`).join("")}</div></div></div>
      <p class="note">Players you don't own, ranked by projected points from fixtures, xG and xA per 90, defensive contributions, saves, clean sheet chances, bookmaker odds for GW${gwNext} and minutes. Only fit players averaging 60+ minutes with no injury, ban or returning-rival risk are listed. "Affordable now" means you could buy him by selling your priciest player in that position.</p>
      ${blocks}`;
    box.querySelectorAll("[data-recn]").forEach((b) => b.addEventListener("click", () => { store.set("recN", Number(b.dataset.recn)); renderTargets(squadIds, bank); }));

  // ---- Captaincy shortlist: chance of scoring with a likely range, plus projected captain points ----
  // Expected goals in the match = xG per 90 x expected minutes share x fitness x (bookmakers' expected
  // goals for his team in this match / his team's season xG per game). Chance of scoring = 1 - e^-expected.
  // The range widens with fewer matches played, patchy minutes and fitness doubts.
  const teamXGpg = (team) => { const gp = teamPlayed(team) || 1; return Object.values(E).filter((e) => e.team === team).reduce((a, e) => a + (+e.expected_goals || 0), 0) / gp; };
  function scoreChance(e, TO) {
    const fx = teamFx[e.team][gwNext] || []; if (!fx.length) return null;
    const xg90 = +e.expected_goals_per_90 || 0, mi = minutesInfo(e);
    const share = Math.min(1, mi.avg / 90) * availability(e) * (1 - banMiss(e, 0));
    let lam = 0;
    fx.forEach((f, k) => { const o = k === 0 ? TO[e.team] : null; const tf = o ? Math.min(1.8, Math.max(0.5, o.lam / Math.max(0.6, teamXGpg(e.team)))) : FDR_MULT[f.fdr]; lam += xg90 * share * tf; });
    const games = e.minutes / 90;
    // Uncertainty: fewer matches, swinging minutes, a hot or cold finishing streak and fitness doubts all widen it.
    const h = FA.summ[e.id]; let vol = 0.03;
    if (h && h.length >= 3) { const by = {}; h.forEach(([r, m]) => (by[r] = (by[r] || 0) + m)); const ms = Object.keys(by).map(Number).sort((a, b) => b - a).slice(0, 5).map((r) => Math.min(90, by[r])); const mean = ms.reduce((a, b) => a + b, 0) / ms.length; vol = Math.sqrt(ms.reduce((a, b) => a + (b - mean) ** 2, 0) / ms.length) / 90 * 0.35; }
    const gap = Math.abs(e.goals_scored - (+e.expected_goals || 0));
    let cv = 0.04 + 0.25 / Math.sqrt(Math.max(1, games)) + vol + 0.03 * gap;
    if (mi.avg < 75) cv += 0.08; if (availability(e) < 1) cv += 0.12;
    const P = (l) => 1 - Math.exp(-Math.max(0, l));
    const lo = P(lam * (1 - 1.645 * cv)), hi = P(lam * (1 + 1.645 * cv)), w = hi - lo;
    // Banker / Solid / Punt reflects how reliable the player's numbers are, not the fixture.
    return { p: P(lam), lo, hi, lam, fx, kind: cv <= 0.15 ? "bank" : cv <= 0.21 ? "solid" : "punt" };
  }

  // ================= Deeper Insights sections =================
  // Per-gameweek player stats come from /api/gw/{n}: [minutes, points, xG, xA, xG conceded, saves, bonus,
  // defensive contributions, starts]. Finished gameweeks are stored once; the current one is always fresh.
  async function loadGw(gws) {
    INS.gw = INS.gw || {};

      try { const r = await fetch(`api/gw/${g}`, { cache: "no-store" }); if (r.ok && (r.headers.get("content-type") || "").includes("json")) INS.gw[g] = (await r.json()).els; } catch (e) { /* skip */ }

  }
  const gwv = (g, id) => (INS.gw && INS.gw[g] && INS.gw[g][id]) || null;
  const gwPts = (g, id) => (gwv(g, id) || [0, 0])[1];
  // Expected points for one player in one gameweek, from that game's xG, xA and xG conceded
  // (appearance, bonus, saves and defensive contributions as they happened).
  function xPtsOf(g, id) {
    const v = gwv(g, id); if (!v || !v[0]) return 0;
    const [m, , xg, xa, xgc, sv, bon, dc] = v, t = E[id]?.element_type || 3, S = SCORE[t], full = m >= 60;
    return (full ? 2 : 1) + xg * S.g + xa * 3 + (full ? S.cs * Math.exp(-xgc) : 0) + (t === 1 ? Math.floor(sv / 3) : 0) + bon
      + ((t === 2 && dc >= 10) || (t >= 3 && dc >= 12) ? 2 : 0) - (t <= 2 && full ? 0.3 * xgc : 0);
  }

  const picksOf = (g, entry) => { const P = INS.picks && INS.picks[g]; const m = P && P.managers.find((x) => x.entry === entry); return m && m.picks && m.picks.length ? m : null; };
  const finishedGws = () => D.events.filter((e) => e.finished && e.id <= gwCur).map((e) => e.id);

  // 4. Team form: xG for and against per match over the last 6, with a trend (last 3 vs the 3 before)
  function teamForm() {
    if (INS.form) return INS.form;
    const xgf = {}; // team -> gw -> xG
    Object.entries(INS.gw || {}).forEach(([g, els]) => Object.entries(els).forEach(([id, v]) => { const t = E[id]?.team; if (!t) return; ((xgf[t] = xgf[t] || {})[g] = (xgf[t][g] || 0) + v[2]); }));
    const out = {};
    D.teams.forEach((t) => {
      const games = finishedGws().filter((g) => (teamFx[t.id][g] || []).length).slice(-6).map((g) => {
        const n = teamFx[t.id][g].length, opp = teamFx[t.id][g].map((f) => f.opp);
        return { g, f: ((xgf[t.id] || {})[g] || 0) / n, a: opp.reduce((s2, o) => s2 + ((xgf[o] || {})[g] || 0), 0) / n };
      });
      const avg = (arr, k) => (arr.length ? arr.reduce((s2, x) => s2 + x[k], 0) / arr.length : 0);
      const l3 = games.slice(-3), p3 = games.slice(-6, -3);
      out[t.id] = { f: avg(games, "f"), a: avg(games, "a"), df: avg(l3, "f") - avg(p3, "f"), da: avg(l3, "a") - avg(p3, "a"), n: games.length };
    });
    return (INS.form = out);
  }
  function renderTeamForm() {
    const box = $("#teamForm"); if (!box) return;
    const F = teamForm(), mineTeams = new Set(squadOf(myM).map((p) => E[p[0]].team));
    const arrow = (d, good) => (Math.abs(d) < 0.15 ? '<span class="note">→</span>' : (d > 0) === good ? `<span class="up">▲ ${Math.abs(d).toFixed(2)}</span>` : `<span class="down">▼ ${Math.abs(d).toFixed(2)}</span>`);
    const rows = D.teams.map((t) => ({ t, ...F[t.id] })).sort((a, b) => (b.f - b.a) - (a.f - a.a));
    box.innerHTML = `
      <div class="panel-head"><h3>Team form: expected goals over the last 6</h3><span class="note">Per match. Arrows compare the last 3 with the 3 before; green is improving</span></div>
      <div class="tbl-wrap"><table class="fx-tbl cards-sm"><thead><tr><th>Team</th><th class="n">Attack: xG for</th><th class="n">Trend</th><th class="n">Defence: xG against</th><th class="n">Trend</th><th class="n">xG difference</th><th>Next 3</th></tr></thead>
      <tbody>${rows.map((r) => `<tr class="${mineTeams.has(r.t.id) ? "me" : ""}"><td>${esc(r.t.name)}</td><td class="n"><strong>${r.f.toFixed(2)}</strong></td><td class="n">${arrow(r.df, true)}</td><td class="n"><strong>${r.a.toFixed(2)}</strong></td><td class="n">${arrow(r.da, false)}</td><td class="n ${r.f - r.a >= 0 ? "up" : "down"}">${r.f - r.a >= 0 ? "+" : "−"}${Math.abs(r.f - r.a).toFixed(2)}</td><td>${fxStrip(r.t.id, gwNext, 3)}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">Built from every player's xG in each game (Opta, via FPL). Unlike FPL's fixture difficulty, which barely changes, this shows how teams are actually playing now: target attackers facing leaky defences and defenders facing toothless attacks. Highlighted rows are clubs you own players from.</p>`;

  // 9. Minutes security: how nailed each player is, from every gameweek's minutes and starts
  function renderMinSec() {
    const box = $("#minSec"); if (!box) return;
    const fin = finishedGws().filter((g) => INS.gw[g]);
    const sec = (e) => {
      const games = fin.filter((g) => (teamFx[e.team][g] || []).length);
      if (!games.length) return null;
      const mins = games.map((g) => (gwv(g, e.id) || [0])[0]), starts = games.reduce((a, g) => a + ((gwv(g, e.id) || [])[8] || 0), 0);
      const early = games.filter((g) => { const v = gwv(g, e.id); return v && v[8] >= 1 && v[0] < 60 && (teamFx[e.team][g] || []).length === 1; }).length;
      const avgM = mins.reduce((a, b) => a + b, 0) / games.length, last3 = mins.slice(-3);
      const idx = Math.round(100 * (0.55 * Math.min(1, starts / games.length) + 0.25 * (starts ? 1 - early / starts : 0) + 0.2 * Math.min(1, avgM / 90)));
      return { games: games.length, starts, early, avgM, last3, idx };
    };
    const top = top10Rivals(), own10 = {}; top.forEach((x) => squadOf(x.m).forEach((p) => (own10[p[0]] = (own10[p[0]] || 0) + 1)));
    const mineIds = squadOf(myM).map((p) => p[0]);
    const tmpl = Object.keys(own10).map(Number).filter((id) => !mineIds.includes(id) && own10[id] >= 3 && E[id]?.element_type > 1);
    const rows = [...mineIds.map((id) => ({ id, mine: true })), ...tmpl.map((id) => ({ id, mine: false }))].map((r) => ({ ...r, e: E[r.id], s: sec(E[r.id]) })).filter((r) => r.s && r.e.element_type > 1).sort((a, b) => a.s.idx - b.s.idx);
    const pill = (i) => (i >= 80 ? '<span class="pill ok">Secure</span>' : i >= 60 ? '<span class="pill sev2">Watch</span>' : '<span class="pill sev3">Risk</span>');
    INS.minSec = rows.filter((r) => r.mine && r.s.idx < 60 && squadOf(myM).find((p) => p[0] === r.id)[1] <= 11);
    box.innerHTML = `
      <div class="panel-head"><h3>Minutes security</h3><span class="note">Your outfield players and those owned by 3+ of the top 10, riskiest first</span></div>
      <div class="tbl-wrap"><table class="cards-sm ms-tbl"><thead><tr><th>Player</th><th>Security</th><th class="n">Index</th><th class="n">Starts</th><th class="n">Subbed off early</th><th class="n">Avg mins</th><th class="n">Last 3</th></tr></thead>
      <tbody>${rows.map((r) => `<tr class="${r.mine ? "me" : ""}"><td><span class="mgr"><span>${esc(r.e.web_name)}${r.mine ? ' <span class="pill acc">Yours</span>' : ` <small class="note">${own10[r.id]} of ${top.length} top-10 own</small>`}</span><small>${POSN(r.e)} · ${tShort(r.e.team)}</small></span></td><td>${pill(r.s.idx)}</td><td class="n"><strong>${r.s.idx}</strong></td><td class="n">${r.s.starts} of ${r.s.games}</td><td class="n">${r.s.early}</td><td class="n">${Math.round(r.s.avgM)}</td><td class="n">${r.s.last3.join(", ")}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">Index out of 100: 55% share of games started, 25% how often he lasts 60 minutes once started, 20% average minutes. Secure 80+, watch 60–79, risk under 60. A player who doesn't start doesn't score.</p>`;

  // ---- Key insights: a summary of everything on the Insights tab, rebuilt on every load ----
  // Cards pick the single most useful finding from each section; "What's changed" compares with the last
  // snapshot this browser saw (kept until something changes, or for 24 hours) to show trends between refreshes.
  const INS = {};
  function renderSummary() {
    const box = $("#insSummary"); if (!box) return;
    INS.swap = null;
    const TO = teamOdds();
    const mineIds = squadOf(myM).map((p) => p[0]), mine = new Set(mineIds);
    const lgOwn = {}; members.forEach((x) => squadOf(x.m).forEach((p) => (lgOwn[p[0]] = (lgOwn[p[0]] || 0) + 1)));
    const N = members.length;
    const fx = (e) => { const l = teamFx[e.team][gwNext] || []; return l.length ? l.map((f) => `${f.home ? "v" : "@"} ${tShort(f.opp)}`).join(", ") : "blank"; };
    const okFit = (e) => availability(e) >= 0.75 && e.status !== "s";
    const cards = [];

    // 1. Captain
    const cap = (INS.cap || []).slice().sort((a, b) => b.pts - a.pts);
    if (cap.length) {
      const c = cap[0], diff = cap.find((r) => r !== c && (lgOwn[r.e.id] || 0) <= 3 && r.pts >= c.pts * 0.8);
      cards.push({ k: "cap", label: "Captain", head: c.e.web_name, mine: mine.has(c.e.id),
        sub: `${c.pts.toFixed(1)} projected captain pts · ${pct(c.c.p)} to score · ${fx(c.e)}`,
        foot: diff ? `Differential: <strong>${esc(diff.e.web_name)}</strong> (${diff.pts.toFixed(1)} pts, ${lgOwn[diff.e.id] || 0} of ${N} own)` : `Owned by ${lgOwn[c.e.id] || 0} of ${N} in your league` });
      const likely = cap.slice().sort((a, b) => b.c.p - a.c.p)[0];
      if (likely && likely !== c) cards.push({ k: "goal", label: "Most likely scorer", head: likely.e.web_name, mine: mine.has(likely.e.id), sub: `${pct(likely.c.p)} chance of scoring ${fx(likely.e)} · ${likely.c.kind === "bank" ? "Banker" : likely.c.kind === "solid" ? "Solid" : "Punt"}`, foot: `${likely.pts.toFixed(1)} projected captain pts` });
    }
    // 2. Best value buy and weakest value in your squad
    if (INS.value) {
      const bv = INS.value.best.find((d) => !mine.has(d.e.id));
      if (bv) cards.push({ k: "buy", label: "Best value buy", head: bv.e.web_name, sub: `£${bv.x.toFixed(1)}m · ${bv.y.toFixed(1)} pts over 4 GWs · +${bv.res.toFixed(1)} above the value line`, foot: `${POSN(bv.e)} · ${tShort(bv.e.team)} · ${lgOwn[bv.e.id] || 0} of ${N} own` });
      const fit = (d) => INS.value.icpt + INS.value.slope * d;
      const starters = squadOf(myM).filter((p) => p[1] <= 11).map((p) => E[p[0]]);
      const myVal = starters.filter((e) => e.element_type >= 2 && e.minutes >= 300).map((e) => { const y = expertScore(e, 4, TO); return { e, y, res: y - fit(e.now_cost / 10) }; }).sort((a, b) => a.res - b.res);
      const w = myVal[0];
      if (w && w.res < -2) {
        const budget = (myM.picks?.bank ?? lastHist(myM)[8]) + sellPrice(w.e.id);
        const tc = {}; mineIds.forEach((id) => (tc[E[id].team] = (tc[E[id].team] || 0) + 1));
        const rep = Object.values(E).filter((e) => e.element_type === w.e.element_type && !mine.has(e.id) && e.now_cost <= budget && okFit(e) && e.minutes >= 300 && ((tc[e.team] || 0) - (e.team === w.e.team ? 1 : 0)) < 3)
          .map((e) => ({ e, y: expertScore(e, 4, TO) })).sort((a, b) => b.y - a.y)[0];
        INS.swap = rep && rep.y > w.y + 3 ? { out: w.e, inn: rep.e, gain: rep.y - w.y } : null;
        cards.push({ k: "sell", label: "Weakest value in your XI", head: w.e.web_name, mine: true, sub: `£${price(w.e.now_cost)}m for ${w.y.toFixed(1)} pts over 4 GWs · ${w.res.toFixed(1)} below the value line`,
          foot: INS.swap ? `Upgrade: <strong>${esc(rep.e.web_name)}</strong> (£${price(rep.e.now_cost)}m, +${INS.swap.gain.toFixed(1)} pts) fits your £${price(budget)}m budget` : `Sells for £${price(sellPrice(w.e.id))}m; no clearly better ${POSN(w.e)} fits your budget` });
      }
    }
    // 3. Due a goal / hot streak
    const att = Object.values(E).filter((e) => e.element_type >= 3 && e.minutes >= 450);
    const gap = (e) => e.goals_scored - (+e.expected_goals || 0);
    const due = att.filter((e) => okFit(e) && !mine.has(e.id) && (+e.expected_goals_per_90) >= 0.25).sort((a, b) => gap(a) - gap(b))[0];
    if (due && gap(due) <= -1) cards.push({ k: "goal", label: "Due a goal", head: due.e ? due.e.web_name : due.web_name, sub: `${due.goals_scored} goal${due.goals_scored === 1 ? "" : "s"} from ${(+due.expected_goals).toFixed(2)} xG (${gap(due).toFixed(1)}) · £${price(due.now_cost)}m`, foot: `${tShort(due.team)} ${fx(due)} · ${due.selected_by_percent}% own · ${lgOwn[due.id] || 0} of ${N} in league` });
    const hot = att.filter((e) => mine.has(e.id)).sort((a, b) => gap(b) - gap(a))[0];
    if (hot && gap(hot) >= 1.5) cards.push({ k: "watch", label: "Hot streak in your squad", head: hot.web_name, mine: true, sub: `${hot.goals_scored} goal${hot.goals_scored === 1 ? "" : "s"} from ${(+hot.expected_goals).toFixed(2)} xG (+${gap(hot).toFixed(1)})`, foot: "Finishing above his chances; returns may slow down" });
    // 4. Defence target and bonus magnet
    const g90 = (e) => (e.minutes ? (+e.expected_goals_conceded || 0) / e.minutes * 90 : 9);
    const def = Object.values(E).filter((e) => e.element_type === 2 && e.minutes >= 450 && okFit(e) && !mine.has(e.id))
      .map((e) => ({ e, s: expertScore(e, 4, TO) })).sort((a, b) => b.s - a.s)[0];
    if (def) cards.push({ k: "buy", label: "Defence target", head: def.e.web_name, sub: `xGA ${g90(def.e).toFixed(2)}/90 · defcon in ~${pct(poisAtLeast(+def.e.defensive_contribution_per_90 || 0, 10))} of games · £${price(def.e.now_cost)}m`, foot: `${tShort(def.e.team)} next 3: ${[0, 1, 2].map((i) => { const l = teamFx[def.e.team][gwNext + i] || []; return l.length ? tShort(l[0].opp) + (l[0].home ? " (H)" : " (A)") : "blank"; }).join(", ")}` });
    const bps = Object.values(E).filter((e) => e.minutes >= 450 && okFit(e) && !mine.has(e.id)).sort((a, b) => b.bps / b.minutes - a.bps / a.minutes)[0];
    if (bps) cards.push({ k: "diff", label: "Bonus magnet you don't own", head: bps.web_name, sub: `${((bps.bps / bps.minutes) * 90).toFixed(1)} BPS per 90 · ${bps.bonus} bonus pts · ${bps.total_points} total`, foot: `${POSN(bps)} · £${price(bps.now_cost)}m · ${lgOwn[bps.id] || 0} of ${N} in league own` });
    // 5. Price and form trends in your squad

    if (moves.length) cards.push({ k: moves.some((x) => x.pm.cls === "down") ? "sell" : "watch", label: "Price moves in your squad", head: `${moves.filter((x) => x.pm.cls === "up").length} rising · ${moves.filter((x) => x.pm.cls === "down").length} falling`,
