name = "fc27-planner"
main = "worker/src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
# Keep variables added in the Cloudflare dashboard (e.g. FPL_LOGIN) when deploying.
keep_vars = true

# The page and the data snapshot are bundled into the Worker as text.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt"]
fallthrough = true

# Cached bookmaker odds (refreshed at most every 4 hours to stay inside the free odds API quota).
# The odds API key is a Worker secret named ODDS_API_KEY (set in the Cloudflare dashboard).
[[kv_namespaces]]
binding = "ODDS"
id = "1612f48a342645ad8d40ddcb5b9303dc"

# Hourly check so odds refresh soon after each refresh point (3 days and 1 day before a deadline).
[triggers]
crons = ["7 * * * *"]
